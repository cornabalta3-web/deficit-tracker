  // ---------- tema según la hora ----------
  // Automático: claro de 7 a 20, oscuro el resto. Se puede fijar en Ajustes.
  // Los colores son variables de CSS: cambiar de tema no obliga a redibujar.
  function temaActual() {
    const t = goal.tema || "auto";
    if (t === "claro" || t === "oscuro") return t;
    const h = new Date().getHours();
    return h >= 7 && h < 20 ? "claro" : "oscuro";
  }
  function applyTheme() {
    const claro = temaActual() === "claro";
    document.documentElement.setAttribute("data-theme", claro ? "light" : "dark");
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", claro ? "#F1F7FF" : "#0A1E3D");
  }
  window.elegirTema = function (t) {
    if (["auto", "claro", "oscuro"].indexOf(t) === -1) return;
    goal = { ...goal, tema: t };
    persistGoal();
    applyTheme();
    render();
  };
  // Cada minuto: el tema (si es automático) y la hora del encabezado.
  setInterval(function () {
    applyTheme();
    const r = document.getElementById("reloj-hoy");
    if (r) r.textContent = horaLocal();
  }, 60000);

  // ---------- el gasto del día ----------
  //
  // gasto = total de una app (si lo dictaste, como antes) o
  //         tu base + el ejercicio que cargaste + lo que moviste a mano.
  // El ejercicio con nombre vive en `ejercicios` y su suma en `exerciseKcal`
  // (el campo de siempre); lo dictado antes de la v19 queda como "Ejercicio".
  // Mover la barra o escribir el número guarda la diferencia en `ajusteGasto`.
  const GASTO_TOPE = 7000;
  function metaDe(fecha) { return dayMeta[fecha] || {}; }
  function baseDe(fecha) { const m = metaDe(fecha); return m.maintenanceSnapshot != null ? m.maintenanceSnapshot : goal.maintenance; }
  function gastoInfo(fecha) {
    const m = metaDe(fecha);
    const base = baseDe(fecha);
    const items = Array.isArray(m.ejercicios) ? m.ejercicios : [];
    const ejercicio = Number(m.exerciseKcal) || 0;
    const suelto = Math.max(0, ejercicio - items.reduce((s, x) => s + (Number(x.kcal) || 0), 0));
    if (m.totalExpenditure != null) {
      const total = Number(m.totalExpenditure) || 0;
      return { base, items, suelto, ejercicio, ajuste: total - base - ejercicio, total, deApp: true };
    }
    const ajuste = Number(m.ajusteGasto) || 0;
    return { base, items, suelto, ejercicio, ajuste, total: base + ejercicio + ajuste, deApp: false };
  }
  function fijarGasto(fecha, total) {
    const m = metaDe(fecha);
    const base = baseDe(fecha);
    const t = Math.round(Math.max(GASTO_MIN, Math.min(GASTO_TOPE, total)));
    dayMeta = { ...dayMeta, [fecha]: { ...m, maintenanceSnapshot: base, totalExpenditure: null, ajusteGasto: t - base - (Number(m.exerciseKcal) || 0) } };
    persistDayMeta();
  }
  // yaContado: tu reloj ya lo tenía en el total que pusiste, así que el gasto
  // queda igual (lo que era "a mano" pasa a tener nombre).
  function sumarEjercicio(fecha, item, yaContado) {
    const m = metaDe(fecha);
    const info = gastoInfo(fecha);
    const nuevo = { id: uid(), nombre: item.nombre, act: item.act || null, min: item.min || null, int: item.int || null, kcal: Math.round(item.kcal) };
    if (yaContado) nuevo.incluido = true;
    dayMeta = { ...dayMeta, [fecha]: { ...m, maintenanceSnapshot: info.base, totalExpenditure: null,
      exerciseKcal: info.ejercicio + nuevo.kcal, ajusteGasto: info.ajuste - (yaContado ? nuevo.kcal : 0),
      ejercicios: info.items.concat(nuevo) } };
    persistDayMeta();
  }
  function quitarEjercicio(fecha, id) {
    const m = metaDe(fecha);
    const info = gastoInfo(fecha);
    const it = info.items.find((x) => x.id === id);
    if (!it) return;
    dayMeta = { ...dayMeta, [fecha]: { ...m, maintenanceSnapshot: info.base, totalExpenditure: null,
      exerciseKcal: Math.max(0, info.ejercicio - it.kcal), ajusteGasto: info.ajuste + (it.incluido ? it.kcal : 0),
      ejercicios: info.items.filter((x) => x.id !== id) } };
    persistDayMeta();
  }
  function rangoGasto(info) {
    const r50 = (v) => Math.round(v / 50) * 50;
    const min = Math.max(GASTO_MIN, r50(Math.min(info.base, info.total) - 400));
    const max = Math.min(GASTO_TOPE, Math.max(r50(info.base + 1600), r50(info.total + 300)));
    return { min, max };
  }
  // Las partes de la barra, en kcal: la base más apagada, lo cargado lleno y
  // lo movido a mano rayado. Si moviste para abajo, la barra se corta antes.
  function tramosGasto(info) {
    const out = [];
    let v = info.base;
    info.items.forEach((x) => { out.push({ desde: v, hasta: v + x.kcal, fondo: "var(--acento)" }); v += x.kcal; });
    if (info.suelto > 0) { out.push({ desde: v, hasta: v + info.suelto, fondo: "var(--acento)" }); v += info.suelto; }
    if (info.ajuste > 0) out.push({ desde: v, hasta: v + info.ajuste, fondo: "repeating-linear-gradient(135deg, var(--acento) 0 4px, transparent 4px 8px)", rayado: true });
    return out;
  }
  function tramosHTML(info, rango) {
    const pct = (v) => Math.max(0, Math.min(100, ((v - rango.min) / (rango.max - rango.min)) * 100));
    const tope = info.total;
    let h = `<i class="llena" style="left:0;width:${pct(Math.min(info.base, tope)).toFixed(2)}%;background:var(--gastoBase)"></i>`;
    tramosGasto(info).forEach((t, i) => {
      const hasta = Math.min(t.hasta, tope);
      if (hasta <= t.desde) return;
      h += `<i class="llena" style="left:${pct(t.desde).toFixed(2)}%;width:${(pct(hasta) - pct(t.desde)).toFixed(2)}%;background:${t.fondo};${t.rayado ? "box-shadow:inset 0 0 0 1.5px var(--acento);" : ""}animation-delay:${(0.15 + i * 0.12).toFixed(2)}s"></i>`;
    });
    return h;
  }
  function chipsGasto(fecha, info) {
    const chip = (fondo, texto, rayado, extra) => `<span class="p-parte" ${extra || ""}><i style="background:${fondo};${rayado ? "box-shadow:inset 0 0 0 1.5px var(--acento);" : ""}"></i>${texto}</span>`;
    let h = chip("var(--gastoBase)", `Base ${kcal(info.base)}`);
    info.items.forEach((x) => {
      h += `<button class="p-parte" onclick="pedirQuitarEjercicio('${fecha}', '${x.id}')" aria-label="Quitar ${esc(x.nombre)}"><i style="background:var(--acento)"></i>${esc(x.nombre)} +${kcal(x.kcal)}${x.incluido ? ' <span class="dim">(en tu reloj)</span>' : ""}</button>`;
    });
    if (info.suelto > 0) h += chip("var(--acento)", `Ejercicio +${kcal(info.suelto)}`);
    if (Math.round(info.ajuste) !== 0) {
      const signo = info.ajuste > 0 ? "+" : "−";
      h += chip(info.ajuste > 0 ? "repeating-linear-gradient(135deg, var(--acento) 0 3px, transparent 3px 6px)" : "var(--track)", `${info.deApp ? "Según tu app" : "A mano"} ${signo}${kcal(Math.abs(info.ajuste))}`, info.ajuste > 0);
    }
    return h;
  }
  function cuentaHTML(total, meta, cuando) {
    const kgSemana = ((meta * 7) / KCAL_PER_KG).toFixed(1).replace(".", ",");
    return `<div class="p-cuenta" role="group" aria-label="Tu número: gastás ${kcal(total)} menos tu déficit de ${kcal(meta)}, igual a ${kcal(Math.max(0, total - meta))}">
        <div class="p-ficha"><small>Gastás</small><b id="cuenta-gastas">${kcal(total)}</b><span>${cuando}</span></div>
        <div class="p-op" aria-hidden="true">−</div>
        <div class="p-ficha marcada"><small style="color:var(--text)">Tu déficit</small><b>${kcal(meta)}</b><span>≈ ${kgSemana} kg por semana</span></div>
        <div class="p-op" aria-hidden="true">=</div>
        <div class="p-ficha"><small>Tu número</small><b id="cuenta-numero">${kcal(Math.max(0, total - meta))}</b><span>para comer</span></div>
      </div>`;
  }
  function tarjetaGastoHTML(c, fecha, op) {
    const o = op || {};
    const info = gastoInfo(fecha);
    const rango = rangoGasto(info);
    const meta = metaDiaria(c);
    const p = Math.max(0, Math.min(1, (info.base - rango.min) / (rango.max - rango.min)));
    const esHoy = fecha === c.todayStr;
    const numero = escribiendoGasto === fecha
      ? `<span style="margin-left:auto;display:flex;align-items:center;gap:6px"><input id="gasto-escrito" type="text" inputmode="numeric" value="${Math.round(info.total)}" aria-label="Lo que gastaste, en kcal" style="width:96px;min-height:44px;font-size:18px;font-weight:800;text-align:right" onkeydown="if(event.key==='Enter')guardarGastoEscrito('${fecha}')"><button class="btn-sage" onclick="guardarGastoEscrito('${fecha}')">Listo</button></span>`
      : `<button id="gasto-num" class="p-gasto-num" onclick="escribirGasto('${fecha}')" aria-label="Escribir lo que gastaste"><b id="gasto-num-v">${kcal(info.total)}</b><span class="xs" style="font-weight:700">kcal</span>${icon("pencil", "var(--textDim)", 14)}</button>`;
    let h = `<div class="p-tarjeta" style="display:flex;flex-direction:column;gap:10px">
      <div class="p-cab"><span class="p-cab-titulo">${icon("llama", "var(--acento)", 20, 2.2)}${o.titulo || "Tu gasto de hoy"}</span>${numero}${o.flecha || ""}</div>`;
    if (gastoError && escribiendoGasto === fecha) h += `<div class="small" style="color:var(--rojoTexto)">${esc(gastoError)}</div>`;
    h += `<div style="display:flex;align-items:center;gap:6px">
        <button class="p-redondo" aria-label="Bajar 50 kcal" onclick="moverGasto('${fecha}', -50)">${icon("menos", "var(--text)", 18, 2.6)}</button>
        <div class="p-riel">
          <div class="fondo" style="left:13px;right:13px"><div id="gasto-tramos" style="position:absolute;inset:0">${tramosHTML(info, rango)}</div></div>
          <div class="tope-base" style="left:calc(13px + (100% - 26px) * ${p.toFixed(4)} - 1px)"></div>
          <input id="gasto-rango" type="range" min="${rango.min}" max="${rango.max}" step="10" value="${Math.round(Math.max(rango.min, Math.min(rango.max, info.total)))}" aria-label="${esHoy ? "Tu gasto de hoy" : "El gasto de ese día"}" aria-valuetext="${kcal(info.total)} kcal" oninput="previewGasto('${fecha}', this.value)" onchange="commitGasto('${fecha}', this.value)">
        </div>
        <button class="p-redondo" aria-label="Subir 50 kcal" onclick="moverGasto('${fecha}', 50)">${icon("plus", "var(--text)", 18, 2.6)}</button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${chipsGasto(fecha, info)}</div>`;
    if (quitandoEjercicio && quitandoEjercicio.fecha === fecha) {
      const it = info.items.find((x) => x.id === quitandoEjercicio.id);
      if (it) h += `<div class="p-explica" style="margin-top:0">
          <div><b>¿Quitar ${esc(it.nombre)}?</b> ${it.incluido ? "Tu gasto queda igual: ya estaba en el total de tu reloj." : `Tu gasto baja ${kcal(it.kcal)}.`}</div>
          <div class="row gap10" style="margin-top:10px"><button class="btn-danger" style="flex:1" onclick="confirmarQuitarEjercicio()">Quitar</button><button class="btn-secondary" style="flex:1" onclick="cancelarQuitarEjercicio()">Cancelar</button></div>
        </div>`;
    }
    h += cuentaHTML(info.total, meta, esHoy ? "hoy" : "ese día");
    if (o.nota) h += `<div class="small dim" style="line-height:1.45">${o.nota}</div>`;
    return h + `</div>`;
  }
  window.previewGasto = function (fecha, v) {
    const total = Math.round(Number(v) || 0);
    if (!ctxVivo) ctxVivo = computeCtx();
    const c = ctxVivo;
    const meta = metaDiaria(c);
    const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
    set("gasto-num-v", kcal(total));
    set("cuenta-gastas", kcal(total));
    set("cuenta-numero", kcal(Math.max(0, total - meta)));
    const btn = document.getElementById("gasto-num");
    if (btn) btn.classList.add("vivo");
    const info = gastoInfo(fecha);
    const vivo = { ...info, ajuste: total - info.base - info.ejercicio, total, deApp: false };
    const tr = document.getElementById("gasto-tramos");
    if (tr) tr.innerHTML = tramosHTML(vivo, rangoGasto(info));
    // El anillo de arriba crece mientras movés la barra.
    if (fecha === c.todayStr) {
      const viejo = document.getElementById("heroe");
      if (viejo && estaAbierta("numero")) {
        const tmp = document.createElement("div");
        tmp.innerHTML = heroeHTML(c, estadoHoy(c, total), true);
        viejo.replaceWith(tmp.firstElementChild);
      }
    }
  };
  window.commitGasto = function (fecha, v) { ctxVivo = null; fijarGasto(fecha, Number(v) || 0); render(); };
  window.moverGasto = function (fecha, d) { fijarGasto(fecha, gastoInfo(fecha).total + d); render(); };
  window.escribirGasto = function (fecha) {
    escribiendoGasto = fecha; gastoError = "";
    render();
    setTimeout(function () { const i = document.getElementById("gasto-escrito"); if (i) { i.focus(); i.select(); } }, 30);
  };
  window.guardarGastoEscrito = function (fecha) {
    const el = document.getElementById("gasto-escrito");
    const v = toNumber(el ? el.value : "");
    if (!(v >= GASTO_MIN && v <= GASTO_TOPE)) { gastoError = `Poné un número entre ${kcal(GASTO_MIN)} y ${kcal(GASTO_TOPE)}.`; render(); return; }
    fijarGasto(fecha, v);
    escribiendoGasto = null; gastoError = "";
    render();
  };
  window.pedirQuitarEjercicio = function (fecha, id) { quitandoEjercicio = { fecha, id }; render(); };
  window.cancelarQuitarEjercicio = function () { quitandoEjercicio = null; render(); };
  window.confirmarQuitarEjercicio = function () {
    if (quitandoEjercicio) quitarEjercicio(quitandoEjercicio.fecha, quitandoEjercicio.id);
    quitandoEjercicio = null;
    render();
  };
  window.abrirGasto = function (fecha) { gastoFecha = fecha; escribiendoGasto = null; quitandoEjercicio = null; render(); };
  window.cerrarGasto = function () { gastoFecha = null; escribiendoGasto = null; quitandoEjercicio = null; render(); };

  // ---------- el anillo ----------
  // est.tipo: bien | falta | casi | demas | cheat.
  //   bien  → verde hasta est.pct (lo que comiste de tu número)
  //   falta → igual, en celeste (para lo que hay que alcanzar, como la proteína)
  //   casi  → te pasaste de tu número: el verde queda lleno detrás y encima, más
  //           finito, crece la vuelta amarilla (lo que te comiste de tu déficit).
  //           Cuando la vuelta se completa ya no hay déficit: rojo.
  //   demas → comiste más de lo que gastaste: todo rojo.
  function anilloSVG(o) {
    const size = o.size, r = o.r, grosor = o.grosor, est = o.est;
    const c = size / 2, C = 2 * Math.PI * r;
    let marcas = "";
    if (o.ticks) {
      for (let i = 0; i < 48; i++) {
        const a = (i / 48) * 2 * Math.PI, r1 = r + grosor / 2 + 7, r2 = r1 + (i % 4 === 0 ? 5 : 3);
        marcas += `<line x1="${(c + Math.sin(a) * r1).toFixed(1)}" y1="${(c - Math.cos(a) * r1).toFixed(1)}" x2="${(c + Math.sin(a) * r2).toFixed(1)}" y2="${(c - Math.cos(a) * r2).toFixed(1)}" stroke="var(--tick)" stroke-width="${i % 4 === 0 ? 2 : 1.2}" stroke-linecap="round"></line>`;
      }
    }
    const arco = (color, pct, ancho, filtro, demora) => `<circle class="p-arco" cx="${c}" cy="${c}" r="${r.toFixed(2)}" fill="none" stroke="${color}" stroke-width="${ancho}" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct)).toFixed(1)}" transform="rotate(-90 ${c} ${c})" style="--total:${C.toFixed(1)};filter:${filtro};animation-delay:${demora}s"></circle>`;
    const punto = (pct, color, radio, demora) => {
      const a = pct * 2 * Math.PI;
      return `<circle class="aparece" cx="${(c + Math.sin(a) * r).toFixed(1)}" cy="${(c - Math.cos(a) * r).toFixed(1)}" r="${radio}" fill="${color}" style="animation-delay:${demora}s"></circle>`;
    };
    const pista = `<circle cx="${c}" cy="${c}" r="${r.toFixed(2)}" fill="none" stroke="var(--track)" stroke-width="${grosor}"></circle>`;
    if (est.tipo === "cheat") return marcas + `<circle cx="${c}" cy="${c}" r="${r.toFixed(2)}" fill="none" stroke="var(--cheat)" stroke-width="${Math.max(2, grosor * 0.45).toFixed(1)}" stroke-dasharray="3 7" stroke-linecap="round"></circle>`;
    if (est.tipo === "casi") {
      const fino = Math.max(3, Math.round(grosor * 0.6));
      const extra = Math.max(0.02, Math.min(1, est.extra || 0));
      return marcas + pista + arco("var(--bien)", 1, grosor, "var(--glowBien)", 0) + arco("var(--ojo)", extra, fino, "var(--glowOjo)", 1)
        + (o.punta !== false ? punto(extra, "var(--puntaOjo)", Math.max(1.5, fino / 2 - 2), 2) : "");
    }
    if (est.tipo === "demas") return marcas + pista + arco("var(--rojo)", 1, grosor, "var(--glowRojo)", 0);
    const p = Math.max(0, Math.min(1, est.pct || 0));
    if (p <= 0) return marcas + pista;
    const falta = est.tipo === "falta";
    return marcas + pista + arco(falta ? "var(--falta)" : "var(--bien)", p, grosor, falta ? "none" : "var(--glowBien)", 0)
      + (o.punta !== false ? punto(p, "var(--punta)", Math.max(4, grosor / 3), 1) : "");
  }

  // ---------- el número de hoy ----------
  function estadoHoy(c, gastoForzado) {
    const fecha = c.todayStr;
    const info = gastoInfo(fecha);
    const gasto = gastoForzado != null ? gastoForzado : info.total;
    const meta = metaDiaria(c);
    const numero = Math.max(0, gasto - meta);
    const consumido = c.todayStats ? c.todayStats.consumed : 0;
    const cheat = !!metaDe(fecha).cheat;
    const numeroBase = Math.max(1, baseDe(fecha) - meta);
    // Cada kcal ocupa lo mismo de vuelta: si gastás más, el anillo se agranda
    // y lo que comiste queda del mismo largo. Con tope, para que entre.
    const radio = Math.max(72, Math.min(112, (84 * Math.max(1, numero)) / numeroBase));
    const faltan = faltanHoy(objetivosDelDia(c));
    const e = { fecha, info, gasto, meta, numero, consumido, cheat, radio, faltan, mas: false, alivio: "", nota: "", colorEtiqueta: "" };
    if (cheat) {
      Object.assign(e, { est: { tipo: "cheat" }, etiqueta: "Día cheat", num: kcal(consumido), unidad: "kcal comidas",
        linea: "Hoy no hay límite. No corta tu racha y cuenta para el total.", boton: "Ver mi semana", accion: "setTab('progreso')",
        aria: `Día cheat: comiste ${kcal(consumido)} kcal` });
    } else if (consumido <= numero) {
      const etiqueta = faltan.length === 1 ? `Para ${conArticulo(faltan[0])} te quedan`
        : faltan.length === 2 ? `Para ${conArticulo(faltan[0])} y ${conArticulo(faltan[1])} te quedan` : "Te quedan hoy";
      Object.assign(e, { est: { tipo: "bien", pct: numero > 0 ? consumido / numero : 1 }, etiqueta, num: kcal(numero - consumido), unidad: "kcal",
        linea: `Comiste ${kcal(consumido)} de ${kcal(numero)}`, boton: faltan.length ? `Ideas para ${conArticulo(faltan[0])}` : "Ideas", accion: "abrirIdeas()",
        aria: `Te quedan ${kcal(numero - consumido)} kcal de ${kcal(numero)}` });
    } else if (consumido <= gasto) {
      Object.assign(e, { est: { tipo: "casi", extra: meta > 0 ? (consumido - numero) / meta : 1 }, etiqueta: "Te pasaste de tu número", colorEtiqueta: "var(--ojoTexto)",
        mas: true, num: kcal(consumido - numero), unidad: "kcal", linea: `Comiste ${kcal(consumido)} de ${kcal(numero)}`,
        alivio: `Igual seguís en déficit por ${kcal(gasto - consumido)}`,
        boton: faltan.length ? "Ideas livianas" : "Ver mi semana", accion: faltan.length ? "abrirIdeas()" : "setTab('progreso')",
        aria: `Te pasaste ${kcal(consumido - numero)} kcal de tu número. Seguís en déficit por ${kcal(gasto - consumido)} kcal` });
    } else {
      Object.assign(e, { est: { tipo: "demas" }, etiqueta: "Hoy no hay déficit", colorEtiqueta: "var(--rojoTexto)", mas: true,
        num: kcal(consumido - gasto), unidad: "kcal", linea: `Comiste ${kcal(consumido)} y gastaste ${kcal(gasto)}`,
        nota: "Un día así no arruina la semana.", boton: "Ver mi semana", accion: "setTab('progreso')",
        aria: `Comiste ${kcal(consumido - gasto)} kcal más de lo que gastaste` });
    }
    return e;
  }
  function anilloHeroeHTML(e) {
    return `<svg role="img" aria-label="${esc(e.aria)}" width="100%" height="100%" viewBox="0 0 270 270" style="overflow:visible;display:block">${anilloSVG({ size: 270, r: e.radio, grosor: 18, est: e.est, ticks: true })}</svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none">
          <div id="heroe-num" class="p-num${e.mas ? " chico" : ""}">${e.mas ? '<span class="p-mas">+</span>' : ""}${e.num}</div>
          <div style="font-size:15px;font-weight:700;margin-top:2px">${e.unidad}</div>
        </div>`;
  }
  function explicacionHTML(c, e) {
    const antes = c.settled.filter((d) => d.date !== c.todayStr).reduce((s, d) => s + d.net, 0);
    const falta = Math.max(0, c.goalKcal - antes);
    const partes = [`tu base ${kcal(e.info.base)}`].concat(e.info.items.map((x) => `${x.nombre.toLowerCase()} ${kcal(x.kcal)}`));
    if (e.info.suelto > 0) partes.push(`ejercicio ${kcal(e.info.suelto)}`);
    if (Math.round(e.info.ajuste) !== 0) partes.push(`${e.info.deApp ? "según tu app" : "a mano"} ${e.info.ajuste > 0 ? "+" : "−"}${kcal(Math.abs(e.info.ajuste))}`);
    return `<div class="p-explica">
        <div><b>Tu número de hoy es ${kcal(e.numero)}:</b> lo que gastás (${kcal(e.gasto)}) menos el déficit que necesitás por día (${kcal(e.meta)}).</div>
        <div class="dim" style="margin-top:6px">${e.meta > 0 ? `Tu déficit sale de las ${kcal(falta)} kcal que te faltan para llegar a ${esc(String(goal.goalWeight).replace(".", ","))} kg, repartidas en ${c.daysLeft} día${c.daysLeft !== 1 ? "s" : ""}.` : "Ya llegaste a tu objetivo: tu número es para mantenerte."}</div>
        <div class="dim" style="margin-top:6px">Lo que gastás: ${partes.join(", ")}. Lo cambiás en "Tu gasto de hoy".</div>
        <button class="chip chip-btn ${e.cheat ? "cheat-on" : "dim"}" style="margin-top:10px" onclick="toggleCheat('${e.fecha}')">${icon("cheat", e.cheat ? "var(--cheat)" : "var(--textDim)", 14)} ${e.cheat ? "Quitar día cheat" : "Marcar día cheat"}</button>
      </div>`;
  }
  function heroeHTML(c, e, abierta) {
    const fija = esFija("numero");
    if (!abierta) {
      return `<div id="heroe" class="p-heroe" style="padding:12px 16px"><div class="p-cab">
          <span style="width:52px;height:52px;flex-shrink:0"><svg aria-hidden="true" width="52" height="52" viewBox="0 0 52 52" style="overflow:visible">${anilloSVG({ size: 52, r: 20, grosor: 7, est: e.est, punta: false })}</svg></span>
          <span style="flex:1;min-width:0"><span class="xs dim" style="display:block;font-weight:600">${esc(e.etiqueta)}</span><span style="font-size:26px;font-weight:800;letter-spacing:-.5px">${e.mas ? "+" : ""}${e.num} <span style="font-size:13px">kcal</span></span></span>
          ${flechita("numero", false, fija, "lo que te queda")}
        </div></div>`;
    }
    return `<div id="heroe" class="p-heroe sube">
        <span class="p-flecha-esq">${flechita("numero", true, fija, "lo que te queda")}</span>
        <div class="p-etiqueta" style="${e.colorEtiqueta ? `color:${e.colorEtiqueta}` : ""}">${e.cheat ? icon("cheat", "var(--cheat)", 15) + " " : ""}${esc(e.etiqueta)}</div>
        <div style="position:relative;width:270px;max-width:100%;aspect-ratio:1/1;margin:0 auto">${anilloHeroeHTML(e)}</div>
        <div class="p-linea">${e.linea}</div>
        ${e.alivio ? `<div style="display:flex;justify-content:center;margin-top:10px"><span class="p-alivio">${icon("check", "currentColor", 16, 2.8)}${e.alivio}</span></div>` : ""}
        ${e.nota ? `<div style="text-align:center;margin-top:8px;font-size:14px;color:var(--textDim)">${e.nota}</div>` : ""}
        <div class="p-botones">
          <button class="p-boton" onclick="${e.accion}">${e.boton}</button>
          <button class="p-subrayado" aria-expanded="${explicando}" onclick="toggleExplicar()">¿De dónde sale?</button>
        </div>
        ${explicando ? explicacionHTML(c, e) : ""}
      </div>`;
  }
  window.toggleExplicar = function () { explicando = !explicando; render(); };

  // ---------- las partes de Hoy: plegables, ordenables y ocultables ----------
  const SECCIONES = [
    { id: "numero", nombre: "Lo que te queda", icono: "anillo" },
    { id: "gasto", nombre: "Tu gasto de hoy", icono: "llama" },
    { id: "macros", nombre: "Macros", icono: "barras" },
    { id: "comidas", nombre: "Tus comidas", icono: "cubiertos" },
    { id: "nutrientes", nombre: "Tus nutrientes", icono: "manzana" },
    { id: "semana", nombre: "Tu semana", icono: "pulso" },
    { id: "objetivo", nombre: "Tu objetivo", icono: "bandera" },
  ];
  const OCULTAS_DE_ENTRADA = ["semana", "objetivo"];
  function configInicio() {
    const g = goal.inicio || {};
    const ids = SECCIONES.map((s) => s.id);
    const orden = Array.isArray(g.orden) ? g.orden.filter((id, i, a) => ids.includes(id) && a.indexOf(id) === i) : [];
    ids.forEach((id) => { if (!orden.includes(id)) orden.push(id); });
    const ocultas = (Array.isArray(g.ocultas) ? g.ocultas : OCULTAS_DE_ENTRADA).filter((id) => ids.includes(id) && id !== "numero");
    return { orden, ocultas, arranque: g.arranque || {}, abiertas: g.abiertas || {} };
  }
  // abierta | cerrada (fijas: así arranca siempre) o recordar (como la dejaste).
  function arranqueDe(cfg, id) { return cfg.arranque[id] || (id === "numero" ? "abierta" : "recordar"); }
  function esFija(id) { const a = arranqueDe(configInicio(), id); return a === "abierta" || a === "cerrada"; }
  let abiertasSesion = null;
  function estaAbierta(id) {
    if (!abiertasSesion) {
      const cfg = configInicio();
      abiertasSesion = {};
      SECCIONES.forEach((s) => {
        const a = arranqueDe(cfg, s.id);
        abiertasSesion[s.id] = a === "abierta" ? true : a === "cerrada" ? false : cfg.abiertas[s.id] !== false;
      });
    }
    return abiertasSesion[id] !== false;
  }
  function guardarInicio(cambios) {
    goal = { ...goal, inicio: { ...(goal.inicio || {}), ...cambios } };
    persistGoal();
  }
  window.plegar = function (id) {
    const abierta = !estaAbierta(id);
    abiertasSesion = { ...abiertasSesion, [id]: abierta };
    const cfg = configInicio();
    if (arranqueDe(cfg, id) === "recordar") guardarInicio({ abiertas: { ...cfg.abiertas, [id]: abierta } });
    render();
  };
  // La flechita de cada parte; si la parte quedó fija, al lado va un alfiler.
  function flechita(id, abierta, fija, nombre) {
    return `<span style="display:inline-flex;align-items:center;flex-shrink:0">${fija ? `<span role="img" aria-label="Fija ${abierta ? "abierta" : "cerrada"}" style="display:inline-flex">${icon("pin", "var(--textDim)", 14, 2)}</span>` : ""}<button class="p-flecha" aria-expanded="${abierta}" aria-label="${abierta ? "Cerrar" : "Abrir"} ${esc(nombre)}" onclick="plegar('${id}')">${icon("abajo", "var(--text)", 20, 2.2)}</button></span>`;
  }
  function cabecera(id, iconoN, titulo, resumen, abierta) {
    return `<div class="p-cab"><span class="p-cab-titulo">${icon(iconoN, "var(--acento)", 20, 2.2)}${titulo}</span><span class="p-cab-resumen">${resumen || ""}</span>${flechita(id, abierta, esFija(id), titulo)}</div>`;
  }

  // ---------- macros: el mismo idioma que el anillo ----------
  // Proteína (hay que llegar): celeste mientras falta, verde cuando llegás.
  // Carbos y grasas (no pasarse): verde mientras entrás; si te pasás, el verde
  // queda lleno y encima crece el amarillo.
  function estadoDeMacro(v, meta, tipo) {
    if (!(meta > 0)) return "bien";
    if (tipo === "piso") return v >= meta * 0.9 ? "bien" : "falta";
    return v > meta ? "ojo" : "bien";
  }
  function textoDeMacro(v, meta, tipo) {
    const e = estadoDeMacro(v, meta, tipo);
    const dif = Math.round(Math.abs(meta - v));
    if (!(meta > 0)) return [`${Math.round(v)} g`, "var(--textDim)"];
    if (e === "ojo") return [`te pasaste ${dif} g`, "var(--ojoTexto)"];
    if (tipo === "piso") return v >= meta ? ["llegaste", "var(--bienTexto)"] : [`te faltan ${dif} g`, "var(--text)"];
    return [`te quedan ${dif} g`, "var(--text)"];
  }
  function barraMacroHTML(v, meta, tipo, demora, alto) {
    const e = estadoDeMacro(v, meta, tipo);
    const ancho = e === "ojo" ? 100 : meta > 0 ? Math.min(100, (v / meta) * 100) : 0;
    const extra = e === "ojo" ? Math.min(1, (v - meta) / meta) : 0;
    return `<div class="p-barra" style="color:${e === "falta" ? "var(--falta)" : "var(--bien)"};${alto ? `height:${alto}px;` : ""}"><i class="llena" style="width:${ancho.toFixed(0)}%;animation-delay:${demora || 0}s"></i>${extra ? `<b class="llena" style="width:calc(${(extra * 100).toFixed(1)}% - 2px);animation-delay:${((demora || 0) + 0.8).toFixed(2)}s"></b>` : ""}</div>`;
  }
  function macrosHTML(c, abierta) {
    const o = objetivosDelDia(c);
    const lista = [["Proteína", o.comido.p, o.metas.p, "piso"], ["Carbos", o.comido.c, o.metas.c, "techo"], ["Grasas", o.comido.g, o.metas.g, "techo"]];
    const mini = lista.map(([n, v, meta, tipo]) => {
      const e = estadoDeMacro(v, meta, tipo);
      return `<span style="display:inline-flex;align-items:center;gap:4px"><b style="font-size:12px">${n[0]}</b><span style="width:26px;height:6px;border-radius:999px;background:var(--track);overflow:hidden;display:inline-block;vertical-align:middle"><span style="display:block;height:100%;width:${meta > 0 ? Math.min(100, (v / meta) * 100).toFixed(0) : 0}%;background:${e === "falta" ? "var(--falta)" : e === "ojo" ? "var(--ojo)" : "var(--bien)"};border-radius:999px"></span></span></span>`;
    }).join(" ");
    let h = `<div class="p-tarjeta">${cabecera("macros", "barras", "Macros", abierta ? "" : `<span style="display:inline-flex;gap:8px">${mini}</span>`, abierta)}`;
    if (abierta) {
      h += `<div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">${lista.map(([n, v, meta, tipo], i) => {
        const [txt, color] = textoDeMacro(v, meta, tipo);
        return `<div style="display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px">
            <span style="font-weight:700">${n} <span style="font-weight:500;color:var(--textDim)">${Math.round(v)} de ${Math.round(meta)} g</span></span>
            <span style="font-weight:700;color:${color}">${txt}</span>
          </div>
          ${barraMacroHTML(v, meta, tipo, 0.15 + i * 0.1)}
        </div>`;
      }).join("")}</div>
      <div class="xs dim" style="margin-top:10px">Tu plan: ${esc(o.dieta.nombre.toLowerCase())}. Lo cambiás en Nutrientes.</div>`;
    }
    return h + `</div>`;
  }

  // ---------- tus comidas: una línea de tiempo ----------
  //
  // Cada comida va a uno de tus momentos (desayuno, almuerzo, merienda, cena).
  // Las nuevas lo traen del +; las de antes se deducen por la hora: cargas a
  // menos de 45 minutos una de otra son la misma comida, y van en orden.
  const ICONO_MOMENTO = { Desayuno: "taza", Almuerzo: "sun", Merienda: "mate", Cena: "moon" };
  const PESO_MOMENTO = { Desayuno: 0.2, Almuerzo: 0.35, Merienda: 0.15, Cena: 0.3 };
  function momentosDeComidas(comidas) {
    const habituales = comidasHabituales();
    const orden = comidas.slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    const grupos = [];
    let anterior = -Infinity;
    orden.forEach((m) => {
      const t = m.createdAt || 0;
      if (!grupos.length || t - anterior > MISMA_COMIDA_MS) grupos.push([]);
      grupos[grupos.length - 1].push(m);
      anterior = t;
    });
    let sig = 0;
    const out = [];
    grupos.forEach((g) => {
      const conMomento = g.find((m) => m.momento);
      let mom;
      if (conMomento) {
        mom = conMomento.momento;
        const i = habituales.indexOf(mom);
        if (i >= 0) sig = Math.max(sig, i + 1);
      } else {
        mom = sig < habituales.length ? habituales[sig] : "Extra";
        sig++;
      }
      g.forEach((m) => out.push({ m, momento: m.momento || mom }));
    });
    return out;
  }
  function horaDe(m) {
    if (!m.createdAt || m.createdAt < 1e12) return "";
    const d = new Date(m.createdAt);
    return `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
  }
  // Una etiqueta corta por comida: lo que hay que mirar (amarillo) o lo mejor
  // que aporta (verde). Sin detalle de nutrientes, ninguna.
  const MEJOR_APORTE = [["proteinas_g", "Buena proteína"], ["fibra_g", "Buena fibra"], ["calcio_mg", "Buen calcio"], ["hierro_mg", "Buen hierro"],
    ["vitamina_c_mg", "Buena vitamina C"], ["potasio_mg", "Buen potasio"], ["vitamina_b12_ug", "Buena B12"], ["magnesio_mg", "Buen magnesio"]];
  function etiquetaComida(m) {
    if (!m.nutrientes) return null;
    const refs = refsNutrientes();
    const n = nutrientesDeComida(m);
    if (n.sodio_mg / refs.sodio_mg >= 0.4) return ["Mucho sodio", "ojo"];
    if (n.kcal > 0 && n.grasas_saturadas_g >= 8 && (n.grasas_saturadas_g * 9) / n.kcal > 0.12) return ["Mucha grasa saturada", "ojo"];
    if (n.azucares_g >= 25) return ["Mucha azúcar", "ojo"];
    let mejor = null;
    MEJOR_APORTE.forEach(([k, txt]) => { const p = refs[k] ? n[k] / refs[k] : 0; if (p >= 0.3 && (!mejor || p > mejor.p)) mejor = { p, txt }; });
    return mejor ? [mejor.txt, "bien"] : null;
  }
  function numeroDe(c, fecha) { return Math.max(1, gastoInfo(fecha).total - metaDiaria(c)); }
  function filaComidaHTML(c, x, ultima) {
    const m = x.m;
    const hilo = ultima ? "" : `<span class="p-hilo" aria-hidden="true"></span>`;
    const tag = etiquetaComida(m);
    const hora = horaDe(m);
    return `<button class="p-fila-comida" onclick="abrirComida('${m.id}')">
        ${hilo}<span class="p-aro"><svg aria-hidden="true" width="44" height="44" viewBox="0 0 44 44" style="overflow:visible">${anilloSVG({ size: 44, r: 17, grosor: 5, est: { tipo: "bien", pct: m.consumed / numeroDe(c, m.date) }, punta: false })}</svg><span>${icon(ICONO_MOMENTO[x.momento] || "cubiertos", "var(--text)", 18, 2)}</span></span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
          <span style="font-size:15px;font-weight:800">${esc(x.momento)}${hora ? ` <span style="font-size:13px;font-weight:600;color:var(--textDim)">${hora}</span>` : ""}</span>
          <span style="font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.note)}</span>
          ${tag ? `<span class="p-etq" style="background:var(--${tag[1]}Suave);color:var(--${tag[1]}Texto)"><i style="background:var(--${tag[1]})"></i>${tag[0]}</span>` : ""}
        </span>
        <span style="display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0"><span style="font-size:19px;font-weight:800;line-height:1.1">${kcal(m.consumed)}</span><span style="font-size:11px;font-weight:600;color:var(--textDim)">kcal</span></span>
        ${icon("chevR", "var(--textDim)", 16)}
      </button>`;
  }
  function filaPendienteHTML(momento, texto, ultima, fecha) {
    return `<div class="p-fila-comida">
        ${ultima ? "" : `<span class="p-hilo" aria-hidden="true"></span>`}
        <span class="p-aro"><svg aria-hidden="true" width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="17" fill="none" stroke="var(--textDim)" stroke-width="2" stroke-dasharray="3 3.5" opacity=".8"></circle></svg><span>${icon(ICONO_MOMENTO[momento] || "cubiertos", "var(--textDim)", 18, 2)}</span></span>
        <span style="flex:1;min-width:0">
          <span style="display:block;font-size:15px;font-weight:800">${esc(momento)} <span style="font-size:13px;font-weight:600;color:var(--textDim)">pendiente</span></span>
          <span style="display:block;font-size:14px;color:var(--textDim)">${texto}</span>
        </span>
        <button class="p-mas-pend" aria-label="Cargar ${esc(momento.toLowerCase())}" onclick="openCapture('${fecha}', 'comida', '${momento}')">${icon("plus", "var(--acento)", 18, 2.6)}</button>
      </div>`;
  }
  function comidasHTML(c, e, abierta) {
    const comidas = c.todayStats ? c.todayStats.meals : [];
    const filas = momentosDeComidas(comidas);
    const faltan = e.faltan || [];
    const habituales = comidasHabituales();
    const hechas = habituales.length - faltan.length;
    const total = comidas.reduce((s, m) => s + m.consumed, 0);
    const resumen = `${Math.max(0, hechas)} de ${habituales.length}${abierta ? "" : `, ${kcal(total)} kcal`}`;
    let h = `<div class="p-tarjeta">${cabecera("comidas", "cubiertos", "Tus comidas", resumen, abierta)}`;
    if (abierta) {
      const quedan = Math.max(0, e.numero - e.consumido);
      const sumaPesos = faltan.reduce((s, m) => s + (PESO_MOMENTO[m] || 0.25), 0) || 1;
      const textoPendiente = (m) => e.cheat ? "Hoy no hay límite"
        : quedan <= 0 ? "Ya llegaste a tu número: algo liviano"
        : faltan.length === 1 ? `Te quedan ${kcal(quedan)} kcal`
        : `Unas ${kcal(Math.round((quedan * (PESO_MOMENTO[m] || 0.25)) / sumaPesos / 10) * 10)} kcal`;
      const items = filas.map((x) => ({ tipo: "hecha", x })).concat(c.todayClosed ? [] : faltan.map((m) => ({ tipo: "pend", m })));
      h += `<div style="display:flex;flex-direction:column;margin-top:4px">`;
      if (!items.length) h += `<div class="small dim" style="padding:12px 0">Todavía no cargaste nada hoy.</div>`;
      items.forEach((it, i) => {
        const ultima = i === items.length - 1;
        h += it.tipo === "hecha" ? filaComidaHTML(c, it.x, ultima) : filaPendienteHTML(it.m, textoPendiente(it.m), ultima, c.todayStr);
      });
      h += `</div>`;
      h += `<div class="p-pie-comidas">${comidas.length && !c.todayClosed ? `<button class="mini-btn" onclick="openCloseDayConfirm()">${icon("check", "var(--text)", 14, 2.4)} Cerrar el día</button>` : ""}<button class="mini-btn" style="${e.cheat ? "border-color:var(--cheat);color:var(--cheat);" : ""}" onclick="toggleCheat('${c.todayStr}')">${icon("cheat", e.cheat ? "var(--cheat)" : "var(--textDim)", 14)} ${e.cheat ? "Quitar día cheat" : "Día cheat"}</button></div>`;
    }
    h += `</div>`;
    if (showCloseDayConfirm && c.todayStats) {
      const bal = balanceDe(c.todayStats.net, e.cheat);
      h += `<div class="p-tarjeta" style="box-shadow:inset 0 0 0 2px var(--acento)">
        <div class="title" style="margin-bottom:10px">Resumen de hoy</div>
        <div class="grid2" style="margin-bottom:14px">
          ${Stat("Comiste", kcal(c.todayStats.consumed) + " kcal")}
          ${Stat("Gastaste", kcal(c.todayStats.gasto) + " kcal")}
          ${Stat("Balance", bal.text, bal.color)}
          ${Stat("Proteína", c.todayStats.protein.toFixed(0) + " g")}
        </div>
        <div class="row gap10">
          <button class="btn-sage" style="flex:1" onclick="closeToday()">Confirmar y cerrar</button>
          <button class="btn-secondary" onclick="cancelCloseDayConfirm()">Seguir</button>
        </div>
      </div>`;
    }
    return h;
  }

  // ---------- tus nutrientes de hoy ----------
  const NOMBRE_CORTO = { fibra_g: "fibra", calcio_mg: "calcio", vitamina_d_ug: "vitamina D", potasio_mg: "potasio", magnesio_mg: "magnesio",
    hierro_mg: "hierro", vitamina_c_mg: "vitamina C", vitamina_a_ug: "vitamina A", vitamina_e_mg: "vitamina E", vitamina_k_ug: "vitamina K",
    folato_b9_ug: "folato", vitamina_b12_ug: "B12", zinc_mg: "zinc", colina_mg: "colina", sodio_mg: "sodio", grasas_saturadas_g: "grasas saturadas",
    proteinas_g: "proteína", tiamina_b1_mg: "B1", riboflavina_b2_mg: "B2", niacina_b3_mg: "niacina", pantotenico_b5_mg: "B5", vitamina_b6_mg: "B6",
    fosforo_mg: "fósforo", cobre_mg: "cobre", manganeso_mg: "manganeso", selenio_ug: "selenio" };
  function nombreVisible(d) { return String(d.largo || d.nombre).replace(/^B\d+ · /, ""); }
  function nombreCorto(k) { return NOMBRE_CORTO[k] || (N.NUTRIENTES.find((d) => d.k === k) || { nombre: k }).nombre.toLowerCase(); }
  function listaY(xs) { return xs.length <= 1 ? xs.join("") : xs.slice(0, -1).join(", ") + " y " + xs[xs.length - 1]; }
  function nutrientesHoyHTML(c, abierta) {
    const comidas = c.todayStats ? c.todayStats.meals : [];
    const conDetalle = comidas.filter((m) => m.nutrientes);
    let frase, chips = "", resumen = "";
    if (!comidas.length) frase = "Todavía no comiste nada hoy: tus nutrientes arrancan con la primera comida.";
    else if (!conDetalle.length) frase = "Las comidas de hoy no tienen detalle de vitaminas y minerales.";
    else {
      const nd = nutrientesDeComidas(comidas);
      const n = nd.n, refs = refsNutrientes();
      const prioridad = ["fibra_g", "calcio_mg", "vitamina_d_ug", "potasio_mg", "magnesio_mg", "hierro_mg", "vitamina_c_mg"];
      const faltan = prioridad.map((k) => ({ k, p: n[k] / refs[k] })).filter((x) => x.p < 0.7).sort((a, b) => a.p - b.p).slice(0, 2);
      const sodio = n.sodio_mg / refs.sodio_mg;
      const bien = ["vitamina_b12_ug", "hierro_mg", "vitamina_c_mg", "calcio_mg", "fibra_g", "potasio_mg"].map((k) => ({ k, p: n[k] / refs[k] })).filter((x) => x.p >= 0.6).sort((a, b) => b.p - a.p)[0];
      const partes = [];
      if (bien) partes.push(`Vas bien de ${nombreCorto(bien.k)}.`);
      if (faltan.length && sodio >= 0.5) partes.push(`Te ${faltan.length > 1 ? "faltan" : "falta"} ${listaY(faltan.map((x) => nombreCorto(x.k)))}, y ojo con el sodio: ya vas por el ${Math.round(sodio * 100)} %.`);
      else if (faltan.length) partes.push(`Te ${faltan.length > 1 ? "faltan" : "falta"} ${listaY(faltan.map((x) => nombreCorto(x.k)))}.`);
      else if (sodio >= 0.5) partes.push(`Ojo con el sodio: ya vas por el ${Math.round(sodio * 100)} %.`);
      if (!partes.length) partes.push("Vas bien en todo por ahora.");
      frase = partes.join(" ");
      const d = (k) => N.NUTRIENTES.find((x) => x.k === k);
      const chip = (k, estado) => `<span class="p-chip-n" style="border-color:var(--${estado});background:var(--${estado}Suave)"><b>${esc(nombreCorto(k).charAt(0).toUpperCase() + nombreCorto(k).slice(1))}</b><span class="dim">${N.fmt(n[k])} de ${N.fmt(refs[k])} ${N.unidad(d(k).u)}</span></span>`;
      chips = faltan.map((x) => chip(x.k, "falta")).join("") + (sodio >= 0.5 ? chip("sodio_mg", "ojo") : "");
      resumen = faltan.length ? `Faltan ${listaY(faltan.map((x) => nombreCorto(x.k)))}` : sodio >= 0.5 ? "Ojo con el sodio" : "Vas bien";
    }
    let h = `<div class="p-tarjeta">${cabecera("nutrientes", "manzana", "Tus nutrientes", abierta ? `<button class="p-subrayado" style="font-size:13px" onclick="setTab('nutrientes')">Ver todos</button>` : esc(resumen), abierta)}`;
    if (abierta) {
      h += `<p style="margin:6px 0 0;font-size:14px;line-height:1.45;text-wrap:pretty">${frase}</p>`;
      if (chips) h += `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">${chips}</div>`;
    }

  }

  // ---------- tu semana y tu objetivo ----------
  // Un anillo para la semana entera, con los mismos tres estados que el día:
  // el número de la semana es lo que gastaste menos el déficit planeado.
  function semanaPulso(c) {
    const s = datosSemana(c);
    const hechos = s.dias.filter((x) => x.d && !x.esHoy);
    const comido = hechos.reduce((t, x) => t + x.consumido, 0);
    const gasto = hechos.reduce((t, x) => t + x.gasto, 0);
    const plan = s.meta * hechos.length;
    const deficit = gasto - comido;
    const numero = gasto - plan;
    let est, palabra, frase;
    if (!hechos.length) { est = { tipo: "bien", pct: 0 }; palabra = ""; frase = "Todavía no hay días completos en esta semana."; }
    else if (comido <= numero) { est = { tipo: "bien", pct: numero > 0 ? comido / numero : 1 }; palabra = "Bien"; frase = "vas según lo planeado."; }
    else if (deficit >= 0) { est = { tipo: "casi", extra: plan > 0 ? (plan - deficit) / plan : 1 }; palabra = "Casi"; frase = "bajaste, pero menos de lo planeado."; }
    else { est = { tipo: "demas" }; palabra = "De más"; frase = "esta semana comiste más de lo que gastaste."; }
    const cuenta = { meta: 0, deficit: 0, superavit: 0, cheat: 0 };
    hechos.forEach((x) => { if (cuenta[x.estado] != null) cuenta[x.estado]++; });
    return { s, hechos, comido, gasto, plan, deficit, est, palabra, frase, cuenta };
  }
  function estadoMini(x) {
    if (x.esHoy) {
      const consumido = x.consumido, numero = Math.max(1, x.limite);
      if (x.d && x.d.cheat) return { tipo: "cheat" };
      return consumido <= numero ? { tipo: "bien", pct: consumido / numero } : consumido <= x.gasto ? { tipo: "casi", extra: (consumido - numero) / Math.max(1, x.gasto - x.limite) } : { tipo: "demas" };
    }
    if (x.estado === "cheat") return { tipo: "cheat" };
    if (x.estado === "meta") return { tipo: "bien", pct: x.limite > 0 ? x.consumido / x.limite : 1 };
    if (x.estado === "deficit") return { tipo: "casi", extra: (x.consumido - x.limite) / Math.max(1, x.gasto - x.limite) };
    if (x.estado === "superavit") return { tipo: "demas" };
    return null;
  }
  const LETRA_DIA = ["D", "L", "M", "M", "J", "V", "S"];
  function miniDiasHTML(s, seleccionable) {
    return `<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px">${s.dias.map((x, i) => {
      const est = estadoMini(x);
      const sel = seleccionable && semanaSel === i;
      const svg = !est ? `<circle cx="20" cy="20" r="15" fill="none" stroke="var(--track)" stroke-width="6"></circle>`
        : est.tipo === "cheat" ? `<circle cx="20" cy="20" r="15" fill="none" stroke="var(--cheat)" stroke-width="2" stroke-dasharray="3 3.2"></circle><g transform="translate(12 12) scale(0.667)" fill="none" stroke="var(--cheat)" stroke-width="2.4" stroke-linejoin="round">${ICONS.cheat}</g>`
        : anilloSVG({ size: 40, r: 15, grosor: 6, est, punta: false });
      const nombre = x.esHoy ? "Hoy" : formatDate(x.fecha);
      const palabra = !est ? "sin datos" : x.esHoy ? "en curso" : { meta: "bien", deficit: "casi", superavit: "de más", cheat: "día cheat" }[x.estado] || "";
      const letra = x.esHoy ? "Hoy" : LETRA_DIA[new Date(x.fecha + "T00:00:00").getDay()];
      const tag = seleccionable ? "button" : "div";
      return `<${tag} class="p-mini-dia" ${seleccionable ? `aria-pressed="${sel}" onclick="selDiaSemana(${i})"` : 'role="img"'} aria-label="${esc(nombre)}: ${palabra}">
          <svg aria-hidden="true" width="40" height="40" viewBox="0 0 40 40" style="overflow:visible">${svg}</svg>
          <span style="font-size:13px;font-weight:${x.esHoy || sel ? 800 : 600};color:${x.esHoy || sel ? "var(--text)" : "var(--textDim)"}">${letra}</span>
        </${tag}>`;
    }).join("")}</div>`;
  }
  function puntoEstado(tipo) {
    if (tipo === "casi") return `<span aria-hidden="true" style="width:9px;height:9px;border-radius:50%;background:var(--ojo);box-shadow:0 0 0 2.5px var(--bien);margin:0 3px;flex-shrink:0"></span>`;
    if (tipo === "cheat") return `<span aria-hidden="true" style="width:11px;height:11px;border-radius:50%;border:2px dashed var(--cheat);box-sizing:border-box;flex-shrink:0"></span>`;
    return `<span aria-hidden="true" style="width:11px;height:11px;border-radius:50%;background:${tipo === "demas" ? "var(--rojo)" : "var(--bien)"};flex-shrink:0"></span>`;
  }
  function semanaHoyHTML(c, abierta) {
    const w = semanaPulso(c);
    let h = `<div class="p-tarjeta">${cabecera("semana", "pulso", "Tu semana", w.palabra ? `${w.palabra}: ${w.deficit >= 0 ? "bajaste" : "subiste"} ${(Math.abs(w.deficit) / KCAL_PER_KG).toFixed(1).replace(".", ",")} kg` : "", abierta)}`;

  function objetivoHTML(c, abierta, enProgreso) {

          <span>${c.daysLeft} día${c.daysLeft !== 1 ? "s" : ""}</span>

      if (c.streak > 0 || c.badges.length) {

        if (c.streak > 0) h += `<span class="badge-pill">${icon("flame", "var(--ojo)", 14)} ${c.streak} día${c.streak !== 1 ? "s" : ""} seguido${c.streak !== 1 ? "s" : ""}</span>`;

        h += `</div>`;

    return h + `</div>`;
  }

  function screenHoy(c) {

      h += `<div class="p-tarjeta" style="box-shadow:inset 0 0 0 2px var(--ojo)">

        <div class="row gap8" style="flex-wrap:wrap">
          <button class="btn-primary" onclick='fillGapDays("neutral", "${missingJson}", "${avgJson}")'>Completar como neutros</button>
          <button class="btn-secondary" ${c.daysCount === 0 ? "disabled" : ""} onclick='fillGapDays("average", "${missingJson}", "${avgJson}")'>Usar mi promedio</button>
          <button class="btn-secondary" onclick="ignoreGapDays()">Ignorar</button>
        </div>
      </div>`;
    }
    if (c.todayClosed) {
      const msg = c.todayStats ? dayCloseMessage(c.todayStats) : "";
      const festejo = justClosedCelebration && c.todayStats && (c.todayStats.net >= 0 || c.todayStats.cheat);
      h += `<div class="p-tarjeta ${festejo ? "celebrate" : ""}" style="position:relative;overflow:hidden;box-shadow:inset 0 0 0 2px var(--bien)">

        : `<div class="p-tarjeta">${cabecera("gasto", "llama", "Tu gasto de hoy", `<b style="font-size:16px;color:var(--text)">${kcal(e.info.total)}</b> kcal`, false)}</div>`;
      else if (id === "macros") h += macrosHTML(c, ab);
      else if (id === "comidas") h += comidasHTML(c, e, ab);
      else if (id === "nutrientes") h += nutrientesHoyHTML(c, ab);
      else if (id === "semana") h += semanaHoyHTML(c, ab);
      else if (id === "objetivo") h += objetivoHTML(c, ab, false);
    });
    h += `<button class="p-editar-inicio" onclick="abrirEditarInicio()">${icon("pencil", "var(--text)", 16)}Editar tu inicio</button>`;
    return h + pieVersion() + `</div>`;
  }

  // ---------- editar tu inicio ----------
  window.abrirEditarInicio = function () { editandoInicio = true; render(); };

  window.moverSeccion = function (id, d) {

  // Arrastrar desde los puntitos: la fila sigue al dedo y cambia de lugar al
  // pasar la mitad de la vecina. Con teclado, flechas arriba y abajo.
  function activarArrastre() {
    const lista = document.getElementById("lista-inicio");
    if (!lista) return;
    lista.querySelectorAll("[data-grip]").forEach((g) => {
      g.addEventListener("pointerdown", (ev) => {
        const fila = g.closest("[data-id]");
        if (!fila) return;
        ev.preventDefault();
        try { g.setPointerCapture(ev.pointerId); } catch (e) { /* sin captura igual anda */ }
        fila.classList.add("arrastrando");
        const mover = (e2) => {
          const prev = fila.previousElementSibling, next = fila.nextElementSibling;
          if (prev && e2.clientY < prev.getBoundingClientRect().top + prev.offsetHeight / 2) lista.insertBefore(fila, prev);
          else if (next && e2.clientY > next.getBoundingClientRect().top + next.offsetHeight / 2) lista.insertBefore(next, fila);
        };
        const soltar = () => {
          g.removeEventListener("pointermove", mover);
          g.removeEventListener("pointerup", soltar);
          g.removeEventListener("pointercancel", soltar);
          fila.classList.remove("arrastrando");
          const orden = Array.from(lista.querySelectorAll("[data-id]")).map((f) => f.getAttribute("data-id"));
          if (orden.join() !== configInicio().orden.join()) { guardarOrden(orden); render(); }
        };
        g.addEventListener("pointermove", mover);
        g.addEventListener("pointerup", soltar);
        g.addEventListener("pointercancel", soltar);
      });
    });
  }

            </div></div>`;
      return `<div class="p-fila-inicio" data-id="${id}" style="${visible ? "" : "opacity:.65"}">

  // ---------- una comida abierta ----------
  window.abrirComida = function (id) { comidaAbierta = id; verTodosNutr = false; confirmDeleteMealId = null; editingMealId = null; render(); };
  window.cerrarComida = function () { comidaAbierta = null; verTodosNutr = false; confirmDeleteMealId = null; editingMealId = null; render(); };
  window.toggleVerTodosNutr = function () { verTodosNutr = !verTodosNutr; render(); };
  function gruposMicros(m, c) {
    const refs = refsNutrientes();
    const n = nutrientesDeComida(m);
    const conRef = N.NUTRIENTES.filter((d) => d.ref === "meta" && refs[d.k] && d.k !== "proteinas_g").map((d) => ({ d, p: n[d.k] / refs[d.k], v: n[d.k] }));
    const aporta = conRef.filter((x) => x.p >= 0.15).sort((a, b) => b.p - a.p).slice(0, 3);
    const ojo = [];

  // ---------- PANTALLA: NUTRIENTES ----------

  const CONSEJOS = {

  window.elegirPeriodoNutr = function (p) { periodoNutr = Number(p) || 0; animarPantalla = true; render(); };
  function analisisNutrientes(c) {
    const desde = periodoNutr > 0 ? addDaysISO(c.todayStr, -periodoNutr) : "0000-00-00";
    const dias = c.dayStats.filter((d) => d.date < c.todayStr && d.date >= desde);
    if (!dias.length) return null;
    const comidas = [].concat.apply([], dias.map((d) => d.meals));
    const nd = nutrientesDeComidas(comidas);
    const n = {};
    Object.keys(nd.n).forEach((k) => { n[k] = nd.n[k] / dias.length; });
    const refs = refsNutrientes();
    const faltan = [], sobran = [], bien = [];
    N.NUTRIENTES.forEach((d) => {
      const v = n[d.k] || 0;
      if (d.ref === "meta" && refs[d.k]) { const p = v / refs[d.k]; (p < 0.7 ? faltan : bien).push({ d, v, ref: refs[d.k], p }); }
      else if (d.ref === "max" && refs[d.k]) { const p = v / refs[d.k]; (p > 1 ? sobran : bien).push({ d, v, ref: refs[d.k], p }); }
      else if (d.ref === "kcal10" && n.kcal > 0) { const lim = (n.kcal * 0.1) / 9; const p = v / lim; (p > 1 ? sobran : bien).push({ d, v, ref: lim, p }); }
    });
    faltan.sort((a, b) => a.p - b.p);
    sobran.sort((a, b) => b.p - a.p);
    return { n, faltan, sobran, bien, dias: dias.length, total: comidas.length, sinDetalle: nd.sinDetalle, desde: dias[dias.length - 1].date, hasta: dias[0].date };

  function screenNutrientes(c) {

    };
    h += seccion("Te faltan", "falta", a.faltan, 6);
    h += seccion("Te sobran", "rojo", a.sobran);
    if (a.bien.length) {
      h += `<div class="p-tarjeta" style="padding:16px">
        <div style="display:flex;align-items:center;gap:10px"><span style="width:30px;height:30px;border-radius:50%;background:var(--bienTexto);color:var(--bg);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center">${a.bien.length}</span><span style="font-size:18px;font-weight:800">Vas bien</span></div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">${a.bien.map((x) => `<span style="padding:8px 12px;border-radius:12px;background:var(--bienSuave);color:var(--bienTexto);font-size:13px;font-weight:700">${esc(nombreVisible(x.d))}</span>`).join("")}</div>
      </div>`;
    }
    h += `<p class="xs dim" style="margin:0;line-height:1.5">Comparado con lo recomendado para tu edad y sexo, en ${a.dias} día${a.dias !== 1 ? "s" : ""} cargado${a.dias !== 1 ? "s" : ""}. Te falta: menos del 70 % por día. Te sobra: pasaste el límite.${a.sinDetalle ? ` Se calcula con ${a.total - a.sinDetalle} de tus ${a.total} comidas; las otras no tienen detalle, así que las vitaminas pueden dar de menos.` : ""} ${esc(N.notaReferencias(goal.age, goal.gender === "female" ? "femenino" : "masculino"))}</p>`;
    return h + planHTML(c) + pieVersion() + `</div>`;
  }
  // Tu plan (lo que antes estaba en Dieta): el tipo de dieta reparte tu número
  // en proteínas, carbos y grasas, y tus comidas dicen qué te falta en el día.
  function planHTML(c) {
    const habituales = comidasHabituales();
    const d = dietaActual();
    return `<div class="p-tarjeta">
        <div class="p-cab"><span class="p-cab-titulo">${icon("barras", "var(--acento)", 20, 2.2)}Tu plan</span></div>
        <div class="col gap8" style="margin-top:12px">
          ${DIETAS.map((x) => `<button class="p-dieta" aria-pressed="${x.k === d.k}" onclick="elegirDieta('${x.k}')"><i></i><span style="flex:1;min-width:0"><span style="display:block;font-size:15px;font-weight:700">${x.nombre}</span><span class="xs dim">${x.detalle}</span></span><span class="xs" style="white-space:nowrap;color:${x.k === d.k ? "var(--acento)" : "var(--textDim)"};font-weight:700">C ${Math.round(x.carbos * 100)}, G ${Math.round((1 - x.carbos) * 100)}</span></button>`).join("")}
        </div>
        <div class="xs dim" style="margin-top:10px;line-height:1.45">La proteína es tu meta de Ajustes (${c.proteinTarget} g). La dieta reparte el resto de tu número entre carbohidratos (C) y grasas (G).</div>
        <div class="divider"></div>
        <div style="font-size:15px;font-weight:700">Tus comidas</div>
        <div class="row gap8" style="flex-wrap:wrap;margin-top:10px">
          ${COMIDAS_POSIBLES.map((m) => { const on = habituales.includes(m); return `<button class="opcion-chip ${on ? "on" : ""}" onclick="toggleComidaHabitual('${m}')" aria-pressed="${on}">${m}</button>`; }).join("")}
        </div>
        <div class="xs dim" style="margin-top:8px;line-height:1.45">${habituales.includes("Desayuno") ? "¿Ayunás a la mañana? Sacá el desayuno." : "Sin desayuno: ayunás hasta el mediodía y no te sugiero nada antes del almuerzo."}</div>
      </div>`;
  }

  // ---------- PANTALLA: PROGRESO ----------
  function screenProgreso(c) {
    const w = semanaPulso(c);
    const s = w.s;
    const ws = c.wSorted;
    const ultimo = ws.length ? ws[ws.length - 1] : null;
    const primero = ws.length ? ws[0] : null;
    const bajado = primero && ultimo ? primero.weight - ultimo.weight : 0;
    const diasPesaje = primero && ultimo ? Math.max(1, dayDiff(primero.date, ultimo.date)) : 0;
    const ritmoSemanal = diasPesaje > 0 ? (bajado / diasPesaje) * 7 : 0;
    const kg = Math.abs(w.deficit) / KCAL_PER_KG;
    let h = `<div class="p-pantalla">
      <div class="p-cabeza"><div class="p-titulo">Progreso</div><button class="icon-btn" onclick="setTab('ajustes')" aria-label="Ajustes">${icon("sliders", "var(--text)", 22)}</button></div>
      <div class="p-heroe sube" style="padding:18px;display:flex;flex-direction:column;gap:12px">
        <div class="row" style="justify-content:space-between;align-items:baseline"><div style="font-size:18px;font-weight:800">Tu semana</div><div class="small dim" style="font-weight:600">${esc(formatDate(s.dias[0].fecha))} a hoy</div></div>
        ${w.palabra ? `<div class="row gap8" style="align-items:center">${puntoEstado(w.est.tipo)}<span style="font-size:15px"><b>${w.palabra}:</b> ${w.frase}</span></div>` : `<div class="small dim">${w.frase}</div>`}
        <div style="position:relative;width:210px;max-width:100%;aspect-ratio:1/1;margin:2px auto 0">
          <svg role="img" aria-label="Tu semana: ${esc(w.palabra || "sin datos")}" width="100%" height="100%" viewBox="0 0 210 210" style="overflow:visible;display:block">${anilloSVG({ size: 210, r: 84, grosor: 16, est: w.est, ticks: true })}</svg>
          <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
            ${w.hechos.length ? `<div style="font-size:14px;font-weight:600;color:var(--textDim)">${w.deficit >= 0 ? "Bajaste" : "Subiste"}</div>
            <div style="font-weight:800;font-size:60px;line-height:.95;letter-spacing:-2px">${kg.toFixed(1).replace(".", ",")}</div>
            <div style="font-size:15px;font-weight:700;margin-top:2px">kg, aprox.</div>` : `<div style="font-size:15px;font-weight:700;color:var(--textDim);text-align:center">Sin días<br>completos</div>`}
          </div>
        </div>
        ${w.hechos.length ? `<div style="font-size:14px;text-align:center">${w.deficit >= 0 ? `Déficit de <b>${kcal(w.deficit)}</b> de ${kcal(w.plan)} planeadas` : `Superávit de <b>${kcal(-w.deficit)}</b> kcal`}</div>
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:6px">
          ${[["bien", w.cuenta.meta, "bien"], ["casi", w.cuenta.deficit, "casi"], ["de más", w.cuenta.superavit, "demas"], ["cheat", w.cuenta.cheat, "cheat"]].filter((x) => x[1] > 0).map(([t, n, tipo]) => `<span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 10px;border-radius:999px;background:var(--track);font-size:13px;font-weight:700">${puntoEstado(tipo)}${n} ${t}</span>`).join("")}
        </div>` : ""}
      </div>`;
    // Día por día: tocar uno muestra sus números y deja corregir su gasto.
    let detalle = `<div class="small dim">Tocá un día para ver sus números.</div>`;
    if (semanaSel != null && s.dias[semanaSel]) {
      const x = s.dias[semanaSel];
      const nombre = x.esHoy ? "Hoy" : formatDate(x.fecha);
      if (!x.d) detalle = `<div class="small"><b>${esc(nombre)}:</b> sin comidas cargadas.</div>`;
      else {
        const info = gastoInfo(x.fecha);
        const partes = [];
        info.items.forEach((it) => partes.push(`${it.nombre.toLowerCase()} ${kcal(it.kcal)}`));
        if (info.suelto > 0) partes.push(`ejercicio ${kcal(info.suelto)}`);
        if (Math.round(info.ajuste) !== 0) partes.push(`${info.deApp ? "según tu app" : "a mano"} ${info.ajuste > 0 ? "+" : "−"}${kcal(Math.abs(info.ajuste))}`);
        const palabra = { meta: ["Bien", "var(--bienTexto)"], deficit: ["Casi", "var(--ojoTexto)"], superavit: ["De más", "var(--rojoTexto)"], cheat: ["Día cheat", "var(--cheat)"], hoy: ["En curso", "var(--textDim)"] }[x.estado] || ["", "var(--textDim)"];
        const balance = x.gasto - x.consumido;
        detalle = `<div class="row" style="justify-content:space-between;align-items:baseline"><b style="font-size:15px">${esc(nombre)}</b><span style="font-size:13px;font-weight:700;color:${palabra[1]}">${palabra[0]}</span></div>
          <div style="font-size:14px;line-height:1.45">Comiste ${kcal(x.consumido)} de ${kcal(x.limite)}. Gastaste ${kcal(x.gasto)}${partes.length ? `: tu base y ${partes.join(", ")}` : ", solo tu base"}. ${balance >= 0 ? `Déficit de ${kcal(balance)}.` : `Superávit de ${kcal(-balance)}.`}</div>
          <button class="p-subrayado" style="display:flex;align-items:center;gap:6px;text-decoration:none;font-weight:700" onclick="abrirGasto('${x.fecha}')">${icon("llama", "var(--acento)", 16, 2.2)}Corregir el gasto de ese día${icon("chevR", "var(--text)", 14)}</button>`;
      }
    }
    h += `<div class="p-tarjeta" style="display:flex;flex-direction:column;gap:10px">
        <div class="row" style="justify-content:space-between;align-items:baseline"><div style="font-size:16px;font-weight:800">Día por día</div><div class="xs dim">Tocá uno para verlo</div></div>
        ${miniDiasHTML(s, true)}
        <div class="p-cuadro" style="display:flex;flex-direction:column;gap:4px;padding:12px 14px">${detalle}</div>
      </div>`;
    if (w.hechos.length) {
      h += `<div class="grid3" style="gap:8px">
        ${[["Comiste", kcal(w.comido / w.hechos.length), "kcal por día"], ["Gastaste", kcal(w.gasto / w.hechos.length), "kcal por día"], ["Proteína", Math.round(s.proteina) + " g", `de ${c.proteinTarget} por día`]].map(([a2, b, d2]) => `<div class="p-tarjeta" style="padding:12px">
          <div class="xs dim" style="font-weight:600">${a2}</div><div style="font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:2px">${b}</div><div style="font-size:11px;color:var(--textDim)">${d2}</div>
        </div>`).join("")}
      </div>`;
    }
    h += objetivoHTML(c, true, true);
    // Peso: la curva real contra el plan, y los pesajes.
    h += `<div class="p-tarjeta">
        <div class="row" style="justify-content:space-between;align-items:center;gap:10px">
          <div>
            <div class="xs dim" style="font-weight:600">Tu peso</div>
            ${ultimo ? `<div style="font-size:26px;font-weight:800;letter-spacing:-.6px">${ultimo.weight.toFixed(1).replace(".", ",")} <span style="font-size:14px;font-weight:700">kg</span></div>` : `<div style="font-size:20px;font-weight:800">Todavía no te pesaste</div>`}
            ${ultimo && primero && ws.length > 1 ? `<div class="small dim">${bajado >= 0 ? "Bajaste" : "Subiste"} ${Math.abs(bajado).toFixed(1).replace(".", ",")} kg, ${Math.abs(ritmoSemanal).toFixed(1).replace(".", ",")} por semana</div>` : `<div class="small dim">Pesate una vez por semana</div>`}
          </div>
          <div class="row gap14"><span class="xs dim"><span class="dash" style="background:var(--acento)"></span>Real</span><span class="xs dim"><span class="dash" style="background:var(--textDim)"></span>Plan</span></div>
        </div>
        <div style="margin-top:12px">${weightChartSVG()}</div>
        <div class="grid2" style="margin-top:12px">
          <div><label class="label" for="weighin-weight">Peso (kg)</label><input id="weighin-weight" type="text" inputmode="decimal" placeholder="84,5"></div>
          <div><label class="label" for="weighin-date">Fecha</label><input id="weighin-date" type="date" value="${todayISO()}"></div>
        </div>
        <button class="btn-primary" style="width:100%;margin-top:10px" onclick="addWeighIn()">Guardar pesaje</button>`;
    if (ws.length) {
      h += `<div class="col gap6" style="margin-top:12px">`;
      ws.slice().reverse().forEach((pw, i, arr) => {
        const anterior = arr[i + 1];
        const delta = anterior ? pw.weight - anterior.weight : null;
        if (editingWeighInId === pw.id) {
          h += `<div class="row" style="justify-content:space-between;align-items:center;background:var(--bg);border-radius:14px;padding:6px 6px 6px 12px;gap:8px;box-shadow:inset 0 0 0 2px var(--acento)">
            <span class="small">${formatDate(pw.date)}</span>
            <input id="edit-weighin-val-${pw.id}" type="text" inputmode="decimal" value="${pw.weight}" aria-label="Peso" style="width:90px;padding:8px">
            <button class="btn-ghost" onclick="saveEditWeighIn('${pw.id}')" aria-label="Guardar">${icon("check", "var(--bienTexto)", 18)}</button>
            <button class="btn-ghost" onclick="cancelEditWeighIn()" aria-label="Cancelar">${icon("close", "var(--textDim)", 18)}</button>
          </div>`;
        } else {
          h += `<div class="row" style="justify-content:space-between;align-items:center;background:var(--bg);border-radius:14px;padding:2px 4px 2px 12px;gap:6px">
            <span class="small" style="flex:1;min-width:0">${formatDate(pw.date)}</span>
            ${delta != null ? `<span class="xs" style="font-weight:700;color:${delta <= 0 ? "var(--bienTexto)" : "var(--rojoTexto)"}">${delta <= 0 ? "" : "+"}${delta.toFixed(1).replace(".", ",")}</span>` : ""}
            <span style="font-weight:800;font-size:15px">${pw.weight.toFixed(1).replace(".", ",")} kg</span>
            <button class="btn-ghost" onclick="startEditWeighIn('${pw.id}')" aria-label="Editar pesaje">${icon("pencil", "var(--textDim)", 16)}</button>
            <button class="btn-ghost" onclick="removeWeighIn('${pw.id}')" aria-label="Borrar pesaje">${icon("trash", "var(--textDim)", 16)}</button>
          </div>`;
        }
      });
      h += `</div>`;
    }
    h += `</div>`;
    if (c.calibration) {
      const cal = c.calibration;
      const kgWord = cal.actualKgLost >= 0 ? "bajaste" : "subiste";
      const dirWord = cal.discrepancyPerDay > 0 ? "más alto" : "más bajo";
      const wasCapped = Math.abs(cal.discrepancyPerDay) > Math.abs(cal.cappedAdjustment);
      h += `<div class="p-tarjeta" style="box-shadow:inset 0 0 0 2px var(--ojo)">
        <div class="row gap8" style="align-items:center;margin-bottom:8px">${icon("tune", "var(--ojoTexto)", 17)}<div style="font-weight:800">Ajuste sugerido</div></div>
        <div class="small dim" style="line-height:1.45;margin-bottom:12px">En ${cal.days} días ${kgWord} ${Math.abs(cal.actualKgLost).toFixed(1)} kg reales, pero lo registrado sugiere otro ritmo. Tu gasto base real parece estar ${dirWord}: cerca de <b style="color:var(--text)">${cal.suggestedMaintenance} kcal</b>, no ${goal.maintenance}.</div>
        ${Math.abs(cal.discrepancyPerDay) > 800 ? `<div class="xs" style="color:var(--rojoTexto);margin-bottom:10px">Este desajuste es muy grande para ser solo metabolismo: fijate si te faltó cargar alguna comida o algún día entero.</div>` : ""}
        ${wasCapped ? `<div class="xs dim" style="margin-bottom:10px">Para no sobrecorregir con pocos datos, el ajuste se aplica de a pasos de máximo 400 kcal/día.</div>` : ""}
        <div class="row gap10">
          <button class="btn-primary" style="flex:1" onclick="applyCalibration(${cal.suggestedMaintenance})">Aplicar</button>
          <button class="btn-secondary" style="flex:1" onclick="dismissCalibration(${cal.suggestedMaintenance})">Ahora no</button>
        </div>
      </div>`;
    }
    return h + pieVersion() + `</div>`;
  }

  // Escape cierra la hoja que esté arriba.
  document.addEventListener("keydown", function (ev) {
    if (ev.key !== "Escape") return;
    if (confirmarEj) { confirmarEj = null; render(); }
    else if (showCapture) closeCapture();
    else if (comidaAbierta) cerrarComida();
    else if (showIdeas) cerrarIdeas();
    else if (gastoFecha) cerrarGasto();
    else if (editandoInicio) cerrarEditarInicio();
  });

  function renderApp() {
    const c = computeCtx();
    let html = "";
    if (activeTab === "nutrientes") html += screenNutrientes(c);
    else if (activeTab === "historial") html += screenHistorial(c);
    else if (activeTab === "progreso") html += screenProgreso(c);
    else if (activeTab === "ajustes") html += screenAjustes(c);
    else html += screenHoy(c);

    html += navMarkup();
    if (showCapture) html += sheetCaptura(c);
    else if (comidaAbierta) html += sheetComida(c);
    else if (showIdeas) html += sheetIdeas(c);
    else if (gastoFecha) html += sheetGasto(c);
    else if (editandoInicio) html += sheetEditarInicio();
    if (confirmarEj) html += sheetConfirmarEjercicio();

    const root = document.getElementById("root");
    root.classList.toggle("anim", animarPantalla);
    root.innerHTML = html;
    animarPantalla = false;
    if (editandoInicio && !showCapture && !comidaAbierta && !showIdeas && !gastoFecha) activarArrastre();
  }

  function saveDictationDraft() {
    const t = document.getElementById("dictation-textarea");
    if (t) dictationDraft = t.value;
  }

  function render() {
    // Antes de reemplazar el DOM, rescatamos lo tipeado: de lo contrario
    // cualquier acción que redibuje (adjuntar foto, un error) lo borraba.
    saveDictationDraft();
    if (loading) { renderLoading(); return; }
    if (!goal.onboarded) { renderOnboarding(); return; }
    renderApp();
  }

  loadAll();
})();
</script>
</body>
</html>
