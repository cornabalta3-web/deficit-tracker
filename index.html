    const tope = Math.max(500, ...s.dias.map((x) => x.consumido * 1.1), ...s.dias.map((x) => x.limite * 1.25));
    const y = (v) => BASE - (v / tope) * (BASE - 14);
    // --semAmbar es un amarillo propio del gráfico: en el tema claro, el
    // --amber de los botones quedaba casi igual al rojo.
    const COLOR = { meta: "var(--sage)", deficit: "var(--semAmbar)", superavit: "var(--rust)" };
    const LETRA = ["D", "L", "M", "M", "J", "V", "S"];
    let barras = "", marcas = "", tocables = "";
    s.dias.forEach((x, i) => {
      const cx = slot * i + slot / 2, x0 = cx - ancho / 2;
      if (x.consumido > 0) {
        const top = y(x.consumido), r = Math.min(4, BASE - top);
        const d = `M${x0.toFixed(1)},${BASE} V${(top + r).toFixed(1)} Q${x0.toFixed(1)},${top.toFixed(1)} ${(x0 + r).toFixed(1)},${top.toFixed(1)} H${(x0 + ancho - r).toFixed(1)} Q${(x0 + ancho).toFixed(1)},${top.toFixed(1)} ${(x0 + ancho).toFixed(1)},${(top + r).toFixed(1)} V${BASE} Z`;
        // Hoy y cheat van con contorno, no relleno: no se juzgan, y así el
        // rosa del cheat no compite con el rojo del superávit.
        if (x.estado === "hoy") barras += `<path d="${d}" fill="var(--surfaceRaised)" stroke="var(--textDim)" stroke-width="1.5" stroke-dasharray="3 3"></path>`;
        else if (x.estado === "cheat") barras += `<path d="${d}" fill="none" stroke="var(--cheat)" stroke-width="1.5"></path>`;
        else barras += `<path d="${d}" fill="${COLOR[x.estado]}"></path>`;
        if (x.estado === "superavit") barras += `<text x="${cx.toFixed(1)}" y="${(top - 6).toFixed(1)}" text-anchor="middle" fill="var(--text)" font-size="10" font-weight="700">▲</text>`;
        if (x.estado === "cheat") barras += `<text x="${cx.toFixed(1)}" y="${Math.max(9, top - 5).toFixed(1)}" text-anchor="middle" fill="var(--textDim)" font-size="9">cheat</text>`;
      } else if (!x.esHoy) {
        barras += `<text x="${cx.toFixed(1)}" y="${BASE - 4}" text-anchor="middle" fill="var(--textDim)" font-size="10">–</text>`;
      }
      // El límite de ese día: una marca corta sobre su columna, con un borde
      // del color de la tarjeta para que se lea también encima de la barra.
      if ((x.d || x.esHoy) && x.estado !== "cheat") {
        const ly = y(x.limite).toFixed(1), a = (x0 - 4).toFixed(1), b = (x0 + ancho + 4).toFixed(1);
        marcas += `<line x1="${a}" y1="${ly}" x2="${b}" y2="${ly}" stroke="var(--surface)" stroke-width="5" stroke-linecap="round"></line>
          <line class="marca-limite" x1="${a}" y1="${ly}" x2="${b}" y2="${ly}" stroke="var(--text)" stroke-width="2" stroke-linecap="round"></line>`;
      }
      const dia = new Date(x.fecha + "T00:00:00").getDay();
      barras += `<text x="${cx.toFixed(1)}" y="${BASE + 16}" text-anchor="middle" fill="${x.esHoy ? "var(--text)" : "var(--textDim)"}" font-size="11" ${x.esHoy ? 'font-weight="700"' : ""}>${x.esHoy ? "Hoy" : LETRA[dia]}</text>`;
      // Área tocable de toda la columna: más grande que la barra.
      tocables += `<rect x="${(slot * i).toFixed(1)}" y="0" width="${slot.toFixed(1)}" height="${H + 10}" fill="transparent" style="cursor:pointer;" onclick="selDiaSemana(${i})"><title>${esc(formatDate(x.fecha))}: ${kcal(x.consumido)} kcal</title></rect>`;
    });

    let detalle = "Tocá un día para ver sus números.";
    if (semanaSel != null && s.dias[semanaSel]) {
      const x = s.dias[semanaSel];
      const nombre = formatDate(x.fecha);
      if (!x.d) detalle = `${nombre}: sin comidas cargadas.`;
      else {
        const ej = x.d.exercise ? ` (con ${kcal(x.d.exercise)} de ejercicio)` : x.d.usedAppTotal ? " (total de tu app)" : "";
        const extra = {
          cheat: "día cheat",
          hoy: `en curso, límite ${kcal(x.limite)}`,
          meta: `cumpliste la meta, ${kcal(x.limite - x.consumido)} abajo del límite`,
          deficit: `déficit de ${kcal(x.gasto - x.consumido)}; te faltaron ${kcal(x.consumido - x.limite)} para la meta`,
          superavit: `comiste ${kcal(x.consumido - x.gasto)} más de lo que gastaste`,
        }[x.estado];
        detalle = `<b style="color:var(--text);">${nombre}</b>: comiste ${kcal(x.consumido)} · gastaste ${kcal(x.gasto)}${ej} · ${extra}.`;
        if (x.soloBasal && (x.estado === "deficit" || x.estado === "superavit")) {
          detalle += `<br>Ese día cuenta solo tu basal. ¿Entrenaste? Sumalo en Historial → Editar gasto del día.`;
        }
      }
    }

    return `<div class="card">
      <div class="row" style="justify-content:space-between;align-items:baseline;">
        <div class="hero-label">Últimos 7 días</div>
        <div class="xs dim">${formatDate(s.dias[0].fecha)} – hoy</div>
      </div>
      <div style="font-size:21px;font-weight:700;margin-top:8px;line-height:1.25;">${s.contables ? `${s.enDeficit} de ${s.contables} día${s.contables !== 1 ? "s" : ""} en déficit` : "Todavía no hay días completos"}</div>
      ${s.contables ? `<div class="small" style="margin-top:4px;"><b style="color:var(--sage);">${s.cumplidos}</b> cumpliendo la meta de ${kcal(s.meta)} kcal</div>` : ""}
      <div class="xs dim" style="margin-top:4px;">Sin contar los días cheat ni hoy, que está en curso. Cada día se mide con lo que gastaste ese día, ejercicio incluido.</div>
      <svg role="img" aria-label="Calorías de los últimos 7 días, cada una contra el límite de su día" width="100%" viewBox="0 0 ${W} ${H + 12}" style="display:block;margin-top:16px;overflow:visible;font-family:-apple-system, Helvetica Neue, Arial, sans-serif;">
        <line x1="0" y1="${BASE}" x2="${W}" y2="${BASE}" stroke="var(--line)" stroke-width="1"></line>
        ${barras}${marcas}${tocables}
      </svg>
      <div class="xs dim" style="margin-top:8px;min-height:18px;line-height:1.45;">${detalle}</div>
      <div class="row" style="flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:11px;color:var(--textDim);">
        <span><span class="sq" style="background:var(--sage);"></span>Cumpliste la meta</span>
        <span><span class="sq" style="background:var(--semAmbar);"></span>En déficit, sin llegar a la meta</span>
        <span><span class="sq" style="background:var(--rust);"></span>▲ Comiste más de lo que gastaste</span>
        <span><span class="dash" style="background:var(--text);"></span>Límite de ese día</span>
        <span><span class="sq" style="border:1.5px solid var(--cheat);box-sizing:border-box;"></span>Cheat</span>
        <span><span class="sq" style="border:1px dashed var(--textDim);box-sizing:border-box;"></span>Hoy, en curso</span>
      </div>
      <div class="grid3" style="margin-top:16px;gap:8px;">
        <div class="tile"><div class="stat-mini">Promedio</div><div>${kcal(s.promedio)}</div><div class="xs dim">kcal por día</div></div>
        <div class="tile"><div class="stat-mini">Proteína</div><div style="color:var(--protein);">${Math.round(s.proteina)} g</div><div class="xs dim">de ${c.proteinTarget} por día</div></div>
        <div class="tile"><div class="stat-mini">${s.deficit >= 0 ? "Déficit" : "Superávit"}</div><div style="color:${s.deficit >= 0 ? "var(--sage)" : "var(--rust)"};">${kcal(Math.abs(s.deficit))}</div><div class="xs dim">kcal ≈ ${(Math.abs(s.deficit) / KCAL_PER_KG).toFixed(1).replace(".", ",")} kg</div></div>
      </div>
    </div>`;
  }

  // ---------- nube ----------
  //
  // Todo el estado viaja a netlify/functions/datos.js con un código al azar.
  // Se guarda solo, unos segundos después de cada cambio. En otro celular,
  // poniendo el código, se baja todo. Sin cuenta ni contraseña: quien tenga el
  // código ve los datos (la persona lo eligió así).
  const ALFABETO = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
  const CODIGO_RE = /^[2-9A-HJ-NP-Z]{4}-[2-9A-HJ-NP-Z]{4}-[2-9A-HJ-NP-Z]{4}$/;
  let nube = { codigo: null, guardado: null, estado: "nuevo" }; // estado: nuevo | guardando | ok | error
  let nubeTimer = null;
  let nubeMsg = null;             // {tipo, texto} en Ajustes
  let nubeEncontrada = null;      // {codigo, guardado, datos} esperando confirmación
  let nubeBuscando = false;
  // Va directo a localStorage: si pasara por window.storage dispararía otro guardado.
  function persistNube() { try { localStorage.setItem("deficit_nube", JSON.stringify({ codigo: nube.codigo, guardado: nube.guardado })); } catch (e) { console.error(e); } }
  function cargarNube() {
    try { const n = JSON.parse(localStorage.getItem("deficit_nube") || "null"); if (n && CODIGO_RE.test(n.codigo)) nube = { codigo: n.codigo, guardado: n.guardado || null, estado: n.guardado ? "ok" : "nuevo" }; } catch (e) { /* queda nueva */ }
  }
  function generarCodigo() {
    const b = new Uint8Array(12);
    crypto.getRandomValues(b);
    const t = Array.from(b, (x) => ALFABETO[x % 32]).join("");
    return `${t.slice(0, 4)}-${t.slice(4, 8)}-${t.slice(8)}`;
  }
  function asegurarCodigo() { if (!nube.codigo) { nube = { codigo: generarCodigo(), guardado: null, estado: "nuevo" }; persistNube(); } }
  function fotoDelEstado() { return { app: "deficit", version: APP_VERSION, meals, dayMeta, goal, weighIns, frecuentes }; }

  // Varios cambios seguidos (cargar una comida toca meals y dayMeta) se juntan
  // en un solo envío.
  function programarGuardado() {
    if (!goal.onboarded) return;
    clearTimeout(nubeTimer);
    nubeTimer = setTimeout(guardarEnNube, 3000);
  }
  // Todo lo que se guarda pasa por window.storage.set (comidas, días, objetivo,
  // pesajes, Lo de siempre): engancharse ahí cubre cualquier cambio, incluso
  // los que se agreguen más adelante.
  const setLocal = window.storage.set;
  window.storage.set = async function (key, value) {
    const r = await setLocal.call(window.storage, key, value);
    programarGuardado();
    return r;
  };
  // De a uno por vez: si un envío tardara más que la espera, el viejo podría
  // llegar después del nuevo y pisarlo. Lo que cambie mientras tanto sale
  // apenas termina el que está en camino.
  let nubeEnCamino = false;
  let nubePendiente = false;
  async function guardarEnNube() {
    if (!goal.onboarded) return;
    if (nubeEnCamino) { nubePendiente = true; return; }
    nubeEnCamino = true;
    asegurarCodigo();
    // Si en el camino cambia el código (recuperaste otro o borraste todo), la
    // respuesta de este envío ya no habla del código actual.
    const codigo = nube.codigo;
    nube.estado = "guardando";
    pintarEstadoNube();
    try {
      const r = await fetch("/.netlify/functions/datos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ accion: "guardar", codigo, datos: fotoDelEstado() }),
      });
      const obj = await r.json();
      if (!r.ok) throw new Error(obj.error || "Error");
      if (nube.codigo === codigo) { nube.guardado = obj.guardado; nube.estado = "ok"; persistNube(); }
    } catch (e) {
      console.error(e);
      if (nube.codigo === codigo) nube.estado = "error";
    }
    nubeEnCamino = false;
    pintarEstadoNube();
    if (nubePendiente) { nubePendiente = false; guardarEnNube(); }
  }
  // Sin render(): en Ajustes podés estar pegando un código o escribiendo un
  // peso, y redibujar te lo borraría.
  function estadoNube() {
    const texto = nube.estado === "guardando" ? "Guardando…"
      : nube.estado === "error" ? "Sin conexión: se guarda cuando vuelva"
      : nube.guardado ? `Guardado ${haceCuanto(nube.guardado)}` : "Se guarda con el próximo cambio";
    return { texto, color: nube.estado === "error" ? "var(--amber)" : "var(--sage)" };
  }
  function pintarEstadoNube() {
    const el = document.getElementById("nube-estado");
    if (!el) return;
    const e = estadoNube();
    el.textContent = e.texto;
    el.style.color = e.color;
  }
  // Si quedó algo sin subir (sin señal), se reintenta al volver la conexión o
  // al volver a abrir la app.
  window.addEventListener("online", () => { if (nube.estado === "error") guardarEnNube(); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && nube.estado === "error") guardarEnNube(); });

  function haceCuanto(iso) {
    const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (!(min >= 0)) return "";
    if (min < 1) return "recién";
    if (min < 60) return `hace ${min} minuto${min !== 1 ? "s" : ""}`;
    const hs = Math.round(min / 60);
    if (hs < 24) return `hace ${hs} hora${hs !== 1 ? "s" : ""}`;
    return `el ${new Date(iso).toLocaleDateString("es-AR", { day: "numeric", month: "long" })}`;
  }

  window.copiarCodigo = function () {
    const listo = () => { nubeMsg = { tipo: "ok", texto: "Código copiado." }; render(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(nube.codigo).then(listo, () => { nubeMsg = { tipo: "error", texto: "No se pudo copiar: anotalo a mano." }; render(); });
    else { nubeMsg = { tipo: "error", texto: "No se pudo copiar: anotalo a mano." }; render(); }
  };
  window.buscarEnNube = async function () {
    const el = document.getElementById("nube-codigo");
    const codigo = (el ? el.value : "").trim().toUpperCase().replace(/\s+/g, "");
    nubeEncontrada = null;
    if (!CODIGO_RE.test(codigo)) { nubeMsg = { tipo: "error", texto: "El código son tres grupos de 4, como 7Q4M-92KD-H3TP." }; render(); return; }
    if (codigo === nube.codigo) { nubeMsg = { tipo: "error", texto: "Ese es el código de este celular." }; render(); return; }
    nubeBuscando = true; nubeMsg = null;
    render();
    try {
      const r = await fetch("/.netlify/functions/datos", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ accion: "leer", codigo }) });
      const obj = await r.json();
      if (!r.ok) throw Object.assign(new Error(obj.error || "Error"), { codigo: obj.code });
      if (!obj.datos || !Array.isArray(obj.datos.meals)) throw new Error("forma");
      nubeEncontrada = { codigo, guardado: obj.guardado, datos: obj.datos };
    } catch (e) {
      console.error(e);
      nubeMsg = { tipo: "error", texto: e.codigo === "codigo_desconocido" ? "No hay datos guardados con ese código. Revisalo." : e instanceof TypeError ? "No hay conexión. Probá de nuevo." : "No se pudo traer. Probá de nuevo en un rato." };
    } finally {
      nubeBuscando = false;
      render();
    }
  };
  window.cancelarNube = function () { nubeEncontrada = null; render(); };
  window.usarDatosDeNube = async function () {
    if (!nubeEncontrada) return;
    const d = nubeEncontrada.datos;
    // Primero el código: lo que se guarde desde ahora va a esa misma copia.
    nube = { codigo: nubeEncontrada.codigo, guardado: nubeEncontrada.guardado, estado: "ok" };
    persistNube();
    meals = Array.isArray(d.meals) ? d.meals : [];
    dayMeta = d.dayMeta && typeof d.dayMeta === "object" ? d.dayMeta : {};
    goal = { ...DEFAULT_GOAL, ...(d.goal || {}) };
    weighIns = Array.isArray(d.weighIns) ? d.weighIns : [];
    frecuentes = Array.isArray(d.frecuentes) ? d.frecuentes : [];
    await Promise.all([persistMeals(), persistDayMeta(), persistGoal(), persistWeighIns()]);
    persistFrecuentes();
    nubeEncontrada = null;
    nubeMsg = { tipo: "ok", texto: `Listo: se recuperaron ${meals.length} comida${meals.length !== 1 ? "s" : ""}.` };
    applyTheme();
    render();
  };

  function nubeHTML() {
    const e = estadoNube();
    let h = `<div class="card" style="border-color:var(--sage);">
      <div class="row gap10" style="align-items:center;">
        <span class="nube-icono">${icon("nube", "var(--sage)", 20, 1.9)}</span>
        <div>
          <div class="title">Tus datos en la nube</div>
          <div id="nube-estado" class="xs" style="color:${e.color};margin-top:2px;">${esc(e.texto)}</div>
        </div>
      </div>
      <div class="small dim" style="line-height:1.45;margin-top:12px;">Cada comida, pesaje y ajuste se guarda solo. Si cambiás de celular o se borra el navegador, no perdés nada.</div>
      <div class="hero-label" style="margin-top:16px;">Tu código</div>
      <div class="row gap10" style="align-items:center;margin-top:6px;">
        <div class="codigo">${esc(nube.codigo || "—")}</div>
        <button class="btn-secondary" style="min-height:48px;" onclick="copiarCodigo()">Copiar</button>
      </div>
      <div class="xs dim" style="line-height:1.45;margin-top:8px;">Guardalo en un lugar seguro, por ejemplo mandátelo por WhatsApp. Con este código se pueden ver tus datos: no se lo pases a nadie.</div>
      <div class="divider"></div>
      <div class="small" style="font-weight:700;">¿Celular nuevo?</div>`;
    h += recuperarHTML("Abrí la app en el celular nuevo, entrá acá y pegá el código del viejo. Se baja todo tu historial.");
    return h + `</div>`;
  }

  // Pegar un código y bajar los datos: en Ajustes y en la bienvenida, para que
  // en un celular nuevo no haya que completar "Contame sobre vos" primero.
  function recuperarHTML(ayuda, secundario) {
    let h = "";
    if (nubeEncontrada) {
      const nComidas = nubeEncontrada.datos.meals.length;
      h += `<div class="veredicto" style="margin-top:10px;">Encontré datos guardados ${haceCuanto(nubeEncontrada.guardado)}: <b>${nComidas} comida${nComidas !== 1 ? "s" : ""}</b>. Usarlos reemplaza lo que hay en este celular.</div>
        <div class="row gap10" style="margin-top:10px;">
          <button class="btn-primary" style="flex:1;min-height:48px;" onclick="usarDatosDeNube()">Sí, usar esos datos</button>
          <button class="btn-secondary" style="flex:1;min-height:48px;" onclick="cancelarNube()">Cancelar</button>
        </div>`;
    } else {
      h += `<div class="xs dim" style="margin-top:4px;line-height:1.45;">${ayuda}</div>
        <input id="nube-codigo" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="Pegá tu código" style="margin-top:10px;text-transform:uppercase;">
        <button class="${secundario ? "btn-secondary" : "btn-primary"} big-btn" style="width:100%;margin-top:10px;" onclick="buscarEnNube()" ${nubeBuscando ? "disabled" : ""}>${nubeBuscando ? '<span class="spin">↻</span> Buscando…' : "Recuperar mis datos"}</button>`;
    }
    if (nubeMsg) h += `<div class="small" style="margin-top:10px;color:${nubeMsg.tipo === "error" ? "var(--rust)" : "var(--sage)"};">${esc(nubeMsg.texto)}</div>`;
    return h;
  }

  // ---------- PANTALLA: HOY ----------
  function screenHoy(c) {
    const kgMostrados = Math.max(0, c.kgLost);
    const totalKg = Math.max(0, goal.currentWeight - goal.goalWeight);
    const cheatHoy = !!(dayMeta[c.todayStr] && dayMeta[c.todayStr].cheat);
    const fechaHoy = new Date().toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
    let h = `<div class="screen">`;

    // Jerarquía: arriba el día que estás viviendo —lo que te queda, macros,
    // comidas y nutrientes—, que es lo que mirás y tocás varias veces por día.
    // Abajo el objetivo de largo plazo, que se mueve de a poco y abre Progreso.
    h += `<div class="topbar">
      <div>
        <div style="font-size:26px;font-weight:700;line-height:1.1;">Hoy</div>
        <div class="small dim" style="margin-top:2px;">${esc(fechaHoy.charAt(0).toUpperCase() + fechaHoy.slice(1))}</div>
      </div>
      <button class="icon-btn" onclick="setTab('ajustes')" aria-label="Ajustes">${icon("sliders", "var(--textDim)", 22)}</button>
    </div>`;

    // Reparación para quien ya tiene un gasto base imposible guardado de antes
    // de que existieran las validaciones. No se arregla solo: el dato ya está
    // en localStorage y nada lo vuelve a calcular salvo que la persona lo pida.
    if (!gastoPlausible(goal.maintenance)) {
      h += `<div class="card" style="border-color:var(--rust);">
        <div class="row gap8" style="align-items:center;margin-bottom:8px;">
          ${icon("tune", "var(--rust)", 17)}<div class="small" style="font-weight:700;">Revisá tus datos</div>
        </div>
        <div class="small dim" style="line-height:1.45;margin-bottom:14px;">
          Tu gasto base figura en <span style="color:var(--text);font-weight:700;">${kcal(goal.maintenance)} kcal/día</span>, que no es un valor posible.
          Suele pasar por cargar la altura en metros (1,75) en vez de centímetros (175), o el año de nacimiento en el campo de edad.
          Mientras siga así, todos los balances te van a dar mal.
        </div>
        <button class="btn-primary" onclick="setTab('ajustes')">Corregir mis datos</button>
      </div>`;
    }

    if (c.showGapBanner) {
      const missingJson = esc(JSON.stringify(c.missingDates)).replace(/"/g, "&quot;");
      const avgJson = esc(JSON.stringify(c.avgForFill)).replace(/"/g, "&quot;");
      h += `<div class="card" style="border-color:var(--amber);">
        <div class="title" style="margin-bottom:6px;">Te faltan ${c.missingDates.length} día${c.missingDates.length !== 1 ? "s" : ""} sin registrar</div>
        <div class="small dim" style="margin-bottom:14px;">Del ${formatDate(c.missingDates[0])} al ${formatDate(c.missingDates[c.missingDates.length - 1])}. ¿Qué hacemos con esos días para no perder la cuenta? Si te acordás qué comiste, también podés cargarlo de verdad: tocá + y cambiá la fecha antes de guardar.</div>
        <div class="row gap10" style="flex-wrap:wrap;">
          <button class="btn-primary" onclick='fillGapDays("neutral", "${missingJson}", "${avgJson}")'>Completar como neutros</button>
          <button class="btn-secondary" ${c.daysCount === 0 ? "disabled" : ""} onclick='fillGapDays("average", "${missingJson}", "${avgJson}")'>Usar mi promedio</button>
          <button class="btn-secondary" onclick="ignoreGapDays()">Ignorar</button>
        </div>
      </div>`;
    }

    // ---- 1. El día ----
    const consumido = c.todayStats ? c.todayStats.consumed : 0;
    const gasto = c.todayStats ? c.todayStats.gasto : goal.maintenance;
    const neto = gasto - consumido;
    const e = estadoDelDia({ consumido, gasto, meta: metaDiaria(c), cheat: cheatHoy });
    const pctProt = c.proteinTarget > 0 ? Math.min(100, (c.todayProtein / c.proteinTarget) * 100) : 0;
    const colorNeto = cheatHoy ? "var(--cheat)" : neto >= 0 ? "var(--sage)" : formatBalance(neto).color;

    h += `<div class="card" style="${cheatHoy ? "border-color:var(--cheat);" : ""}">
      <div class="hero-label" style="${cheatHoy ? "color:var(--cheat);" : ""}">${cheatHoy ? icon("cheat", "var(--cheat)", 13) : ""}${e.etiqueta}</div>
      <div class="row" style="align-items:baseline;gap:8px;margin-top:6px;">
        <div class="hero-big" style="color:${e.color};">${e.numero}</div>
        <div style="font-size:18px;font-weight:700;color:var(--textDim);">${e.unidad}</div>
      </div>
      <div class="small dim" style="margin-top:6px;line-height:1.4;">${e.sub}</div>
      <div class="track" style="height:8px;margin-top:18px;"><i style="width:${Math.min(100, e.pct).toFixed(0)}%;background:${e.color};"></i></div>
      <div class="xs dim" style="text-align:right;margin-top:6px;">${e.der}</div>

      <div class="grid3" style="margin-top:14px;gap:8px;">
        <div><div class="stat-mini">Comiste</div><div>${kcal(consumido)}</div></div>
        <div><div class="stat-mini">Gastaste${c.todayStats && c.todayStats.usedAppTotal ? " (app)" : ""}</div><div>${kcal(gasto)}</div></div>
        <div><div class="stat-mini">${neto >= 0 ? "Déficit" : "Superávit"}</div><div style="color:${colorNeto};">${neto >= 0 ? "" : "+"}${kcal(Math.abs(neto))}</div></div>
      </div>

      <div class="divider"></div>

      <div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:8px;">
        <div class="small" style="font-weight:700;">Proteína</div>
        <div class="small dim"><span style="color:var(--protein);font-weight:700;">${c.todayProtein.toFixed(0)}</span> de ${c.proteinTarget} g</div>
      </div>
      <div class="track"><i style="width:${pctProt.toFixed(0)}%;background:var(--protein);"></i></div>
      <div class="row gap20" style="margin-top:12px;flex-wrap:wrap;">
        <span class="small dim"><span class="sq" style="background:var(--carbs);"></span>Carbohidratos ${(c.todayStats ? c.todayStats.carbs : 0).toFixed(0)} g</span>
        <span class="small dim"><span class="sq" style="background:var(--fat);"></span>Grasas ${(c.todayStats ? c.todayStats.fat : 0).toFixed(0)} g</span>
      </div>

      <div class="row gap8" style="margin-top:16px;align-items:center;flex-wrap:wrap;">
        <button class="chip chip-btn ${cheatHoy ? "cheat-on" : "dim"}" onclick="toggleCheat('${c.todayStr}')">${icon("cheat", cheatHoy ? "var(--cheat)" : "var(--textDim)", 14)} ${cheatHoy ? "Día cheat · quitar" : "Marcar día cheat"}</button>
      </div>
    </div>`;

    // Día cerrado
    if (c.todayClosed) {
      const msg = c.todayStats ? dayCloseMessage(c.todayStats) : "";
      const festejo = justClosedCelebration && c.todayStats && (c.todayStats.net >= 0 || c.todayStats.cheat);
      h += `<div class="card ${festejo ? "celebrate" : ""}" style="position:relative;overflow:hidden;border-color:var(--sage);">
        ${festejo ? confettiMarkup() : ""}
        <div class="row gap8" style="align-items:center;margin-bottom:10px;">${icon("check", "var(--sage)", 17)}<span class="small" style="font-weight:700;">Ya cerraste el día de hoy</span></div>
        <div class="small" style="margin-bottom:14px;">${msg}</div>
        <button class="btn-secondary" onclick="reopenDay('${c.todayStr}')">Reabrir para agregar algo más</button>
      </div>`;
      justClosedCelebration = false;
    }

    // Comidas de hoy: se tocan para ver el detalle, editar o borrar.
    const comidas = c.todayStats ? c.todayStats.meals : [];
    h += `<div class="row" style="justify-content:space-between;align-items:baseline;margin:6px 0 10px;">
      <div class="title" style="font-size:17px;">${comidas.length ? `${comidas.length} comida${comidas.length !== 1 ? "s" : ""} hoy` : "Comidas de hoy"}</div>
      ${comidas.length && !c.todayClosed ? `<button class="link-btn" style="font-size:13px;" onclick="openCloseDayConfirm()">Cerrar día</button>` : ""}
    </div>`;

    if (!comidas.length) {
      h += `<div class="card" style="text-align:center;padding:28px 20px;">
        <div class="small dim" style="margin-bottom:14px;">Todavía no cargaste nada hoy.</div>
        <button class="btn-primary" onclick="openCapture()">Cargar la primera comida</button>
      </div>`;
    } else {
      h += `<div class="col gap8">${comidas.map(comidaCardHTML).join("")}</div>`;
    }

    if (showCloseDayConfirm && c.todayStats) {
      const bal = balanceDe(c.todayStats.net, cheatHoy);
      h += `<div class="card" style="border-color:var(--amber);margin-top:14px;">
        <div style="font-weight:700;margin-bottom:10px;">Resumen final de hoy</div>
        <div class="col gap6" style="margin-bottom:12px;">
          ${c.todayStats.meals.map((m) => `<div class="row" style="justify-content:space-between;font-size:12px;"><span class="dim" style="font-style:italic;">${esc(m.note)}</span><span>${kcal(m.consumed)} kcal</span></div>`).join("")}
        </div>
        <div class="grid2" style="margin-bottom:12px;">
          ${Stat("Comiste", kcal(c.todayStats.consumed) + " kcal")}
          ${Stat("Gastaste", kcal(c.todayStats.gasto) + " kcal" + (c.todayStats.usedAppTotal ? " (app)" : ""))}
          ${Stat("Balance", bal.text, bal.color)}
          ${Stat("Proteína", c.todayStats.protein.toFixed(0) + " g", "var(--protein)")}
        </div>
        <div class="row gap10">
          <button class="btn-sage" style="flex:1;" onclick="closeToday()">Confirmar y cerrar</button>
          <button class="btn-secondary" onclick="cancelCloseDayConfirm()">Seguir agregando</button>
        </div>
      </div>`;
    }

    // Nutrientes del día: solo si hay algo cargado, plegado por defecto.
    if (comidas.length) {
      const nd = nutrientesDeComidas(comidas);
      h += `<div class="card" style="margin-top:14px;">
        <div class="title" style="font-size:17px;margin-bottom:12px;">Nutrientes de hoy</div>
        ${bloqueNutrientes(nd.n, nd.sinDetalle, showDayNutrients, "toggleDayNutrients()")}
      </div>`;
    }

    // ---- 2. El objetivo ----
    // Toda la tarjeta es el botón a Progreso (peso, pesajes, promedios), que
    // ya no está en la barra de abajo.
    h += `<div class="section-title">Tu objetivo</div>
    <button class="card goal-btn" onclick="setTab('progreso')">
      <div class="row" style="justify-content:space-between;align-items:baseline;">
        <div class="row" style="align-items:baseline;gap:6px;">
          <div style="font-size:30px;font-weight:700;line-height:1;">${kgMostrados.toFixed(1).replace(".", ",")}</div>
          <div class="small dim" style="font-weight:700;">de ${totalKg.toFixed(0)} kg menos</div>
        </div>
        <div class="small dim">${c.pct.toFixed(0)}%</div>
      </div>
      <div class="track" style="margin-top:12px;"><i style="width:${c.pct.toFixed(1)}%;background:var(--amber);"></i></div>
      <div class="row small dim" style="justify-content:space-between;align-items:baseline;margin-top:9px;">
        <div>${c.remaining > 0 ? `Faltan <span style="color:var(--text);font-weight:700;">${kcal(c.remaining)}</span> kcal` : `<span style="color:var(--sage);font-weight:700;">¡Objetivo cumplido!</span>`}</div>
        <div>${c.daysLeft} día${c.daysLeft !== 1 ? "s" : ""}</div>
      </div>`;
    if (c.streak > 0 || c.badges.length) {
      h += `<div class="row gap8" style="margin-top:14px;flex-wrap:wrap;">`;
      if (c.streak > 0) h += `<span class="chip">${icon("flame", "var(--amber)", 13)} ${c.streak} día${c.streak !== 1 ? "s" : ""} seguido${c.streak !== 1 ? "s" : ""}</span>`;
      h += c.badges.map((b) => `<span class="badge-pill">${b.icon} ${esc(b.label)}</span>`).join("");
      h += `</div>`;
    }
    h += `<div class="divider" style="margin:16px 0 12px;"></div>
      <div class="row small" style="justify-content:space-between;align-items:center;color:var(--amber);"><span>Ver progreso y pesajes</span>${icon("chevR", "var(--amber)", 16)}</div>
    </button>`;

    return h + pieVersion() + `</div>`;
  }

  // ---------- PANTALLA: HISTORIAL ----------
  function screenHistorial(c) {
    let h = `<div class="screen">
      <div class="topbar"><div style="font-size:22px;font-weight:700;">Historial</div>
      <span class="small dim">${c.dayStats.length} día${c.dayStats.length !== 1 ? "s" : ""}</span></div>`;

    // Para un día que no aparece (no tiene ni una comida): la carga deja elegir
    // la fecha antes de guardar.
    h += `<div class="xs dim" style="margin:-4px 0 14px;">¿Te faltó un día entero? Tocá <b>+</b>, cargá la comida y cambiá la fecha antes de guardar.</div>`;

    if (c.dayStats.length === 0) {
      h += `<div class="card" style="text-align:center;padding:32px 20px;"><div class="small dim">Todavía no registraste ninguna comida.</div></div>`;
      return h + `</div>`;
    }

    h += `<div class="col gap10">`;
    c.dayStats.forEach((day) => {
      const bal = balanceDe(day.net, day.cheat);
      h += `<div style="background:var(--surface);border:1px solid ${day.cheat ? "var(--cheat)" : "var(--line)"};border-radius:12px;overflow:hidden;">
        <div class="row" style="align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;gap:8px;" onclick="toggleDayExpand('${day.date}')">
          <div style="flex:1;min-width:0;">
            <div class="small" style="font-weight:700;">${formatDate(day.date)} <span class="dim" style="font-weight:400;">· ${day.meals.length} comida${day.meals.length !== 1 ? "s" : ""}</span>${day.closed ? ` <span style="color:var(--sage);font-weight:700;font-size:11px;">✓</span>` : ""}${day.cheat ? `<span class="pill-cheat">CHEAT</span>` : ""}</div>
            <div class="xs dim">${kcal(day.consumed)} kcal · gasto ${kcal(day.gasto)}${day.usedAppTotal ? " (app)" : ""} · ${macroInline(day.protein, day.carbs, day.fat)}</div>
          </div>
          <div style="font-weight:700;font-size:15px;color:${bal.color};flex-shrink:0;">${bal.text}</div>
          <span class="dim" style="flex-shrink:0;">${expandedDays[day.date] ? "▲" : "▼"}</span>
        </div>`;

      if (expandedDays[day.date]) {
        h += `<div class="dia-abierto" style="padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;">`;

        if (editingDayMeta === day.date) {
          h += `<div style="background:var(--bg);border-radius:8px;padding:12px;border:1px solid var(--amber);">
            <div class="grid2" style="margin-bottom:10px;">
              <div><label class="label">Gasto total de una app</label><input id="edit-day-te-${day.date}" type="number" placeholder="vacío = base + ejercicio" value="${day.usedAppTotal ? day.gasto : ""}"></div>
              <div><label class="label">Ejercicio (kcal)</label><input id="edit-day-ex-${day.date}" type="number" value="${day.exercise || 0}"></div>
            </div>
            <div class="row gap8">
              <button class="btn-sage" onclick="saveEditDayMeta('${day.date}')">Guardar</button>
              <button class="btn-secondary" onclick="cancelEditDayMeta()">Cancelar</button>
            </div>
          </div>`;
        } else {
          h += `<div class="row gap8" style="flex-wrap:wrap;">
            <button class="mini-btn" onclick="openCapture('${day.date}')">${icon("plus", "var(--textDim)", 12, 2)} Agregar comida</button>
            <button class="mini-btn" onclick="startEditDayMeta('${day.date}')">Editar gasto del día</button>
            <button class="mini-btn" style="${day.cheat ? "border-color:var(--cheat);color:var(--cheat);" : ""}" onclick="toggleCheat('${day.date}')">${icon("cheat", day.cheat ? "var(--cheat)" : "var(--textDim)", 12)} ${day.cheat ? "Quitar día cheat" : "Día cheat"}</button>
          </div>`;
        }

        // Cada comida es la misma tarjeta tocable de Hoy: se abre con sus
        // nutrientes, Editar y Borrar (con confirmación).
        h += `<div class="col gap8">${day.meals.map(comidaCardHTML).join("")}</div>`;

        const nd = nutrientesDeComidas(day.meals);
        h += `<div style="background:var(--bg);border-radius:8px;padding:12px 10px;">
          <div class="small" style="font-weight:700;margin-bottom:10px;">Nutrientes del día</div>
          ${bloqueNutrientes(nd.n, nd.sinDetalle, !!nutrDaysOpen[day.date], `toggleNutrDay('${day.date}')`)}
        </div>`;

        h += `<div class="row gap12" style="margin-top:4px;">`;
        if (day.closed) h += `<button style="color:var(--amber);font-size:11px;" onclick="reopenDay('${day.date}')">Reabrir día</button>`;
        h += `<button style="color:var(--rust);font-size:11px;" onclick="removeDay('${day.date}')">Borrar todo el día</button></div></div>`;
      }
      h += `</div>`;
    });

    return h + `</div>` + pieVersion() + `</div>`;
  }

  // ---------- PANTALLA: PROGRESO ----------
  function screenProgreso(c) {
    const ws = c.wSorted;
    const ultimo = ws.length ? ws[ws.length - 1] : null;
    const primero = ws.length ? ws[0] : null;
    const bajado = primero && ultimo ? primero.weight - ultimo.weight : 0;
    const diasPesaje = primero && ultimo ? Math.max(1, dayDiff(primero.date, ultimo.date)) : 0;
    const ritmoSemanal = diasPesaje > 0 ? (bajado / diasPesaje) * 7 : 0;

    let h = `<div class="screen">
      <div class="topbar">
        <div style="font-size:22px;font-weight:700;">Progreso</div>
        <button class="icon-btn" onclick="setTab('ajustes')" aria-label="Ajustes">${icon("sliders", "var(--textDim)", 22)}</button>
      </div>`;

    h += semanaHTML(c);

    h += `<div class="card">
      <div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:16px;">
        <div class="title">Peso</div>
        <div class="row gap14">
          <span class="xs dim"><span class="dash" style="background:var(--amber);"></span>Real</span>
          <span class="xs dim"><span class="dash" style="background:var(--textDim);"></span>Plan</span>
        </div>
      </div>
      ${weightChartSVG()}`;

    if (ultimo) {
      h += `<div class="row gap24" style="margin-top:14px;flex-wrap:wrap;">
        <div><div class="stat-label">Ahora</div><div style="font-size:20px;font-weight:700;">${ultimo.weight.toFixed(1)} <span class="small dim" style="font-weight:400;">kg</span></div></div>
        <div><div class="stat-label">Bajaste</div><div style="font-size:20px;font-weight:700;color:${bajado >= 0 ? "var(--sage)" : "var(--rust)"};">${bajado >= 0 ? "-" : "+"}${Math.abs(bajado).toFixed(1)} <span class="small dim" style="font-weight:400;">kg</span></div></div>
        <div><div class="stat-label">Ritmo</div><div style="font-size:20px;font-weight:700;">${Math.abs(ritmoSemanal).toFixed(1)} <span class="small dim" style="font-weight:400;">kg/sem</span></div></div>
      </div>`;
    }
    h += `</div>`;

    if (c.calibration) {
      const cal = c.calibration;
      const kgWord = cal.actualKgLost >= 0 ? "bajaste" : "subiste";
      const dirWord = cal.discrepancyPerDay > 0 ? "más alto" : "más bajo";
      const wasCapped = Math.abs(cal.discrepancyPerDay) > Math.abs(cal.cappedAdjustment);
      h += `<div class="card" style="border-color:var(--amber);">
        <div class="row gap8" style="align-items:center;margin-bottom:8px;">${icon("tune", "var(--amber)", 17)}<div class="small" style="font-weight:700;">Ajuste sugerido</div></div>
        <div class="small dim" style="line-height:1.45;margin-bottom:14px;">En ${cal.days} días ${kgWord} ${Math.abs(cal.actualKgLost).toFixed(1)} kg reales, pero lo registrado sugiere otro ritmo. Tu gasto base real parece estar ${dirWord}: cerca de <span style="color:var(--text);font-weight:700;">${cal.suggestedMaintenance} kcal</span>, no ${goal.maintenance}.</div>
        ${Math.abs(cal.discrepancyPerDay) > 800 ? `<div class="xs" style="color:var(--rust);margin-bottom:10px;">Este desajuste es muy grande para ser solo metabolismo — fijate si te faltó cargar alguna comida o algún día entero.</div>` : ""}
        ${wasCapped ? `<div class="xs dim" style="margin-bottom:10px;">Para no sobrecorregir con pocos datos, el ajuste se aplica de a pasos de máximo 400 kcal/día.</div>` : ""}
        <div class="row gap10">
          <button class="btn-primary" style="flex:1;" onclick="applyCalibration(${cal.suggestedMaintenance})">Aplicar</button>
          <button class="btn-secondary" style="flex:1;" onclick="dismissCalibration(${cal.suggestedMaintenance})">Ahora no</button>
        </div>
      </div>`;
    }

    h += `<div class="card" style="margin-bottom:0;">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div class="title">Pesajes</div>
      </div>
      <div class="small dim" style="margin-bottom:12px;">Cargá tu peso real cada semana. Con al menos dos pesajes la app compara tu bajada real contra el déficit calculado.</div>
      <div class="row gap10" style="margin-bottom:14px;">
        <input id="weighin-date" type="date" value="${todayISO()}" style="flex:1;">
        <input id="weighin-weight" type="text" inputmode="decimal" placeholder="Peso (kg)" style="flex:1;">
        <button class="btn-primary" style="flex-shrink:0;" onclick="addWeighIn()">Guardar</button>
      </div>`;

    if (ws.length) {
      h += `<div class="col gap8">`;
      ws.slice().reverse().forEach((w, i, arr) => {
        const anterior = arr[i + 1];
        const delta = anterior ? w.weight - anterior.weight : null;
        if (editingWeighInId === w.id) {
          h += `<div class="row" style="justify-content:space-between;align-items:center;background:var(--surfaceRaised);border-radius:10px;padding:10px 12px;gap:8px;border:1px solid var(--amber);">
            <span class="small">${formatDate(w.date)}</span>
            <input id="edit-weighin-val-${w.id}" type="text" inputmode="decimal" value="${w.weight}" style="width:86px;padding:6px 8px;">
            <button class="btn-ghost" onclick="saveEditWeighIn('${w.id}')" aria-label="Guardar">${icon("check", "var(--sage)", 18)}</button>
            <button class="btn-ghost" onclick="cancelEditWeighIn()" aria-label="Cancelar">${icon("close", "var(--textDim)", 18)}</button>
          </div>`;
        } else {
          h += `<div class="row" style="justify-content:space-between;align-items:center;background:var(--surfaceRaised);border-radius:10px;padding:10px 12px;gap:8px;">
            <span class="small" style="flex:1;min-width:0;">${formatDate(w.date)}</span>
            ${delta != null ? `<span class="xs" style="color:${delta <= 0 ? "var(--sage)" : "var(--rust)"};">${delta <= 0 ? "" : "+"}${delta.toFixed(1)}</span>` : ""}
            <span style="font-weight:700;font-size:15px;">${w.weight.toFixed(1)} kg</span>
            <button class="btn-ghost" onclick="startEditWeighIn('${w.id}')" aria-label="Editar">${icon("pencil", "var(--textDim)", 16)}</button>
            <button class="btn-ghost" onclick="removeWeighIn('${w.id}')" aria-label="Borrar">${icon("trash", "var(--textDim)", 16)}</button>
          </div>`;
        }
      });
      h += `</div>`;
    }

    h += `</div>`;

    // Promedios diarios: dato de contexto, no protagonista.
    h += `<div class="card">
      <div class="title" style="margin-bottom:14px;">Promedio diario</div>
      ${c.daysCount === 0
        ? `<div class="small dim">Todavía no hay días registrados.</div>`
        : `<div class="grid4">${Stat("Consumido", kcal(c.avgConsumed))}${Stat("Proteína", c.avgProtein.toFixed(0) + " g", "var(--protein)")}${Stat("Carbos", c.avgCarbs.toFixed(0) + " g", "var(--carbs)")}${Stat("Grasa", c.avgFat.toFixed(0) + " g", "var(--fat)")}</div>`}
    </div>`;

    // Vitaminas y minerales se leen mejor en promedio: un día solo no dice
    // mucho, una semana sí. Sin hoy, que está a medio cargar.
    const semana = c.dayStats.filter((d) => d.date < c.todayStr && d.date >= addDaysISO(c.todayStr, -7));
    if (semana.length) {
      const nd = nutrientesDeComidas([].concat.apply([], semana.map((d) => d.meals)));
      Object.keys(nd.n).forEach((k) => { nd.n[k] = nd.n[k] / semana.length; });
      h += `<div class="card">
        <div class="title" style="margin-bottom:4px;">Nutrientes · promedio de la semana</div>
        <div class="xs dim" style="margin-bottom:12px;">Por día, sobre ${semana.length} día${semana.length !== 1 ? "s" : ""} cargado${semana.length !== 1 ? "s" : ""} de los últimos 7, sin contar hoy.</div>
        ${bloqueNutrientes(nd.n, nd.sinDetalle, showAvgNutrients, "toggleAvgNutrients()")}
      </div>`;
    }

    return h + pieVersion() + `</div>`;
  }

  // ---------- PANTALLA: AJUSTES ----------
  function screenAjustes(c) {
    let h = `<div class="screen">${topbarVolver("Ajustes", `<button class="btn-secondary" onclick="toggleTheme()">${goal.theme === "light" ? "Oscuro" : "Claro"}</button>`)}`;

    h += nubeHTML();

    h += `<div class="card">
      <div class="title" style="margin-bottom:12px;">Objetivo</div>
      <div class="grid2" style="margin-bottom:12px;">
        <div><label class="label">Peso actual (kg)</label><input type="text" inputmode="decimal" value="${esc(goal.currentWeight)}" onchange="updateGoalField('currentWeight', this.value, true)"></div>
        <div><label class="label">Peso objetivo (kg)</label><input type="text" inputmode="decimal" value="${esc(goal.goalWeight)}" onchange="updateGoalField('goalWeight', this.value, true)"></div>
      </div>
      <div class="grid2">
        <div><label class="label">Fecha objetivo</label><input type="date" value="${esc(goal.goalDate)}" onchange="updateGoalField('goalDate', this.value, false)"></div>
        <div><label class="label">Gasto base diario (kcal)</label><input type="number" value="${esc(goal.maintenance)}" onchange="updateGoalField('maintenance', this.value, true)"></div>
      </div>
      <div class="xs dim" style="margin-top:10px;">El gasto base se usa solo los días en que no dictes un total de gasto de una app (Google Fit, reloj, etc).</div>
    </div>`;

    h += `<div class="card">
      <div class="title" style="margin-bottom:10px;">Umbral de superávit</div>
      <div class="grid2"><div><label class="label">Amarillo → rojo a partir de (kcal)</label><input type="number" step="10" value="${esc(goal.surplusAlertThreshold ?? 300)}" onchange="updateGoalField('surplusAlertThreshold', this.value, true)"></div></div>
      <div class="xs dim" style="margin-top:6px;">Un superávit por debajo de este número se muestra en amarillo; por encima, en rojo.</div>
    </div>`;

    h += `<div class="card">
      <div class="title" style="margin-bottom:10px;">Datos personales</div>
      <div class="grid2" style="margin-bottom:12px;">
        <div><label class="label">Altura (cm)</label><input type="text" inputmode="decimal" placeholder="175" value="${esc(goal.height || "")}" onchange="updateGoalField('height', this.value, true)"></div>
        <div><label class="label">Edad</label><input type="text" inputmode="numeric" placeholder="25" value="${esc(goal.age || "")}" onchange="updateGoalField('age', this.value, true)"></div>
      </div>
      <div style="margin-bottom:12px;"><label class="label">Sexo</label>
        <select onchange="updateGoalField('gender', this.value, false)">
          <option value="male" ${goal.gender === "male" ? "selected" : ""}>Masculino</option>
          <option value="female" ${goal.gender === "female" ? "selected" : ""}>Femenino</option>
        </select>
      </div>
      <div class="xs dim" style="margin-bottom:12px;">Este cálculo es siempre tu base sin ejercicio. El ejercicio se suma aparte, día a día, cuando lo dictás.</div>
      <button class="btn-secondary" onclick="recalcMaintenance()">Recalcular gasto base</button>
      ${ajustesMsg ? `<div class="small" style="margin-top:12px;line-height:1.45;color:${ajustesMsg.tipo === "error" ? "var(--rust)" : "var(--sage)"};">${esc(ajustesMsg.texto)}</div>` : ""}
    </div>`;

    h += `<div class="card">
      <div class="title" style="margin-bottom:10px;">Proteína diaria</div>
      <div class="grid2" style="margin-bottom:10px;"><div><label class="label">Gramos por día</label><input type="number" value="${esc(goal.proteinTarget || calcProteinTarget(goal.currentWeight))}" onchange="updateGoalField('proteinTarget', this.value, true)"></div></div>
      <div class="xs dim" style="margin-bottom:12px;">Por defecto, 1,8 g por kg de tu peso actual. Lo podés pisar con tu propio número.</div>
      <button class="btn-secondary" onclick="recalcProteinTarget()">Recalcular (1,8 g/kg)</button>
    </div>`;

    h += `<div class="card">
      <div class="title" style="margin-bottom:8px;">Copia de seguridad</div>
      <div class="xs dim" style="margin-bottom:12px;">Además de la nube, podés bajarte un archivo con todo y guardarlo donde quieras.</div>
      <div class="row gap10" style="flex-wrap:wrap;">
        <button class="btn-secondary" onclick="exportBackup()">Descargar respaldo</button>
        <button class="btn-secondary" onclick="triggerImport()">Restaurar respaldo</button>
        <input id="backup-file-input" type="file" accept="application/json" style="display:none" onchange="handleImportFile(this)">
      </div>
      ${importMsg ? `<div class="small" style="color:var(--sage);margin-top:10px;">${esc(importMsg)}</div>` : ""}
    </div>`;

    h += `<div class="card">
      <div class="title" style="margin-bottom:8px;color:var(--rust);">Zona de peligro</div>
      <div class="xs dim" style="margin-bottom:12px;">Borra todas tus comidas, pesajes, racha y objetivo, y te lleva de nuevo a la bienvenida. No se puede deshacer.</div>
      ${showResetConfirm
        ? `<div style="background:var(--surfaceRaised);border:1px solid var(--rust);border-radius:10px;padding:14px;">
            <div style="font-weight:700;margin-bottom:6px;">¿Seguro que querés borrar todo?</div>
            ${nube.codigo ? `<div class="xs dim" style="margin-bottom:12px;line-height:1.45;">La copia en la nube no se borra: queda con el código <b style="color:var(--text);">${esc(nube.codigo)}</b>. Si te arrepentís, anotalo y recuperala desde acá.</div>` : ""}
            <div class="row gap10">
              <button class="btn-secondary" style="border-color:var(--rust);color:var(--rust);flex:1;" onclick="confirmResetAllData()">Sí, borrar todo</button>
              <button class="btn-secondary" style="flex:1;" onclick="cancelResetConfirm()">Cancelar</button>
            </div>
          </div>`
        : `<button class="btn-secondary" style="border-color:var(--rust);color:var(--rust);" onclick="openResetConfirm()">Borrar todo y empezar de cero</button>`}
    </div>`;

    // La cadena de versión vive acá, no en la pantalla principal: es una nota
    // de desarrollo, no información para el usuario.
    h += `<div class="xs dim" style="text-align:center;padding:8px 0 4px;">${APP_VERSION}</div>`;

    return h + `</div>`;
  }

  // ---------- HOJA DE CARGA ----------
  function sheetCaptura(c) {
    let h = `<div class="sheet-backdrop" onclick="closeCapture()"></div><div class="sheet">
      <div class="grab"></div>`;

    if (parsed) {
      // Resultado del análisis: primero la frase que entendió el modelo, para
      // que un malentendido se vea antes de mirar ningún número.
      const maxMacro = Math.max(parsed.protein, parsed.carbs, parsed.fat, 1);
      const barra = (label, val, color) => `<div>
        <div class="row" style="justify-content:space-between;font-size:12px;margin-bottom:5px;"><span>${label}</span><span class="dim">${val.toFixed(0)} g</span></div>
        <div class="track" style="height:5px;"><i style="width:${((val / maxMacro) * 100).toFixed(0)}%;background:${color};"></i></div>
      </div>`;

      h += `<div class="stat-label" style="margin-bottom:6px;">Esto entendí</div>
      <div style="font-size:16px;line-height:1.35;margin-bottom:18px;">${esc(parsed.note)}</div>

      <div class="row" style="align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:12px;">
        <div class="row" style="align-items:baseline;gap:6px;">
          <div style="font-size:42px;font-weight:700;line-height:1;letter-spacing:-1px;">${parsed.consumed.toFixed(0)}</div>
          <div class="small dim">kcal</div>
        </div>
        ${parsed.nutritionScore != null ? `<div class="row gap8" style="align-items:center;">
          <span style="background:${nutritionColor(parsed.nutritionScore)};color:#fff;border-radius:999px;padding:4px 11px;font-size:14px;font-weight:700;">${parsed.nutritionScore}/10</span>
          <span class="small dim" style="max-width:120px;">${esc(parsed.nutritionComment || "")}</span>
        </div>` : ""}
      </div>

      <div class="col gap12" style="margin-bottom:18px;">
        ${barra("Proteína", parsed.protein, "var(--protein)")}
        ${barra("Carbohidratos", parsed.carbs, "var(--carbs)")}
        ${barra("Grasas", parsed.fat, "var(--fat)")}
      </div>`;

      if (parsed.totalExpenditure != null || parsed.exercise != null) {
        h += `<div class="grid2" style="margin-bottom:18px;">
          ${parsed.totalExpenditure != null ? Stat("Gasto del día (app)", parsed.totalExpenditure.toFixed(0) + " kcal", "var(--amber)") : ""}
          ${parsed.exercise != null ? Stat("Ejercicio", parsed.exercise.toFixed(0) + " kcal", "var(--amber)") : ""}
        </div>`;
      }

      // Vitaminas y minerales: plegados, para que el número principal siga
      // siendo las kcal. Si la función todavía no se redesplegó, no vienen.
      if (parsed.detalle) {
        const n = { ...parsed.detalle, kcal: parsed.consumed, proteinas_g: parsed.protein, carbohidratos_g: parsed.carbs, grasas_g: parsed.fat };
        h += `<div style="margin-bottom:18px;">${bloqueNutrientes(n, 0, showParsedDetail, "toggleParsedDetail()")}</div>`;
      }

      const fechaCaptura = captureDate || todayISO();
      h += `<div style="margin-bottom:14px;">
        <label class="label" for="capture-date">Fecha</label>
        <input id="capture-date" type="date" max="${todayISO()}" value="${fechaCaptura}" onchange="setCaptureDate(this.value)">
      </div>
      ${errorMsg ? `<div class="small" style="color:var(--rust);margin-bottom:12px;">${esc(errorMsg)}</div>` : ""}
      <div class="xs dim" style="margin-bottom:16px;">Se suma como una comida más de ese día. Si algún número está mal, guardalo igual y corregilo después desde Historial.</div>
      <div class="row gap10">
        <button class="btn-secondary" style="width:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;" onclick="discardParsed()" aria-label="Descartar">${icon("close", "var(--textDim)", 19)}</button>
        <button class="btn-sage big-btn" style="flex:1;" onclick="confirmSave()">Guardar comida</button>
      </div>`;

      return h + `</div>`;
    }

    h += `<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div>
        <div style="font-size:18px;font-weight:700;">¿Qué comiste?</div>
        ${captureDate && captureDate !== todayISO() ? `<div class="small" style="color:var(--amber);margin-top:2px;">Para el ${esc(formatDate(captureDate))}</div>` : ""}
      </div>
      <button class="icon-btn" onclick="closeCapture()" aria-label="Cerrar">${icon("close", "var(--textDim)", 20)}</button>
    </div>

    ${frecuentesHTML()}

    <textarea id="dictation-textarea" rows="4" placeholder="Ej: para el almuerzo comí una milanesa con puré y una manzana de postre… (y si tenés: hoy Google Fit me dijo que gasté 2400 calorías)" style="resize:vertical;margin-bottom:12px;">${esc(dictationDraft)}</textarea>
    <input id="photo-file-input" type="file" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoFile(this)">`;

    if (photo) {
      const kb = Math.round((photo.dataUrl.length * 0.75) / 1024);
      h += `<div class="row gap12" style="align-items:center;background:var(--surfaceRaised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;">
        <img src="${photo.dataUrl}" alt="Foto de la comida" style="width:46px;height:46px;border-radius:8px;object-fit:cover;flex-shrink:0;">
        <div style="flex:1;min-width:0;">
          <div class="small">Foto adjunta</div>
          <div class="xs dim">Redimensionada a 1024 px · ${kb} KB</div>
        </div>
        <button class="btn-ghost" onclick="removePhoto()" aria-label="Quitar foto">${icon("close", "var(--textDim)", 18)}</button>
      </div>`;
    }

    if (errorMsg) h += `<div class="small" style="color:var(--rust);margin-bottom:12px;">${esc(errorMsg)}</div>`;

    h += `<div class="row gap10" style="margin-bottom:10px;">
      <button class="btn-secondary big-btn" style="flex:1;" onclick="focusDictation()">${icon("mic", "var(--text)", 19)} Dictar</button>
      <button class="btn-secondary big-btn" style="flex:1;" onclick="triggerPhoto()">${icon("camera", "var(--text)", 19)} ${photo ? "Otra foto" : "Foto"}</button>
    </div>
    <button class="btn-primary big-btn" style="width:100%;" onclick="analyze()" ${analyzing ? "disabled" : ""}>${analyzing ? '<span class="spin">↻</span> Analizando…' : "Analizar"}</button>`;

    return h + `</div>`;
  }

  function renderApp() {
    const c = computeCtx();
    let html = "";
    if (activeTab === "dieta") html += screenDieta(c);
    else if (activeTab === "historial") html += screenHistorial(c);
    else if (activeTab === "progreso") html += screenProgreso(c);
    else if (activeTab === "ajustes") html += screenAjustes(c);
    else html += screenHoy(c);

    html += navMarkup();
    if (showCapture) html += sheetCaptura(c);

    document.getElementById("root").innerHTML = html;
  }

  function saveDictationDraft() {
    const t = document.getElementById("dictation-textarea");
    if (t) dictationDraft = t.value;
  }

  function render() {
    // Antes de reemplazar el DOM, rescatamos lo tipeado: de lo contrario
    // cualquier acción que redibuje (adjuntar foto, un error) lo borraba.
    saveDictationDraft();
    if (loading) { renderLoading(); return; }
    if (!goal.onboarded) { renderOnboarding(); return; }
    renderApp();
  }

  loadAll();
})();
</script>
</body>
</html>
