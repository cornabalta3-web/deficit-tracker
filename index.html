<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Déficit">
<meta name="theme-color" content="#14181C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Déficit Tracker</title>
<style>
  :root {
    --bg: #14181C; --surface: #1C2227; --surfaceRaised: #242B31; --line: #333B42;
    --text: #F2EFE9; --textDim: #9AA3AA; --amber: #E8A33D; --sage: #6FA98A; --rust: #C1584B;
    --protein: #6C93E8; --carbs: #D9823D; --fat: #B589E0;
    --meta: #5E9FC4; --cheat: #D97BA6;
    --amberSoft: #2A2418; --sageSoft: #1D2E25; --semAmbar: #E8A33D;
  }
  [data-theme="light"] {
    --bg: #F7F5F0; --surface: #FFFFFF; --surfaceRaised: #EFEBE2; --line: #DDD6C8;
    --text: #23262B; --textDim: #6D7278; --amber: #B4791E; --sage: #3D8563; --rust: #B0402F;
    --protein: #3A5FC4; --carbs: #B5631F; --fat: #8354B8;
    --meta: #2F7398; --cheat: #B2457A;
    --amberSoft: #F6EBD6; --sageSoft: #E1EFE7; --semAmbar: #C28A1C;
  }
  * { box-sizing: border-box; }
  body, #root { background: var(--bg); color: var(--text); font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; }
  body { transition: background-color .25s ease, color .25s ease; }
  .card, input, textarea, select, button { transition: background-color .25s ease, border-color .25s ease, color .25s ease; }
  #root { padding: calc(28px + env(safe-area-inset-top, 0px)) 20px calc(130px + env(safe-area-inset-bottom, 0px)); min-height: 100vh; }
  @keyframes popIn { 0% { transform: scale(.92); opacity: 0; } 60% { transform: scale(1.02); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-70px) scale(1.35); opacity: 0; } }
  .celebrate { animation: popIn .45s ease-out; }
  .confetti-piece { position: absolute; font-size: 20px; animation: floatUp 1.1s ease-out forwards; pointer-events: none; }
  .fab-stack { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; z-index: 50; }
  .fab-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--surfaceRaised); border: 1px solid var(--line); color: var(--text); font-size: 19px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
  .badge-pill { background: var(--surfaceRaised); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  input, textarea, select {
    font-family: inherit; background: var(--surfaceRaised); border: 1px solid var(--line);
    color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 14px; width: 100%; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--amber); }
  input::placeholder, textarea::placeholder { color: #5C666D; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  .row { display: flex; }
  .col { display: flex; flex-direction: column; }
  .gap6 { gap: 6px; } .gap8 { gap: 8px; } .gap10 { gap: 10px; } .gap12 { gap: 12px; } .gap14 { gap: 14px; } .gap20 { gap: 20px; } .gap24 { gap: 24px; }
  .dim { color: var(--textDim); }
  .small { font-size: 12px; }
  .xs { font-size: 11px; }
  .title { font-size: 16px; font-weight: 700; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .label { font-size: 11px; color: var(--textDim); display: block; margin-bottom: 4px; }
  .btn-primary { background: var(--amber); color: #1A1300; border-radius: 8px; padding: 10px 18px; font-weight: 700; font-size: 14px; }
  .btn-primary:disabled { background: var(--line); color: var(--textDim); }
  .btn-secondary { background: transparent; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 9px 16px; font-size: 13px; }
  .btn-sage { background: var(--sage); color: #0E1A14; border-radius: 8px; padding: 9px 16px; font-weight: 700; font-size: 13px; }
  .btn-ghost { background: transparent; color: var(--textDim); padding: 4px; }
  .stat-label { font-size: 10px; color: var(--textDim); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 16px; font-weight: 700; }
  .spin { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  /* ---------- navegación inferior y hoja de carga (v13) ---------- */
  .screen { max-width: 720px; margin: 0 auto; }
  .topbar { display: flex; justify-content: space-between; align-items: center; min-height: 44px; margin-bottom: 10px; }
  .icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: -10px; }
  .hero-num { font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -1px; }
  .track { height: 6px; background: var(--surfaceRaised); border-radius: 999px; overflow: hidden; }
  .track > i { display: block; height: 100%; border-radius: 999px; transition: width .35s ease; }
  .chip { background: var(--surfaceRaised); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
  .chip.dim { color: var(--textDim); }
  .sq { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: 0px; }
  .dash { width: 14px; height: 2px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: 3px; }
  .big-btn { height: 52px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }

  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    height: calc(84px + env(safe-area-inset-bottom, 0px));
    background: var(--surface); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; padding-top: 10px;
  }
  .nav > button { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 50px; justify-content: center; font-size: 11px; color: var(--textDim); }
  .nav > button.on { color: var(--amber); }
  .nav .cap { width: 60px; height: 60px; border-radius: 50%; background: var(--amber); display: flex; align-items: center; justify-content: center; margin-top: -20px; box-shadow: 0 4px 14px rgba(0,0,0,.45); }

  .sheet-backdrop { position: fixed; inset: 0; background: rgba(10,13,16,.62); z-index: 70; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 71;
    background: var(--surface); border-top: 1px solid var(--line);
    border-radius: 20px 20px 0 0;
    padding: 12px 20px calc(28px + env(safe-area-inset-bottom, 0px));
    max-height: 88vh; overflow-y: auto;
  }
  .grab { width: 38px; height: 4px; border-radius: 999px; background: var(--line); margin: 0 auto 18px; }

  /* ---------- v15: día primero, nutrientes, días pasados y día cheat ---------- */
  .section-title { font-size: 13px; font-weight: 700; color: var(--textDim); text-transform: uppercase; letter-spacing: .6px; margin: 26px 0 10px; }
  .divider { height: 1px; background: var(--line); margin: 16px 0; }
  .chip-btn { cursor: pointer; }
  .chip.cheat-on { border-color: var(--cheat); color: var(--cheat); }
  .pill-cheat { color: var(--cheat); border: 1px solid var(--cheat); border-radius: 999px; padding: 0 7px; font-size: 10px; font-weight: 700; margin-left: 4px; vertical-align: 1px; }
  .mini-btn { border: 1px dashed var(--line); color: var(--textDim); border-radius: 8px; padding: 7px 10px; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; }
  .link-btn { font-size: 12px; color: var(--amber); }

  /* ---------- v16: "te quedan", comidas tocables, barra de 3 ---------- */
  .hero-label { font-size: 11px; color: var(--textDim); text-transform: uppercase; letter-spacing: .6px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .hero-big { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -1.5px; }
  .stat-mini { font-size: 11px; color: var(--textDim); }
  .stat-mini + div { font-size: 17px; font-weight: 700; margin-top: 2px; }
  .meal-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .meal-btn { width: 100%; text-align: left; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
  .meal-note { font-size: 14px; line-height: 1.3; }
  .meal-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
  .tile { background: var(--surfaceRaised); border-radius: 10px; padding: 8px 10px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; }
  .goal-btn { width: 100%; text-align: left; display: block; color: var(--text); }
  .back-btn { display: flex; align-items: center; gap: 4px; margin-left: -8px; min-height: 44px; }
  .dia-abierto .meal-card { background: var(--bg); }
  .pie { text-align: center; font-size: 11px; color: var(--textDim); padding: 18px 0 4px; }
  .btn-danger { background: transparent; border: 1px solid var(--rust); color: var(--rust); border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 700; }

  /* ---------- v17: Dieta, Lo de siempre, porciones, semana y nube ---------- */
  .btn-sage:disabled, .btn-secondary:disabled { opacity: .5; }
  .dieta-op { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-height: 52px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); }
  .dieta-op.on { border-color: var(--amber); background: var(--amberSoft); }
  .dieta-radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; }
  .dieta-op.on .dieta-radio { border: 5px solid var(--amber); }
  .veredicto { margin-top: 16px; background: var(--surfaceRaised); border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.45; }
  .sugerencia { margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--bg); }
  .sug-momento { font-size: 10px; color: var(--amber); text-transform: uppercase; letter-spacing: .6px; font-weight: 700; }
  .frec { display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .frec-sumar { min-height: 40px; padding: 0 14px; border: 1px solid var(--sage); color: var(--sage); border-radius: 10px; font-size: 13px; font-weight: 700; flex-shrink: 0; white-space: nowrap; }
  .separador { display: flex; align-items: center; gap: 10px; margin: 14px 0; font-size: 11px; color: var(--textDim); }
  .separador::before, .separador::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .porciones { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .porciones > button { min-height: 44px; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 10px; font-size: 15px; }
  .porciones > button.on { border: 2px solid var(--amber); background: var(--amberSoft); color: var(--amber); font-weight: 700; }
  .dia-abierto .porciones > button { background: var(--surface); }
  .dia-abierto .porciones > button.on { background: var(--amberSoft); }
  .btn-fijo { width: 100%; min-height: 44px; border: 1px solid var(--amber); color: var(--amber); border-radius: 10px; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-fijo.on { background: var(--amberSoft); }
  .nube-icono { width: 36px; height: 36px; border-radius: 50%; background: var(--sageSoft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .opcion-chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surfaceRaised); color: var(--textDim); font-size: 13px; }
  .opcion-chip.on { border-color: var(--amber); background: var(--amberSoft); color: var(--amber); font-weight: 700; }
  .codigo { flex: 1; min-width: 0; background: var(--surfaceRaised); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 18px; font-weight: 700; letter-spacing: 1px; text-align: center; }
</style>

<body>
<div id="root"></div>
<script>
(function () {
  "use strict";
  // Polyfill de almacenamiento: misma interfaz que window.storage de Claude.ai,
  // pero usando localStorage del navegador (persiste en este dispositivo/navegador).
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem("deficit_" + key);
      if (raw === null) return null;
      return { key, value: raw };
    },
    async set(key, value) {
      localStorage.setItem("deficit_" + key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem("deficit_" + key);
      return { key, deleted: true };
    },
  };

  const N = window.Nutrientes;
  const KCAL_PER_KG = 7700;
  const APP_VERSION = "v18-html · semana en tres estados y tus comidas (ayuno)";
  const DEFAULT_GOAL = { currentWeight: null, goalWeight: null, goalDate: "", maintenance: 2200, height: null, age: null, gender: "male", onboarded: false, surplusAlertThreshold: 300, theme: "dark", proteinTarget: null, dieta: "equilibrada", comidas: ["Desayuno", "Almuerzo", "Merienda", "Cena"] };

  let meals = [];
  let dayMeta = {};
  let goal = { ...DEFAULT_GOAL };
  let weighIns = [];
  let loading = true;

  // UI-only state
  let activeTab = "hoy";          // hoy | dieta | historial | progreso | ajustes
  let showCapture = false;        // hoja inferior para cargar una comida
  // El textarea se destruye en cada render (reconstruimos innerHTML entero), así
  // que guardamos lo tipeado acá antes de redibujar. Sin esto, adjuntar una foto
  // borraba el dictado a medio escribir.
  let dictationDraft = "";
  let calibrationDismissed = null; // gasto base sugerido que ya postergaste
  let onboardError = "";           // errores de validación en la bienvenida
  let ajustesMsg = null;           // {tipo: "error"|"ok", texto} al recalcular
  let expanded = true;
  let expandedDays = {};
  let showSettings = false;
  let analyzing = false;
  let parsed = null;
  let errorMsg = "";
  let photo = null; // {dataUrl, mediaType}
  let importMsg = "";
  let onboardForm = null;
  let gapChoiceMade = false;
  let editingMealId = null;
  let editingDayMeta = null;
  let editingWeighInId = null;
  let showCloseDayConfirm = false;
  let justClosedCelebration = false;
  let showResetConfirm = false;
  let captureDate = null;          // día al que va la comida que se está cargando (null = hoy)
  let showParsedDetail = false;    // vitaminas y minerales en el resultado del análisis
  let showDayNutrients = false;    // ídem en la tarjeta de hoy
  let showAvgNutrients = false;    // ídem en el promedio de Progreso
  let nutrDaysOpen = {};           // ídem por día en Historial
  let openMealDetail = null;       // comida (de Hoy o del Historial) con su detalle a la vista
  let mealNutrOpen = false;        // vitaminas y minerales de esa comida, en Hoy
  let confirmDeleteMealId = null;  // comida con el "¿Borrar?" a la vista

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
  function addDaysISO(iso, n) { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
  function daysBetween(a, b) { return Math.max(1, Math.round((new Date(b) - new Date(a)) / 86400000)); }
  function formatDate(iso) {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" });
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function calcMaintenance({ weight, height, age, gender }) {
    const bmr = gender === "female" ? 10 * weight + 6.25 * height - 5 * age - 161 : 10 * weight + 6.25 * height - 5 * age + 5;
    return Math.round(bmr * 1.2);
  }

  // ---------- validación de los datos personales ----------
  //
  // La fórmula de arriba es lineal y no tiene forma de saber si le están dando
  // basura: se traga cualquier número y devuelve algo. Sin estas guardas, tres
  // errores de carga muy comunes producían datos inservibles sin un solo aviso:
  //
  //   1. Altura en metros (1,75) en vez de centímetros (175). El término
  //      6,25 × altura aporta 11 kcal en lugar de 1.094, y el gasto base queda
  //      en ~830 kcal/día. Le pasó a un usuario real.
  //   2. Año de nacimiento (1998) en el campo de edad: el gasto base da
  //      NEGATIVO (-9.709 kcal/día) y todos los balances quedan invertidos.
  //   3. Coma decimal en un input type="number": el navegador devuelve string
  //      vacío, toNumber lo convierte en 0, y ese 0 se guardaba en silencio.
  //
  // El piso y el techo del gasto base son la última red: applyCalibration ya
  // tenía Math.max(1200, ...), pero el camino de la fórmula no tenía nada.
  const LIMITES = {
    peso: { min: 30, max: 300, texto: "El peso tiene que estar entre 30 y 300 kg." },
    altura: { min: 120, max: 230, texto: "La altura tiene que estar entre 120 y 230 cm." },
    edad: { min: 14, max: 100, texto: "La edad tiene que estar entre 14 y 100 años." },
  };
  const GASTO_MIN = 1000;
  const GASTO_MAX = 4500;

  // Nadie mide 1,75 cm. Si el número es menor a 3, vino en metros: lo pasamos a
  // centímetros en vez de rechazarlo, que es lo que la persona quiso decir.
  function alturaACm(v) {
    const n = toNumber(v);
    return n > 0 && n < 3 ? Math.round(n * 100) : n;
  }

  function validarPersonales({ peso, altura, edad }) {
    const errores = [];
    if (!(peso >= LIMITES.peso.min && peso <= LIMITES.peso.max)) errores.push(LIMITES.peso.texto);
    if (!(altura >= LIMITES.altura.min && altura <= LIMITES.altura.max)) errores.push(LIMITES.altura.texto);
    if (!(edad >= LIMITES.edad.min && edad <= LIMITES.edad.max)) errores.push(LIMITES.edad.texto);
    return errores;
  }

  function gastoPlausible(v) {
    return typeof v === "number" && isFinite(v) && v >= GASTO_MIN && v <= GASTO_MAX;
  }

  // 1.8 g de proteína por kg de peso actual: rango razonable para preservar músculo en déficit.
  function calcProteinTarget(weight) { return Math.round((weight || 0) * 1.8); }
  function macroInline(p, c, f) {
    return `<span style="color:var(--protein)">P${p.toFixed(0)}</span>/<span style="color:var(--carbs)">C${c.toFixed(0)}</span>/<span style="color:var(--fat)">G${f.toFixed(0)}</span>`;
  }
  // ---------- valoración nutricional de la comida (1-10 + comentario, generada por la IA) ----------
  function nutritionColor(score) {
    const pct = Math.max(0, Math.min(100, ((score - 1) / 9) * 100));
    return getProgressColor(pct);
  }
  function nutritionBadge(score, comment) {
    if (score == null) return "";
    return `<div class="small row gap8" style="align-items:center;margin-top:10px;">
      <span style="background:${nutritionColor(score)};color:#fff;border-radius:999px;padding:2px 10px;font-weight:700;font-size:12px;flex-shrink:0;">${score}/10</span>
      <span class="dim">${esc(comment || "")}</span>
    </div>`;
  }

  // ---------- números con coma o punto (formato AR) ----------
  function toNumber(v) {
    if (v == null) return 0;
    const n = parseFloat(String(v).trim().replace(",", "."));
    return isNaN(n) ? 0 : n;
  }

  // ---------- tema claro/oscuro ----------
  function applyTheme() {
    document.documentElement.setAttribute("data-theme", goal.theme === "light" ? "light" : "dark");
  }
  window.toggleTheme = function () {
    goal = { ...goal, theme: goal.theme === "light" ? "dark" : "light" };
    persistGoal();
    applyTheme();
    render();
  };

  // ---------- color según cercanía al objetivo (rojo -> amarillo -> verde) ----------
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function hexToRgb(hex) {
    const h = hex.replace("#", "");
    return [parseInt(h.substring(0, 2), 16), parseInt(h.substring(2, 4), 16), parseInt(h.substring(4, 6), 16)];
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function lerpColor(c1, c2, t) { return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)]; }
  function getProgressColor(pct) {
    const rust = hexToRgb(cssVar("--rust")), amber = hexToRgb(cssVar("--amber")), sage = hexToRgb(cssVar("--sage"));
    const c = pct <= 50 ? lerpColor(rust, amber, Math.max(0, pct) / 50) : lerpColor(amber, sage, Math.min(100, pct - 50) / 50);
    return `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  }

  // ---------- balance del día: verde y signo menos = déficit, amarillo/rojo y signo más = superávit ----------
  function formatBalance(net) {
    const threshold = goal.surplusAlertThreshold || 300;
    if (net >= 0) return { text: "-" + Math.round(net).toLocaleString("es-AR") + " kcal", color: "var(--sage)" };
    const surplus = Math.abs(net);
    return { text: "+" + Math.round(surplus).toLocaleString("es-AR") + " kcal", color: surplus <= threshold ? "var(--amber)" : "var(--rust)" };
  }
  // Un día cheat es un permiso que te diste, no un error: el número es el
  // mismo, pero va con su color en vez del rojo de alarma.
  function balanceDe(net, cheat) {
    const b = formatBalance(net);
    return cheat ? { text: b.text, color: "var(--cheat)" } : b;
  }
  function dayCloseMessage(day) {
    const net = day.net;
    if (day.cheat) {
      return `Día cheat cerrado: ${net >= 0 ? "-" : "+"}${Math.round(Math.abs(net)).toLocaleString("es-AR")} kcal. No corta tu racha, y las calorías igual cuentan para el total. Mañana seguimos.`;
    }
    if (net >= 0) {
      const kg = net / KCAL_PER_KG;
      return `&#127881; ¡Felicitaciones, seguís así! Hoy restaste ${Math.round(net).toLocaleString("es-AR")} kcal (&asymp; ${kg.toFixed(2)} kg) de tu objetivo.`;
    }
    const surplus = Math.abs(net);
    const threshold = goal.surplusAlertThreshold || 300;
    if (surplus <= threshold) return `Hoy hubo un pequeño superávit de ${Math.round(surplus).toLocaleString("es-AR")} kcal. No pasa nada, mañana seguimos sumando déficit.`;
    return `Hoy el balance dio +${Math.round(surplus).toLocaleString("es-AR")} kcal de superávit. Es solo un día — lo que importa es la tendencia general. Mañana retomamos.`;
  }
  function confettiMarkup() {
    const emojis = ["&#127881;", "&#10024;", "&#128293;", "&#128170;", "&#11088;"];
    let out = "";
    for (let i = 0; i < 10; i++) {
      const left = 5 + ((i * 9) % 90);
      const delay = (i % 5) * 0.08;
      out += `<span class="confetti-piece" style="left:${left}%;bottom:10px;animation-delay:${delay}s;">${emojis[i % emojis.length]}</span>`;
    }
    return out;
  }

  // ---------- racha de déficit e insignias ----------
  // Un día cheat ni suma ni corta: la racha lo saltea, siempre que los días
  // sigan siendo consecutivos. Las calorías de ese día sí cuentan en el total
  // de déficit, porque al cuerpo no le importa cómo lo llamaste.
  function computeDeficitStreak(settledDescending) {
    let streak = 0, prevDate = null;
    for (const d of settledDescending) {
      if (prevDate !== null && addDaysISO(prevDate, -1) !== d.date) break;
      prevDate = d.date;
      if (d.cheat) continue;
      if (d.net < 0) break;
      streak++;
    }
    return streak;
  }
  function computeBadges({ streak, kgLost, pct }) {
    const badges = [];
    const streakTiers = [[30, "&#127942;", "Racha de 30 días"], [14, "&#128293;&#128293;&#128293;", "Racha de 14 días"], [7, "&#128293;&#128293;", "Racha de 7 días"], [3, "&#128293;", "Racha de 3 días"]];
    for (const [n, icon, label] of streakTiers) { if (streak >= n) { badges.push({ icon, label }); break; } }
    const kgTiers = [[10, "&#128142;", "-10 kg quemados"], [5, "&#11088;", "-5 kg quemados"], [2, "&#10024;", "-2 kg quemados"]];
    for (const [n, icon, label] of kgTiers) { if (kgLost >= n) { badges.push({ icon, label }); break; } }
    if (pct >= 100) badges.push({ icon: "&#127919;", label: "¡Objetivo cumplido!" });
    return badges;
  }

  function computeDayStats() {
    const byDate = {};
    meals.forEach((m) => {
      if (!byDate[m.date]) byDate[m.date] = { date: m.date, consumed: 0, protein: 0, carbs: 0, fat: 0, meals: [] };
      byDate[m.date].consumed += m.consumed;
      byDate[m.date].protein += m.protein;
      byDate[m.date].carbs += m.carbs;
      byDate[m.date].fat += m.fat;
      byDate[m.date].meals.push(m);
    });
    return Object.values(byDate)
      .map((day) => {
        const meta = dayMeta[day.date] || {};
        const baseMaintenance = meta.maintenanceSnapshot != null ? meta.maintenanceSnapshot : goal.maintenance;
        const gasto = meta.totalExpenditure != null ? meta.totalExpenditure : baseMaintenance + (meta.exerciseKcal || 0);
        return {
          ...day,
          gasto,
          usedAppTotal: meta.totalExpenditure != null,
          exercise: meta.exerciseKcal || 0,
          net: gasto - day.consumed,
          closed: !!meta.closed,
          cheat: !!meta.cheat,
          meals: day.meals.slice().sort((a, b) => a.createdAt - b.createdAt),
        };
      })
      .sort((a, b) => (a.date < b.date ? 1 : -1));
  }

  // ---------- micro y macronutrientes (v15) ----------
  //
  // Cada comida nueva trae `nutrientes`: el detalle (azúcares, fibra, tipos de
  // grasa, vitaminas, minerales). Las kcal y los tres macros de siempre siguen
  // en consumed/protein/carbs/fat, que es lo que editás desde Historial, así
  // que el objeto completo se arma al vuelo y nunca queda desfasado.
  function refsNutrientes() {
    const r = N.referencias(goal.age, goal.gender === "female" ? "femenino" : "masculino");
    // La proteína de esta app es tu meta para cuidar músculo en déficit
    // (Ajustes), no el mínimo general de 46/56 g.
    r.proteinas_g = goal.proteinTarget || calcProteinTarget(goal.currentWeight);
    return r;
  }
  // Las comidas cargadas antes de v15 (y los días completados solos) no tienen
  // detalle: sus vitaminas cuentan como 0, y se avisa cuántas son.
  function nutrientesDeComidas(lista) {
    const conDetalle = lista.filter((m) => m.nutrientes);
    const n = N.sumar(conDetalle.map((m) => m.nutrientes));
    n.kcal = lista.reduce((s, m) => s + m.consumed, 0);
    n.proteinas_g = lista.reduce((s, m) => s + m.protein, 0);
    n.carbohidratos_g = lista.reduce((s, m) => s + m.carbs, 0);
    n.grasas_g = lista.reduce((s, m) => s + m.fat, 0);
    return { n, sinDetalle: lista.length - conDetalle.length };
  }
  function nutrientesDeComida(m) {
    return { ...N.limpiar(m.nutrientes), kcal: m.consumed, proteinas_g: m.protein, carbohidratos_g: m.carbs, grasas_g: m.fat };
  }

  // Bloque de nutrientes plegable: cerrado muestra los cuatro que más importan
  // en un déficit (fibra que llena, azúcares, sodio que retiene líquido y
  // grasas saturadas); abierto, la tabla completa contra lo recomendado.
  function bloqueNutrientes(n, sinDetalle, abierto, accion) {
    const refs = refsNutrientes();
    const chip = (k, nombre) => {
      const d = N.NUTRIENTES.find((x) => x.k === k);
      return `<span class="chip dim">${nombre} <span style="color:var(--text);font-weight:700;">${N.fmt(n[k])} ${N.unidad(d.u)}</span></span>`;
    };
    let h = `<div class="row gap8" style="flex-wrap:wrap;">
      ${chip("fibra_g", "Fibra")}${chip("azucares_g", "Azúcares")}${chip("sodio_mg", "Sodio")}${chip("grasas_saturadas_g", "Saturadas")}
    </div>`;
    if (sinDetalle > 0) {
      h += `<div class="xs dim" style="margin-top:10px;">${sinDetalle} comida${sinDetalle !== 1 ? "s" : ""} sin detalle (cargada${sinDetalle !== 1 ? "s" : ""} antes de esta versión o completada${sinDetalle !== 1 ? "s" : ""} sola${sinDetalle !== 1 ? "s" : ""}): las vitaminas y minerales pueden dar de menos.</div>`;
    }
    h += `<button class="btn-secondary" style="width:100%;margin-top:12px;" onclick="${accion}">${abierto ? "Ocultar" : "Ver"} macro y micronutrientes</button>`;
    if (abierto) {
      h += N.seccionesPlanas(n, refs);
      h += `<div class="xs dim" style="margin-top:12px;line-height:1.45;">${esc(N.notaReferencias(goal.age, goal.gender === "female" ? "femenino" : "masculino"))} La proteína se compara con tu meta de Ajustes.</div>`;
    }
    return h;
  }

  // ---------- photo ----------
  // Una foto de iPhone sin tocar son ~2.450 tokens de entrada; redimensionada a
  // 1024px son ~1.050. Para estimar un plato no se pierde nada útil, y es el
  // ahorro más grande del costo por análisis. Además, al re-codificar en canvas
  // la salida siempre queda en JPEG: eso normaliza de paso los HEIC del iPhone,
  // que la API no acepta.
  const PHOTO_MAX_SIDE = 1024;
  const PHOTO_JPEG_QUALITY = 0.85;

  function redimensionarFoto(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("No se pudo leer el archivo"));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("No se pudo abrir la imagen"));
        img.onload = () => {
          const escala = Math.min(1, PHOTO_MAX_SIDE / Math.max(img.width, img.height));
          const w = Math.round(img.width * escala);
          const h = Math.round(img.height * escala);
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          // Fondo blanco: si el original tiene transparencia, el JPEG la
          // rellenaría de negro y confundiría la estimación.
          ctx.fillStyle = "#FFFFFF";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve({ dataUrl: canvas.toDataURL("image/jpeg", PHOTO_JPEG_QUALITY), mediaType: "image/jpeg" });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      // La función devuelve el análisis ya parseado y garantizado contra un
      // esquema (structured outputs), así que desapareció el viejo baile de
      // sacarle los backticks de markdown al texto y rezar que JSON.parse ande.
      const obj = await response.json();
      if (!response.ok) {
        const err = new Error(obj.error || "Error desconocido");
        err.codigo = obj.code;
        throw err;
      }
      parsed = {
        consumed: Number(obj.consumed_kcal) || 0,
        protein: Number(obj.protein_g) || 0,
        carbs: Number(obj.carbs_g) || 0,
        fat: Number(obj.fat_g) || 0,
        totalExpenditure: obj.total_expenditure_kcal != null ? Number(obj.total_expenditure_kcal) : null,
        exercise: obj.exercise_kcal != null ? Number(obj.exercise_kcal) : null,
        note: obj.summary || dictation.trim().slice(0, 120) || "Comida analizada por foto",
        nutritionScore: obj.nutrition_score != null ? Math.max(1, Math.min(10, Math.round(Number(obj.nutrition_score)))) : null,
        nutritionComment: obj.nutrition_comment || "",
        // Si la función todavía es la vieja (sin redeploy), no viene: la
        // comida se guarda igual, sin detalle.
        detalle: obj.detalle ? N.limpiar(obj.detalle, N.CLAVES_DETALLE) : null,
      };
      showParsedDetail = false;
    } catch (e) {
      console.error(e);
      // Antes todos los fallos mostraban el mismo mensaje, así que un problema
      // de red, una clave vencida y una foto ilegible eran indistinguibles y no
      // había forma de saber si reintentar servía de algo.
      errorMsg = mensajeDeError(e);
    } finally {
      analyzing = false;
      render();
    }
  };

  function mensajeDeError(e) {
    const porCodigo = {
      sin_clave: "La app no tiene configurada la clave de API. Revisá las variables de entorno en Netlify.",
      clave_rechazada: "La clave de API fue rechazada. Puede haber vencido o haber sido revocada.",
      sin_credito: "La cuenta de Anthropic se quedó sin crédito. Cargá saldo y volvé a intentar.",
      limite_alcanzado: "Demasiados análisis seguidos. Esperá un minuto y probá de nuevo.",
      formato_no_soportado: "Ese formato de imagen no se puede analizar. Sacá la foto de nuevo.",
      foto_muy_grande: "La foto es demasiado pesada. Probá con una más chica.",
      dictado_muy_largo: "El dictado es muy largo. Contá solo esta comida.",
      sin_contenido: "Escribí qué comiste o adjuntá una foto.",
      rechazado: "No pude analizar esa descripción. Probá contarlo con otras palabras.",
      respuesta_cortada: "El análisis quedó a medias. Probá de nuevo.",
      sin_conexion: "No hay conexión con el servidor. Revisá tu internet y reintentá.",
      // Dos causas distintas: antes compartían mensaje y no se podía saber cuál era.
      token_invalido: "Falta el token de la app. Si activaste APP_SHARED_TOKEN en Netlify, borrá esa variable: el frontend todavía no lo manda.",
      origen_no_permitido: "El servidor rechazó la dirección desde la que abriste la app. Fijate desde qué URL estás entrando.",
      pedido_incompleto: "Faltan datos para armar las sugerencias. Probá de nuevo.",
    };
    if (e && e.codigo && porCodigo[e.codigo]) return porCodigo[e.codigo];
    // TypeError es lo que tira fetch cuando directamente no hay red.
    if (e instanceof TypeError) return "No hay conexión. Revisá tu internet y reintentá.";
    return "No pude analizar esto. Probá de nuevo, con un poco más de detalle o una foto más clara.";
  }

  window.confirmSave = function () {
    if (!parsed) return;
    // La fecha sale del campo del resultado: hoy por defecto, o el día desde el
    // que abriste la carga. Así se completa un día pasado sin tocar el reloj.
    const input = document.getElementById("capture-date");
    const date = input && /^\d{4}-\d{2}-\d{2}$/.test(input.value) ? input.value : todayISO();
    if (date > todayISO()) { errorMsg = "Esa fecha todavía no llegó."; render(); return; }
    const meal = { id: uid(), date, consumed: parsed.consumed, protein: parsed.protein, carbs: parsed.carbs, fat: parsed.fat, note: parsed.note, score: parsed.nutritionScore, comment: parsed.nutritionComment, createdAt: Date.now() };
    if (parsed.detalle) meal.nutrientes = parsed.detalle;
    meals = [meal, ...meals];
    persistMeals();
    const existing = dayMeta[date] || { totalExpenditure: null, exerciseKcal: 0 };
    const nextMeta = { ...existing };
    // Congelar el gasto base vigente en el momento en que el día arranca: si más adelante
    // ajustás el gasto base (a mano o por calibración), los días ya empezados no se
    // recalculan solos hacia atrás — evita el bucle de "sugiere cambiar y nunca se asienta".
    if (nextMeta.maintenanceSnapshot == null) nextMeta.maintenanceSnapshot = goal.maintenance;
    if (parsed.totalExpenditure != null) nextMeta.totalExpenditure = parsed.totalExpenditure;
    if (parsed.exercise != null) nextMeta.exerciseKcal = (existing.exerciseKcal || 0) + parsed.exercise;
    dayMeta = { ...dayMeta, [date]: nextMeta };
    persistDayMeta();
    parsed = null; photo = null;
    dictationDraft = "";
    showCapture = false;
    captureDate = null;
    errorMsg = "";
    // Te deja mirando el día donde quedó la comida.
    activeTab = date === todayISO() ? "hoy" : "historial";
    expandedDays = { ...expandedDays, [date]: true };
    render();
  };
  window.discardParsed = function () { parsed = null; render(); };

  window.fillGapDays = function (mode, missingDatesJson, avgJson) {
    const missingDates = JSON.parse(missingDatesJson);

    const newMeals = [];
    const nextMeta = { ...dayMeta };
    missingDates.forEach((date) => {
      if (mode === "neutral") {
        newMeals.push({ id: uid(), date, consumed: goal.maintenance, protein: 0, carbs: 0, fat: 0, note: "Día completado automáticamente (neutro)", createdAt: Date.now() });
        nextMeta[date] = { totalExpenditure: goal.maintenance, exerciseKcal: 0 };
      } else {
        newMeals.push({ id: uid(), date, consumed: avg.consumed, protein: avg.protein, carbs: avg.carbs, fat: avg.fat, note: "Día completado automáticamente (con tu promedio habitual)", createdAt: Date.now() });
        nextMeta[date] = { totalExpenditure: avg.gasto, exerciseKcal: 0 };
      }
    });
    meals = [...newMeals, ...meals]; persistMeals();
    dayMeta = nextMeta; persistDayMeta();

  // ---------- gráfico de peso: real contra plan ----------
  function weightChartSVG() {
    const ws = weighIns.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
    if (ws.length < 2) {
      return `<div class="small dim" style="padding:18px 0;">Cargá al menos dos pesajes para ver la curva y comparar tu bajada real contra el plan.</div>`;
    }
    const W = 300, H = 132;
    const inicio = ws[0], fin = ws[ws.length - 1];
    const span = Math.max(1, dayDiff(inicio.date, fin.date));

    // El plan se ancla en tu primer pesaje y baja en línea recta hasta el peso
    // objetivo en la fecha objetivo. Así no depende de goal.currentWeight, que
    // vas editando, y la comparación se mantiene estable.
    const planDias = goal.goalDate && dayDiff(inicio.date, goal.goalDate) > 0 ? dayDiff(inicio.date, goal.goalDate) : null;
    const planEn = (iso) => {
      if (!planDias) return null;
      const t = Math.min(1, Math.max(0, dayDiff(inicio.date, iso) / planDias));
      return inicio.weight + (goal.goalWeight - inicio.weight) * t;
    };
    const planFin = planEn(fin.date);

    const valores = ws.map((w) => w.weight).concat(planFin != null ? [planFin] : []);
    let min = Math.min.apply(null, valores), max = Math.max.apply(null, valores);
    const pad = Math.max(0.4, (max - min) * 0.2);
    min -= pad; max += pad;
    const rango = max - min || 1;
    const X = (iso) => (dayDiff(inicio.date, iso) / span) * W;
    const Y = (v) => H - ((v - min) / rango) * H;

    const puntos = ws.map((w) => `${X(w.date).toFixed(1)},${Y(w.weight).toFixed(1)}`).join(" ");
    const circulos = ws.map((w, i) =>
      i === ws.length - 1
        ? `<circle cx="${X(w.date).toFixed(1)}" cy="${Y(w.weight).toFixed(1)}" r="5" fill="var(--amber)"></circle>`
        : `<circle cx="${X(w.date).toFixed(1)}" cy="${Y(w.weight).toFixed(1)}" r="3.5" fill="var(--surface)" stroke="var(--amber)" stroke-width="2"></circle>`
    ).join("");

    const lineaPlan = planFin != null
      ? `<line x1="0" y1="${Y(inicio.weight).toFixed(1)}" x2="${W}" y2="${Y(planFin).toFixed(1)}" stroke="var(--textDim)" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round" opacity=".55"></line>`
      : "";

    return `<svg width="100%" viewBox="0 0 ${W} ${H + 24}" style="display:block;overflow:visible;">
      <line x1="0" y1="4" x2="${W}" y2="4" stroke="var(--surfaceRaised)" stroke-width="1"></line>
      <line x1="0" y1="${(H / 2).toFixed(0)}" x2="${W}" y2="${(H / 2).toFixed(0)}" stroke="var(--surfaceRaised)" stroke-width="1"></line>
      <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--surfaceRaised)" stroke-width="1"></line>
      ${lineaPlan}
      <polyline points="${puntos}" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
      ${circulos}
      <text x="0" y="${H + 18}" fill="var(--textDim)" font-size="10" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">${formatDate(inicio.date)}</text>
      <text x="${W}" y="${H + 18}" text-anchor="end" fill="var(--textDim)" font-size="10" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">${formatDate(fin.date)}</text>
    </svg>`;
  }

  // ---------- datos compartidos por todas las pantallas ----------
  function computeCtx() {
    const dayStats = computeDayStats();
    const todayStr = todayISO();
    const todayStats = dayStats.find((d) => d.date === todayStr) || null;
    const todayClosed = !!(dayMeta[todayStr] && dayMeta[todayStr].closed);
    const settled = dayStats.filter((d) => !(d.date === todayStr && !d.closed));

    const totalKgToLose = Math.max(0, goal.currentWeight - goal.goalWeight);
    const goalKcal = totalKgToLose * KCAL_PER_KG;
    const totalDeficit = settled.reduce((s, d) => s + d.net, 0);
    const pct = goalKcal > 0 ? Math.min(100, Math.max(0, (totalDeficit / goalKcal) * 100)) : 0;
    const remaining = goalKcal - totalDeficit;
    const daysCount = dayStats.length;
    const kgLost = totalDeficit / KCAL_PER_KG;
    const daysLeft = daysBetween(todayISO(), goal.goalDate);
    const streak = computeDeficitStreak(settled);
    const badges = computeBadges({ streak, kgLost: Math.max(0, kgLost), pct });

    const avgConsumed = daysCount ? dayStats.reduce((s, d) => s + d.consumed, 0) / daysCount : 0;
    const avgProtein = daysCount ? dayStats.reduce((s, d) => s + d.protein, 0) / daysCount : 0;
    const avgCarbs = daysCount ? dayStats.reduce((s, d) => s + d.carbs, 0) / daysCount : 0;
    const avgFat = daysCount ? dayStats.reduce((s, d) => s + d.fat, 0) / daysCount : 0;
    const avgGasto = daysCount ? dayStats.reduce((s, d) => s + d.gasto, 0) / daysCount : goal.maintenance;
    const avgNet = daysCount ? totalDeficit / daysCount : 0;

    const proteinTarget = goal.proteinTarget || calcProteinTarget(goal.currentWeight);
    const todayProtein = todayStats ? todayStats.protein : 0;

    const wSorted = weighIns.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
    let calibration = null;
    const CALIBRATION_WINDOW_DAYS = 21;
    const recientes = wSorted.filter((w) => daysBetween(w.date, todayISO()) <= CALIBRATION_WINDOW_DAYS);
    if (recientes.length >= 2) {
      const first = recientes[0], last = recientes[recientes.length - 1];
      const days = daysBetween(first.date, last.date);
      if (days >= 5) {
        const actualKgLost = first.weight - last.weight;
        const actualKcalDeficit = actualKgLost * KCAL_PER_KG;
        const trackedKcalDeficit = dayStats.filter((d) => d.date >= first.date && d.date <= last.date).reduce((s, d) => s + d.net, 0);
        const discrepancyPerDay = (actualKcalDeficit - trackedKcalDeficit) / days;
        if (Math.abs(discrepancyPerDay) > 80) {
          const MAX_ADJUSTMENT_PER_STEP = 400;
          const MIN_MAINTENANCE = 1200;
          const capped = Math.max(-MAX_ADJUSTMENT_PER_STEP, Math.min(MAX_ADJUSTMENT_PER_STEP, discrepancyPerDay));
          const suggested = Math.max(MIN_MAINTENANCE, Math.round(goal.maintenance + capped));
          // Si ya postergaste exactamente esta sugerencia, no insistimos. Vuelve
          // a aparecer sola cuando un pesaje nuevo cambie el número.
          if (suggested !== calibrationDismissed) {
            calibration = { discrepancyPerDay, cappedAdjustment: capped, suggestedMaintenance: suggested, days, actualKgLost };
          }
        }
      }
    }

    let missingDates = [];
    if (dayStats.length > 0) {
      const sorted = dayStats.map((d) => d.date).sort();
      const lastDate = sorted[sorted.length - 1];
      const yesterday = addDaysISO(todayISO(), -1);
      if (lastDate < yesterday) {
        const existing = new Set(sorted);
        let cursor = addDaysISO(lastDate, 1), guard = 0;
        while (cursor <= yesterday && guard < 120) {
          if (!existing.has(cursor)) missingDates.push(cursor);
          cursor = addDaysISO(cursor, 1); guard++;
        }
      }
    }

    return {
      dayStats, todayStr, todayStats, todayClosed, settled, goalKcal, totalDeficit, pct,
      remaining, daysCount, kgLost, daysLeft, streak, badges,
      avgConsumed, avgProtein, avgCarbs, avgFat, avgGasto, avgNet,
      proteinTarget, todayProtein, wSorted, calibration, missingDates,
      showGapBanner: missingDates.length > 0 && !gapChoiceMade,
      avgForFill: { consumed: avgConsumed, protein: avgProtein, carbs: avgCarbs, fat: avgFat, gasto: avgGasto, net: avgNet },
    };
  }

  // ---------- piezas de Hoy (v16) ----------

  // es-AR agrupa también las cifras de cuatro dígitos (2.200); es-ES no, y por
  // eso la app mezclaba "2200" con "76.100".
  function kcal(v) { return Math.round(Number(v) || 0).toLocaleString("es-AR"); }

  // Déficit que te toca hoy para llegar a tu fecha. Sale de lo que faltaba
  // ANTES de hoy, así el número no se mueve mientras cargás comidas ni cuando
  // cerrás el día.
  function metaDiaria(c) {
    const antes = c.settled.filter((d) => d.date !== c.todayStr).reduce((s, d) => s + d.net, 0);
    const falta = c.goalKcal - antes;
    return falta > 0 ? falta / c.daysLeft : 0;
  }

  // El número grande de Hoy: lo que te queda por comer para cumplir la meta
  // del día. Antes era el balance con signo ("-1040" en verde), que se lee al
  // revés. Cuatro estados: te quedan, te pasaste de la meta pero seguís en
  // déficit, superávit y día cheat.
  function estadoDelDia({ consumido, gasto, meta, cheat }) {
    const limite = Math.max(0, gasto - meta);
    if (cheat) {
      return { etiqueta: "Día cheat", numero: kcal(consumido), unidad: "kcal comidas", color: "var(--cheat)", pct: 100,
        sub: "Hoy no hay límite. No corta la racha; cuenta para el total.", der: `gastaste ${kcal(gasto)}` };
    }
    if (consumido <= limite) {
      return { etiqueta: "Te quedan hoy", numero: kcal(limite - consumido), unidad: "kcal", color: "var(--sage)",
        pct: limite > 0 ? (consumido / limite) * 100 : 100,
        sub: meta > 0 ? `para cumplir tu meta de ${kcal(meta)} kcal de déficit` : "para mantenerte: ya no te hace falta déficit",
        der: `tu límite de hoy: ${kcal(limite)}` };
    }
    if (consumido <= gasto) {
      return { etiqueta: "Te pasaste de la meta", numero: kcal(consumido - limite), unidad: "kcal", color: "var(--amber)", pct: 100,
        sub: `Igual vas en déficit: <span style="color:var(--text);font-weight:700;">${kcal(gasto - consumido)} kcal</span>`,
        der: `límite ${kcal(limite)}` };
    }
    // El color del superávit respeta el umbral de Ajustes (amarillo → rojo).
    return { etiqueta: "Superávit de hoy", numero: "+" + kcal(consumido - gasto), unidad: "kcal", color: formatBalance(gasto - consumido).color, pct: 100,
      sub: "Comiste más de lo que gastaste. Es un día: mañana seguimos.", der: `gastaste ${kcal(gasto)}` };
  }

  function formEditarComida(m) {
    return `<div style="background:var(--bg);border-radius:8px;padding:12px;border:1px solid var(--amber);">
      <div class="grid2" style="margin-bottom:10px;">
        <div><label class="label">Fecha</label><input id="edit-meal-date-${m.id}" type="date" value="${m.date}"></div>
        <div><label class="label">Consumido (kcal)</label><input id="edit-meal-consumed-${m.id}" type="number" value="${m.consumed}"></div>
      </div>
      <div class="grid3" style="margin-bottom:10px;">
        <div><label class="label">Proteína</label><input id="edit-meal-protein-${m.id}" type="number" value="${m.protein}"></div>
        <div><label class="label">Carbos</label><input id="edit-meal-carbs-${m.id}" type="number" value="${m.carbs}"></div>
        <div><label class="label">Grasa</label><input id="edit-meal-fat-${m.id}" type="number" value="${m.fat}"></div>
      </div>
      <div style="margin-bottom:10px;"><label class="label">Nota</label><input id="edit-meal-note-${m.id}" type="text" value="${esc(m.note)}"></div>
      <div class="row gap8">

    </div>`;
  }

  function confirmarBorrarHTML(m) {
    return `<div>
      <div class="small" style="font-weight:700;margin-bottom:4px;">¿Borrar esta comida?</div>
      <div class="xs dim" style="margin-bottom:12px;">Se restan ${kcal(m.consumed)} kcal de ese día. No se puede deshacer.</div>
      <div class="row gap10">
        <button class="btn-danger" style="flex:1;min-height:44px;" onclick="removeMeal('${m.id}')">Sí, borrar</button>
        <button class="btn-secondary" style="flex:1;min-height:44px;" onclick="cancelDeleteMeal()">Cancelar</button>
      </div>
    </div>`;
  }

  // Una comida (de Hoy o del Historial): cerrada muestra nota, macros, kcal y
  // puntaje; tocada se abre con los macros, los nutrientes, Editar y Borrar.
  function comidaCardHTML(m) {
    if (editingMealId === m.id) return formEditarComida(m);
    const abierta = openMealDetail === m.id;
    const borrando = confirmDeleteMealId === m.id;
    const borde = borrando ? "border-color:var(--rust);" : abierta ? "border-color:var(--amber);" : "";
    let h = `<div class="meal-card" style="${borde}">
      <button class="meal-btn" onclick="toggleMealDetail('${m.id}')" aria-expanded="${abierta}">
        <div style="flex:1;min-width:0;">
          <div class="meal-note">${esc(m.note)}</div>
          <div class="xs dim" style="margin-top:4px;">${abierta && m.comment ? esc(m.comment) : macroInline(m.protein, m.carbs, m.fat) + " g"}</div>
        </div>
        <div style="text-align:right;flex-shrink:0;">
          <div style="font-size:15px;font-weight:700;">${kcal(m.consumed)} <span class="xs dim" style="font-weight:400;">kcal</span></div>
          ${m.base ? `<div class="xs dim" style="margin-top:4px;text-decoration:line-through;">${kcal(m.base.consumed)}</div>`
            : m.score != null ? `<div class="xs dim" style="margin-top:4px;"><span class="dot" style="background:${nutritionColor(m.score)};"></span>${m.score}/10</div>` : ""}
        </div>

      </button>`;
    if (abierta) {
      h += `<div class="meal-body">`;
      if (borrando) {
        h += confirmarBorrarHTML(m);
      } else {
        h += porcionesHTML(m);
        h += `<div class="grid3" style="gap:8px;">
          <div class="tile"><div class="stat-mini">Proteína</div><div style="color:var(--protein);">${m.protein.toFixed(0)} g</div></div>
          <div class="tile"><div class="stat-mini">Carbos</div><div style="color:var(--carbs);">${m.carbs.toFixed(0)} g</div></div>
          <div class="tile"><div class="stat-mini">Grasas</div><div style="color:var(--fat);">${m.fat.toFixed(0)} g</div></div>
        </div>`;
        h += m.nutrientes
          ? `<div>${bloqueNutrientes(nutrientesDeComida(m), 0, mealNutrOpen, "toggleMealNutr()")}</div>`
          : `<div class="xs dim">${m.sugerida ? "Vino de una sugerencia: tiene calorías y macros, sin detalle de vitaminas y minerales." : "Sin detalle de nutrientes: se cargó antes de la v15."}</div>`;
        const fijo = esFijo(m);
        h += `<button class="btn-fijo ${fijo ? "on" : ""}" onclick="toggleFijo('${m.id}')" aria-pressed="${fijo}">${icon("star", "var(--amber)", 15).replace('fill="none"', `fill="${fijo ? "var(--amber)" : "none"}"`)} ${fijo ? 'En "Lo de siempre" · quitar' : 'Guardar en "Lo de siempre"'}</button>`;
        h += `<div class="row gap10">
          <button class="btn-secondary" style="flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;" onclick="startEditMeal('${m.id}')">${icon("pencil", "var(--text)", 15)} Editar</button>
          <button class="btn-secondary" style="flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--textDim);" onclick="askDeleteMeal('${m.id}')">${icon("trash", "var(--textDim)", 15)} Borrar</button>
        </div>`;
      }
      h += `</div>`;
    }
    return h + `</div>`;
  }

  // ================== v17: dieta, lo de siempre, porciones, semana, nube ==================

  // ---------- dieta ----------
  //
  // La proteína es la meta de Ajustes (por kilo), sea cual sea la dieta. La
  // dieta reparte el resto del límite del día entre carbohidratos y grasas:
  // `carbos` es la parte de esas calorías que va a carbohidratos.
  const DIETAS = [
    { k: "equilibrada", nombre: "Equilibrada", detalle: "De todo un poco", carbos: 0.6 },
    { k: "alta_proteina", nombre: "Alta en proteína", detalle: "Carnes magras, huevo, lácteos", carbos: 0.5 },
    { k: "baja_carbos", nombre: "Baja en carbohidratos", detalle: "Menos pan, pastas y azúcar", carbos: 0.3 },
    { k: "mediterranea", nombre: "Mediterránea", detalle: "Oliva, pescado, legumbres", carbos: 0.55 },
    { k: "vegetariana", nombre: "Vegetariana", detalle: "Sin carne ni pescado", carbos: 0.65 },
  ];
  function dietaActual() { return DIETAS.find((d) => d.k === goal.dieta) || DIETAS[0]; }

  // Metas de hoy en gramos y lo que ya se comió, para Dieta y las sugerencias.
  function objetivosDelDia(c) {
    const d = dietaActual();
    const cheat = !!(dayMeta[c.todayStr] && dayMeta[c.todayStr].cheat);
    const gasto = c.todayStats ? c.todayStats.gasto : goal.maintenance;
    const meta = metaDiaria(c);
    const limite = Math.max(0, gasto - meta);
    const proteina = c.proteinTarget;
    const resto = Math.max(0, limite - proteina * 4);
    const t = c.todayStats || { consumed: 0, protein: 0, carbs: 0, fat: 0, meals: [] };
    return {
      dieta: d, cheat, gasto, meta, limite,
      metas: { p: proteina, c: (resto * d.carbos) / 4, g: (resto * (1 - d.carbos)) / 9 },
      comido: { kcal: t.consumed, p: t.protein, c: t.carbs, g: t.fat },
      quedan: Math.max(0, limite - t.consumed),
      comidas: t.meals,
    };
  }

  // Cómo va un macro contra su meta: texto corto y color.
  function estadoMacro(comido, metaG, esProteina) {
    if (!(metaG > 0)) return { texto: `${Math.round(comido)} g`, color: "var(--textDim)" };
    const r = comido / metaG;
    const dif = Math.round(Math.abs(metaG - comido));
    if (r > 1.05) return { texto: esProteina ? "¡llegaste!" : `te pasaste ${dif} g`, color: esProteina ? "var(--sage)" : "var(--rust)" };
    if (r >= 0.95) return { texto: esProteina ? "¡llegaste!" : "al tope", color: esProteina ? "var(--sage)" : "var(--amber)" };
    return { texto: esProteina ? `te faltan ${dif} g` : `te quedan ${dif} g`, color: "var(--text)" };
  }

  function veredictoDelDia(o) {
    if (o.cheat) return "Hoy es día cheat: no hay límite. Las calorías cuentan igual para el total.";
    if (o.comido.kcal > o.limite) return `Ya pasaste tu límite de hoy por ${kcal(o.comido.kcal - o.limite)} kcal. Si comés algo más, que sea liviano: verdura o proteína magra.`;
    const topes = [];
    if (o.metas.c > 0 && o.comido.c >= o.metas.c * 0.95) topes.push("los carbohidratos");
    if (o.metas.g > 0 && o.comido.g >= o.metas.g * 0.95) topes.push("las grasas");
    const faltaP = Math.round(o.metas.p - o.comido.p);
    if (topes.length && faltaP > 0) return `Vas bien de calorías, pero ${topes.join(" y ")} ya están al tope. <b>Lo que queda, que sea proteína magra y verdura.</b>`;
    if (topes.length) return `Vas bien de calorías, pero ${topes.join(" y ")} ya están al tope. <b>Lo que queda, que sea verdura y algo liviano.</b>`;
    if (faltaP > 30) return `Vas bien. Te faltan ${faltaP} g de proteína: <b>priorizala en lo que queda.</b>`;
    return "Vas bien en todo. Seguí así.";
  }

  window.elegirDieta = function (k) {
    if (!DIETAS.some((d) => d.k === k)) return;
    goal = { ...goal, dieta: k };
    persistGoal();
    render();
  };

  // ---------- sugerencias: qué comer el resto del día ----------
  //
  // Se guardan con la fecha: si cambiás de pantalla o cerrás la app no se
  // pierden, y al otro día se descartan solas.
  let sugerencias = null;          // {fecha, resumen, opciones:[{momento, comida, kcal, ..., comida_ok}]}
  let sugiriendo = false;          // true, o el índice de la opción que se está cambiando
  let sugerenciasError = "";
  function persistSugerencias() { try { localStorage.setItem("deficit_sugerencias", JSON.stringify(sugerencias)); } catch (e) { console.error(e); } }
  function cargarSugerencias() {
    try {
      const s = JSON.parse(localStorage.getItem("deficit_sugerencias") || "null");
      sugerencias = s && s.fecha === todayISO() && Array.isArray(s.opciones) ? s : null;
    } catch (e) { sugerencias = null; }
  }
  function horaLocal() { const d = new Date(); return `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`; }
  function limpiarOpcion(o) {
    return {
      momento: String(o.momento || "Comida"), comida: String(o.comida || ""),
      kcal: Math.max(0, Number(o.kcal) || 0), proteinas_g: Math.max(0, Number(o.proteinas_g) || 0),
      carbohidratos_g: Math.max(0, Number(o.carbohidratos_g) || 0), grasas_g: Math.max(0, Number(o.grasas_g) || 0),
    };
  }

  async function pedirSugerenciasAlServidor(extra) {
    const o = objetivosDelDia(computeCtx());
    const sugerencia = {
      hora: horaLocal(),
      quedan_kcal: Math.round(o.quedan),
      faltan_proteinas_g: Math.round(Math.max(0, o.metas.p - o.comido.p)),
      faltan_carbohidratos_g: Math.round(Math.max(0, o.metas.c - o.comido.c)),
      faltan_grasas_g: Math.round(Math.max(0, o.metas.g - o.comido.g)),
      dieta: o.dieta.k,
      comidas_hoy: o.comidas.map((m) => m.note).slice(0, 15),
      momentos: faltanHoy(o),
      sin_desayuno: !comidasHabituales().includes("Desayuno"),
      ...extra,
    };
    const r = await fetch("/.netlify/functions/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ perfil: "sugerencias", sugerencia }),
    });
    const obj = await r.json();
    if (!r.ok) { const err = new Error(obj.error || "Error"); err.codigo = obj.code; throw err; }
    return { resumen: String(obj.resumen || ""), opciones: (obj.opciones || []).map(limpiarOpcion) };
  }

  window.pedirSugerencias = async function () {
    sugiriendo = true; sugerenciasError = "";
    render();
    try {
      const evitar = sugerencias ? sugerencias.opciones.map((x) => x.comida) : [];
      const res = await pedirSugerenciasAlServidor(evitar.length ? { evitar } : {});
      sugerencias = { fecha: todayISO(), resumen: res.resumen, opciones: res.opciones };
      persistSugerencias();
    } catch (e) {
      console.error(e);
      sugerenciasError = mensajeDeError(e);
    } finally {
      sugiriendo = false;
      render();
    }
  };

  window.otraOpcion = async function (i) {
    if (!sugerencias || !sugerencias.opciones[i]) return;
    sugiriendo = i; sugerenciasError = "";
    render();
    try {
      const actual = sugerencias.opciones[i];
      const evitar = sugerencias.opciones.map((x) => x.comida).concat((sugerencias.descartadas || []).slice().reverse());
      const res = await pedirSugerenciasAlServidor({ solo_momento: actual.momento, evitar });
      const nueva = res.opciones.find((x) => x.momento === actual.momento) || res.opciones[0];
      if (nueva) {
        sugerencias.descartadas = (sugerencias.descartadas || []).concat(actual.comida).slice(-10);
        sugerencias.opciones[i] = nueva;
        persistSugerencias();
      }
    } catch (e) {
      console.error(e);
      sugerenciasError = mensajeDeError(e);
    } finally {
      sugiriendo = false;
      render();
    }
  };

  // "Lo comí": entra como una comida más de hoy, con los números de la
  // sugerencia y sin gastar otro análisis (por eso sin detalle de vitaminas).
  window.comiSugerencia = function (i) {
    if (!sugerencias || !sugerencias.opciones[i]) return;
    const o = sugerencias.opciones[i];
    agregarComida({ id: uid(), date: todayISO(), consumed: o.kcal, protein: o.proteinas_g, carbs: o.carbohidratos_g, fat: o.grasas_g, note: `${o.momento}: ${o.comida}`, sugerida: true, createdAt: Date.now() });
    sugerencias.opciones.splice(i, 1);
    persistSugerencias();
    if (faltanManual) faltanManual = { ...faltanManual, lista: faltanManual.lista.filter((m) => m !== o.momento) };
    render();
  };

  // Suma una comida ya armada (de Lo de siempre o de una sugerencia) y deja
  // congelado el gasto base del día, igual que confirmSave.
  function agregarComida(meal) {
    meals = [meal, ...meals];
    persistMeals();
    const existing = dayMeta[meal.date] || { totalExpenditure: null, exerciseKcal: 0 };
    if (existing.maintenanceSnapshot == null) {
      dayMeta = { ...dayMeta, [meal.date]: { ...existing, maintenanceSnapshot: goal.maintenance } };
      persistDayMeta();
    }
  }

  // ---------- tus comidas (ayuno) ----------
  //
  // Qué comidas hacés en el día. Sin desayuno = ayunás hasta el mediodía, y
  // las sugerencias no proponen nada antes del almuerzo. Cuáles te faltan hoy
  // se deduce contando lo que ya cargaste, en orden: con almuerzo, merienda y
  // cena, si ya cargaste dos, falta la cena. Cargas a menos de 45 minutos una
  // de otra cuentan como la misma comida (el plato y el postre por separado).
  // Si la cuenta no coincide, se corrige con un toque y vale por ese día.
  const COMIDAS_POSIBLES = ["Desayuno", "Almuerzo", "Merienda", "Cena"];
  const MISMA_COMIDA_MS = 45 * 60 * 1000;
  let faltanManual = null;         // {fecha, lista} si corregiste a mano cuáles faltan
  function comidasHabituales() {
    const c = Array.isArray(goal.comidas) ? COMIDAS_POSIBLES.filter((m) => goal.comidas.includes(m)) : [];
    return c.length ? c : COMIDAS_POSIBLES.slice();
  }
  function comidasHechas(comidasHoy) {
    const horas = comidasHoy.map((m) => m.createdAt || 0).sort((a, b) => a - b);
    let n = 0, anterior = -Infinity;
    horas.forEach((t) => { if (t - anterior > MISMA_COMIDA_MS) n++; anterior = t; });
    return n;
  }
  function faltanHoy(o) {
    const habituales = comidasHabituales();
    if (faltanManual && faltanManual.fecha === todayISO()) return habituales.filter((m) => faltanManual.lista.includes(m));
    return habituales.slice(Math.min(comidasHechas(o.comidas), habituales.length));
  }
  function conArticulo(m) { return (m === "Merienda" || m === "Cena" ? "la " : "el ") + m.toLowerCase(); }
  window.toggleComidaHabitual = function (m) {
    const actual = comidasHabituales();
    const nueva = actual.includes(m) ? actual.filter((x) => x !== m) : COMIDAS_POSIBLES.filter((x) => x === m || actual.includes(x));
    if (!nueva.length) return;
    goal = { ...goal, comidas: nueva };
    faltanManual = null;
    persistGoal();
    render();
  };
  window.toggleFalta = function (m) {
    const actual = faltanHoy(objetivosDelDia(computeCtx()));
    faltanManual = { fecha: todayISO(), lista: actual.includes(m) ? actual.filter((x) => x !== m) : actual.concat(m) };
    render();
  };

  function resumenFaltan(o, habituales, faltan) {
    const hechas = habituales.length - faltan.length;
    const ya = hechas === 0 ? "Todavía no comiste." : `Ya comiste ${hechas} de tus ${habituales.length} comidas.`;
    if (!faltan.length) return `${ya} Si querés una idea igual, marcá abajo para qué comida.`;
    if (o.cheat) return `${ya} Hoy es cheat: te sugiero igual algo que entre en tu límite.`;
    if (faltan.length === 1) return `${ya} Te quedan <b style="color:var(--text);">${kcal(o.quedan)} kcal</b> para ${conArticulo(faltan[0])}.`;
    return `${ya} Te quedan <b style="color:var(--text);">${kcal(o.quedan)} kcal</b> para ${faltan.length} comidas (≈ ${kcal(o.quedan / faltan.length)} cada una).`;
  }

  // ---------- PANTALLA: DIETA ----------
  function screenDieta(c) {
    const o = objetivosDelDia(c);
    const habituales = comidasHabituales();
    const faltan = faltanHoy(o);
    const fecha = new Date().toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
    let h = `<div class="screen">
      <div class="topbar">
        <div>
          <div style="font-size:26px;font-weight:700;line-height:1.1;">Dieta</div>
          <div class="small dim" style="margin-top:2px;">${esc(fecha.charAt(0).toUpperCase() + fecha.slice(1))}</div>
        </div>
        <button class="icon-btn" onclick="setTab('ajustes')" aria-label="Ajustes">${icon("sliders", "var(--textDim)", 22)}</button>
      </div>`;

    h += `<div class="card">
      <div class="hero-label" style="margin-bottom:10px;">Tu tipo de dieta</div>
      <div class="col gap8">
        ${DIETAS.map((d) => {
          const on = d.k === o.dieta.k;
          return `<button class="dieta-op ${on ? "on" : ""}" onclick="elegirDieta('${d.k}')" aria-pressed="${on}">
            <span class="dieta-radio"></span>
            <span style="flex:1;min-width:0;"><span style="display:block;font-size:14px;font-weight:700;">${d.nombre}</span><span class="xs dim">${d.detalle}</span></span>
            <span class="xs" style="white-space:nowrap;color:${on ? "var(--amber)" : "var(--textDim)"};${on ? "font-weight:700;" : ""}">C ${Math.round(d.carbos * 100)} · G ${Math.round((1 - d.carbos) * 100)}</span>
          </button>`;
        }).join("")}
      </div>
      <div class="xs dim" style="margin-top:10px;line-height:1.45;">La proteína es tu meta de Ajustes (${c.proteinTarget} g). La dieta reparte el resto de las calorías entre carbohidratos (C) y grasas (G).</div>
      <div class="divider"></div>
      <div class="hero-label">Tus comidas</div>
      <div class="row gap8" style="flex-wrap:wrap;margin-top:10px;">
        ${COMIDAS_POSIBLES.map((m) => { const on = habituales.includes(m); return `<button class="opcion-chip ${on ? "on" : ""}" onclick="toggleComidaHabitual('${m}')" aria-pressed="${on}">${m}</button>`; }).join("")}
      </div>
      <div class="xs dim" style="margin-top:8px;line-height:1.45;">${habituales.includes("Desayuno") ? "¿Ayunás a la mañana? Sacá el desayuno." : "Sin desayuno: ayunás hasta el mediodía y no te sugiero nada antes del almuerzo."}</div>
    </div>`;

    const fila = (nombre, comido, metaG, color, esP) => {
      const e = estadoMacro(comido, metaG, esP);
      const pct = metaG > 0 ? Math.min(100, (comido / metaG) * 100) : 0;
      return `<div>
        <div class="row" style="justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px;gap:8px;">
          <span style="font-weight:700;">${nombre}</span>
          <span class="dim"><b style="color:${color};">${Math.round(comido)}</b> de ${Math.round(metaG)} g · <span style="color:${e.color};font-weight:700;">${e.texto}</span></span>
        </div>
        <div class="track" style="height:8px;"><i style="width:${pct.toFixed(0)}%;background:${color};"></i></div>
      </div>`;
    };
    h += `<div class="card">
      <div class="hero-label">Cómo viene el día</div>
      <div class="row" style="align-items:baseline;gap:8px;margin-top:6px;">
        <div style="font-size:36px;font-weight:700;line-height:1;color:${o.cheat ? "var(--cheat)" : o.comido.kcal > o.limite ? "var(--rust)" : "var(--sage)"};">${o.cheat ? kcal(o.comido.kcal) : kcal(o.quedan)}</div>
        <div class="small dim">${o.cheat ? "kcal comidas hoy" : `kcal libres de <b style="color:var(--text);">${kcal(o.limite)}</b>`}</div>
      </div>
      <div class="col" style="gap:14px;margin-top:18px;">
        ${fila("Proteína", o.comido.p, o.metas.p, "var(--protein)", true)}
        ${fila("Carbohidratos", o.comido.c, o.metas.c, "var(--carbs)", false)}
        ${fila("Grasas", o.comido.g, o.metas.g, "var(--fat)", false)}
      </div>
      <div class="veredicto">${veredictoDelDia(o)}</div>
    </div>`;

    // ¿Qué como el resto del día?
    h += `<div class="card">
      <div class="title" style="font-size:17px;">¿Qué como el resto del día?</div>
      <div class="small dim" style="margin-top:4px;line-height:1.45;">${resumenFaltan(o, habituales, faltan)}</div>
      <div class="row gap8" style="flex-wrap:wrap;align-items:center;margin-top:10px;">
        <span class="xs dim" style="font-weight:700;">Te falta:</span>
        ${habituales.map((m) => { const on = faltan.includes(m); return `<button class="opcion-chip ${on ? "on" : ""}" onclick="toggleFalta('${m}')" aria-pressed="${on}">${m}</button>`; }).join("")}
      </div>`;
    if (sugerenciasError) h += `<div class="small" style="color:var(--rust);margin-top:12px;">${esc(sugerenciasError)}</div>`;
    // Las de comidas que ya hiciste se esconden (siguen guardadas: si volvés a
    // marcar esa comida como pendiente, reaparecen).
    const visible = (op) => faltan.includes(op.momento) || !COMIDAS_POSIBLES.includes(op.momento);
    const ops = sugerencias ? sugerencias.opciones.filter(visible) : [];
    if (sugerencias && sugerencias.resumen && ops.length) h += `<div class="veredicto">${esc(sugerencias.resumen)}</div>`;
    (sugerencias ? sugerencias.opciones : []).forEach((op, i) => {
      if (!visible(op)) return;
      const cambiando = sugiriendo === i;
      h += `<div class="sugerencia">
        <div class="sug-momento">${esc(op.momento)}</div>
        <div style="font-size:14px;line-height:1.35;margin-top:4px;">${esc(op.comida)}</div>
        <div class="xs dim" style="margin-top:4px;"><b style="color:var(--text);">${kcal(op.kcal)} kcal</b> · ${macroInline(op.proteinas_g, op.carbohidratos_g, op.grasas_g)} g</div>
        <div class="row gap8" style="margin-top:10px;">
          <button class="btn-sage" style="flex:1;min-height:42px;" onclick="comiSugerencia(${i})" ${sugiriendo !== false ? "disabled" : ""}>Lo comí</button>
          <button class="btn-secondary" style="flex:1;min-height:42px;" onclick="otraOpcion(${i})" ${sugiriendo !== false ? "disabled" : ""}>${cambiando ? '<span class="spin">↻</span> Buscando…' : "Otra opción"}</button>
        </div>
      </div>`;
    });
    if (ops.length) {
      const tot = ops.reduce((s, x) => ({ k: s.k + x.kcal, p: s.p + x.proteinas_g }), { k: 0, p: 0 });
      h += `<div class="xs dim" style="margin-top:12px;line-height:1.45;">Con ${ops.length > 1 ? "estas" : "esta"} cerrás el día en <b style="color:var(--text);">${kcal(o.comido.kcal + tot.k)} kcal</b> y <b style="color:var(--text);">${Math.round(o.comido.p + tot.p)} g de proteína</b>.</div>`;
    }
    const cargandoTodo = sugiriendo === true;
    const sinFaltan = !faltan.length;
    h += `<button class="${ops.length ? "btn-secondary" : "btn-primary"} big-btn" style="width:100%;margin-top:14px;" onclick="pedirSugerencias()" ${sugiriendo !== false || sinFaltan ? "disabled" : ""}>
        ${cargandoTodo ? '<span class="spin">↻</span> Pensando…' : sinFaltan ? "Marcá qué comida te falta" : ops.length ? "Sugerime otras" : faltan.length === 1 ? `Sugerime ${conArticulo(faltan[0])}` : "Sugerime"}
      </button>
      <div class="xs dim" style="margin-top:8px;">Cada pedido de sugerencias gasta un análisis, como cargar una comida.</div>
    </div>`;

    return h + pieVersion() + `</div>`;
  }

  // ---------- lo de siempre (comidas frecuentes) ----------
  //
  // Dos fuentes: las que marcaste con ★ (se guarda una copia, con la porción
  // de ese momento) y las que cargaste 3 veces o más con el mismo texto (pasa
  // seguido justamente al sumarlas desde acá). Sumarlas no gasta análisis.
  let frecuentes = [];             // [{clave, note, consumed, protein, carbs, fat, nutrientes, score, comment}]
  const VECES_FRECUENTE = 3;
  function persistFrecuentes() { try { window.storage.set("frecuentes", JSON.stringify(frecuentes)); } catch (e) { console.error(e); } }
  function claveNota(note) { return String(note || "").trim().toLowerCase().replace(/\s+/g, " "); }
  function esFijo(m) { const k = claveNota(m.note); return frecuentes.some((f) => f.clave === k); }
  function copiaDeComida(m) {
    return { clave: claveNota(m.note), note: m.note, consumed: m.consumed, protein: m.protein, carbs: m.carbs, fat: m.fat, nutrientes: m.nutrientes || null, score: m.score, comment: m.comment };
  }
  function listaFrecuentes() {
    const fijos = frecuentes.map((f) => ({ ...f, fijo: true, veces: 0 }));
    const vistos = new Set(fijos.map((f) => f.clave));
    const grupos = {};
    meals.forEach((m) => {
      const k = claveNota(m.note);
      if (!k || vistos.has(k)) return;
      if (!grupos[k]) grupos[k] = { veces: 0, ultima: m };
      grupos[k].veces++;
      if (m.createdAt > grupos[k].ultima.createdAt) grupos[k].ultima = m;
    });
    const auto = Object.values(grupos).filter((g) => g.veces >= VECES_FRECUENTE)
      .sort((a, b) => b.veces - a.veces)
      .map((g) => ({ ...copiaDeComida(g.ultima), fijo: false, veces: g.veces }));
    return fijos.concat(auto).slice(0, 12);
  }
  // Por posición en la lista y no por el texto: una nota con apóstrofo
  // ("McDonald's") rompía el onclick.
  window.sumarFrecuente = function (i) {
    const f = listaFrecuentes()[i];
    if (!f) return;
    const date = captureDate || todayISO();
    const meal = { id: uid(), date, consumed: f.consumed, protein: f.protein, carbs: f.carbs, fat: f.fat, note: f.note, createdAt: Date.now() };
    if (f.nutrientes) meal.nutrientes = f.nutrientes;
    if (f.score != null) { meal.score = f.score; meal.comment = f.comment; }
    agregarComida(meal);
    showCapture = false; captureDate = null;
    activeTab = date === todayISO() ? "hoy" : "historial";
    expandedDays = { ...expandedDays, [date]: true };
    render();
  };
  window.toggleFijo = function (id) {
    const m = meals.find((x) => x.id === id);
    if (!m) return;
    const k = claveNota(m.note);
    frecuentes = esFijo(m) ? frecuentes.filter((f) => f.clave !== k) : [copiaDeComida(m), ...frecuentes].slice(0, 30);
    persistFrecuentes();
    render();
  };
  window.quitarFrecuente = function (i) {
    const f = listaFrecuentes()[i];
    if (!f) return;
    frecuentes = frecuentes.filter((x) => x.clave !== f.clave);
    persistFrecuentes();
    render();
  };
  function frecuentesHTML() {
    const lista = listaFrecuentes();
    if (!lista.length) {
      return `<div class="xs dim" style="margin-bottom:14px;line-height:1.45;">Tip: abrí una comida y tocá ★ para tenerla acá y sumarla con un toque, sin gastar análisis.</div>`;
    }
    return `<div class="hero-label" style="color:var(--amber);">★ Lo de siempre</div>
      <div class="xs dim" style="margin:4px 0 10px;">Un toque y se suma${captureDate && captureDate !== todayISO() ? ` al ${esc(formatDate(captureDate))}` : " a hoy"}. No gasta ningún análisis.</div>
      <div class="col gap8" style="margin-bottom:6px;">
        ${lista.map((f, i) => `<div class="frec">
          <div style="flex:1;min-width:0;">
            <div style="font-size:14px;">${esc(f.note)}</div>
            <div class="xs dim" style="margin-top:2px;"><b style="color:var(--text);">${kcal(f.consumed)} kcal</b> · <span style="color:var(--protein);">P ${Math.round(f.protein)}</span> · ${f.fijo ? "marcada ★" : `la cargaste ${f.veces} veces`}</div>
          </div>
          ${f.fijo ? `<button class="btn-ghost" onclick="quitarFrecuente(${i})" aria-label="Quitar de Lo de siempre">${icon("close", "var(--textDim)", 16)}</button>` : ""}
          <button class="frec-sumar" onclick="sumarFrecuente(${i})">+ Sumar</button>
        </div>`).join("")}
      </div>
      <div class="separador"><span>o contá algo nuevo</span></div>`;
  }

  // ---------- porciones ----------
  //
  // La primera vez que cambiás la porción se guarda el original en `base`, así
  // ½ → 2 → 1 vuelve exacto a lo que era. Editar a mano borra `base`: desde ahí
  // manda lo que escribiste.
  const PORCIONES = [[0.5, "½"], [1, "1"], [1.5, "1½"], [2, "2"]];
  window.setPorcion = function (id, factor) {
    meals = meals.map((m) => {
      if (m.id !== id) return m;
      const base = m.base || { consumed: m.consumed, protein: m.protein, carbs: m.carbs, fat: m.fat, nutrientes: m.nutrientes || null };
      if (factor === 1) {
        const out = { ...m, consumed: base.consumed, protein: base.protein, carbs: base.carbs, fat: base.fat };
        if (base.nutrientes) out.nutrientes = base.nutrientes;
        delete out.base; delete out.porcion;
        return out;
      }
      const out = { ...m, base, porcion: factor, consumed: base.consumed * factor, protein: base.protein * factor, carbs: base.carbs * factor, fat: base.fat * factor };
      if (base.nutrientes) {
        out.nutrientes = {};
        Object.keys(base.nutrientes).forEach((k) => { out.nutrientes[k] = (Number(base.nutrientes[k]) || 0) * factor; });
      }
      return out;
    });
    persistMeals();
    render();
  };
  function porcionesHTML(m) {
    const actual = m.porcion || 1;
    return `<div>
      <div class="small" style="font-weight:700;margin-bottom:8px;">¿Cuánto comiste?</div>
      <div class="porciones">
        ${PORCIONES.map(([f, txt]) => `<button class="${f === actual ? "on" : ""}" onclick="setPorcion('${m.id}', ${f})" aria-pressed="${f === actual}">${txt}</button>`).join("")}
      </div>
      <div class="xs dim" style="margin-top:6px;">${m.base ? `Antes: ${kcal(m.base.consumed)} kcal. ` : ""}Recalcula calorías, macros y nutrientes sin gastar análisis.</div>
    </div>`;
  }

  // ---------- resumen de la semana ----------
  //
  // Los últimos 7 días, cada uno contra su propio límite: lo que gastaste ese
  // día (basal más el ejercicio que cargaste, o el total de una app) menos la
  // meta diaria de hoy. La meta va cambiando un poco día a día, así que eso es
  // una aproximación; el gasto sí es el de cada día.
  //
  // Tres estados. Antes "te pasaste" juntaba dos cosas distintas, y un día en
  // déficit que no llegó a la meta se veía igual que uno en que comiste más de
  // lo que gastaste:
  //   meta      comiste hasta el límite: cumpliste la meta
  //   deficit   pasaste el límite pero no lo que gastaste: igual bajaste
  //   superavit comiste más de lo que gastaste (el único con ▲)
  let semanaSel = null;
  window.selDiaSemana = function (i) { semanaSel = semanaSel === i ? null : i; render(); };
  function datosSemana(c) {
    const meta = metaDiaria(c);
    const dias = [];
    for (let i = 6; i >= 0; i--) {
      const fecha = addDaysISO(c.todayStr, -i);
      const d = c.dayStats.find((x) => x.date === fecha);
      const esHoy = fecha === c.todayStr;
      const gasto = d ? d.gasto : goal.maintenance;
      const limite = Math.max(0, gasto - meta);
      const consumido = d ? d.consumed : 0;
      let estado = "vacio";
      if (esHoy) estado = "hoy";
      else if (d && d.cheat) estado = "cheat";
      else if (d) estado = consumido <= limite ? "meta" : consumido <= gasto ? "deficit" : "superavit";
      dias.push({ fecha, d, esHoy, limite, gasto, consumido, proteina: d ? d.protein : 0, estado,
        // Sin ejercicio ni total de una app, el gasto es solo el basal.
        soloBasal: !!d && !d.usedAppTotal && !d.exercise });
    }
    const completos = dias.filter((x) => x.d && !x.esHoy);
    const contables = completos.filter((x) => x.estado !== "cheat");
    return {
      dias, meta,
      cumplidos: contables.filter((x) => x.estado === "meta").length,
      enDeficit: contables.filter((x) => x.estado !== "superavit").length,
      contables: contables.length,
      promedio: completos.length ? completos.reduce((s, x) => s + x.consumido, 0) / completos.length : 0,
      proteina: completos.length ? completos.reduce((s, x) => s + x.proteina, 0) / completos.length : 0,
      deficit: completos.reduce((s, x) => s + x.d.net, 0),
    };
  }
  function semanaHTML(c) {
    const s = datosSemana(c);
    const W = 320, H = 160, BASE = 150, slot = W / 7, ancho = 26;
