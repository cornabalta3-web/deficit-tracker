<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Déficit">
<meta name="theme-color" content="#0A1E3D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/pulso-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/pulso-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400..900&display=swap" rel="stylesheet">
<title>Déficit Tracker</title>
<style>
  /* ================== v19: Pulso ==================
     Claro de día y oscuro de noche (según la hora, o fijo desde Ajustes).
     El color quiere decir lo mismo en toda la app:
       verde = vas bien · amarillo = te pasaste de tu número (todavía en déficit)
       rojo = pasaste un límite de verdad · celeste/azul = te falta.
     Los montos sin juicio (lo que aporta una comida) van en un color neutro. */
  :root, [data-theme="dark"] {
    --bg: #0A1E3D; --surface: #102B55; --surfaceRaised: #13305C; --line: #1E3D6E;
    --text: #F3F8FF; --textDim: #A5BBDD; --track: #1B3B6F; --tick: #3E6299;
    --acento: #39F28F; --acentoInk: #06182F; --acentoSoft: rgba(57,242,143,.12); --acentoSombra: 0 0 22px rgba(57,242,143,.35);
    --ok: #39F28F; --okInk: #06182F;
    --bien: #39F28F; --bienTexto: #39F28F; --bienSuave: rgba(57,242,143,.14);
    --ojo: #FFC83D; --ojoTexto: #FFC83D; --ojoSuave: rgba(255,200,61,.14);
    --rojo: #FF5A5F; --rojoTexto: #FF8A7A; --rojoSuave: rgba(255,90,95,.16);
    --falta: #4CC9FF; --faltaTexto: #4CC9FF; --faltaSuave: rgba(76,201,255,.14);
    --neutro: #C9D8F0; --punta: #FFFFFF; --puntaOjo: #06182F;
    --heroSombra: 0 18px 40px rgba(0,0,0,.35); --panelSombra: none;
    --navBg: #081831; --fab: #39F28F; --fabInk: #06182F; --fabSombra: 0 0 24px rgba(57,242,143,.45);
    --glowBien: drop-shadow(0 0 10px rgba(57,242,143,.75)); --glowOjo: drop-shadow(0 0 6px rgba(255,200,61,.85)); --glowRojo: drop-shadow(0 0 12px rgba(255,90,95,.75));
    --brillo: 1; --gastoBase: rgba(57,242,143,.40); --velo: rgba(4,12,26,.72);
    /* los nombres de antes, que siguen usando Historial, Ajustes y nutrientes.js */
    --amber: #FFC83D; --sage: #39F28F; --rust: #FF8A7A; --meta: #4CC9FF; --cheat: #E3A6FF;
    --protein: #4CC9FF; --carbs: #C9D8F0; --fat: #FFC83D;
    --amberSoft: rgba(255,200,61,.14); --sageSoft: rgba(57,242,143,.14); --semAmbar: #FFC83D;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #F1F7FF; --surface: #FFFFFF; --surfaceRaised: #E9F1FC; --line: #D7E4F6;
    --text: #071D3B; --textDim: #48607F; --track: #E3ECFA; --tick: #B9CDEB;
    --acento: #0B5FFF; --acentoInk: #FFFFFF; --acentoSoft: rgba(11,95,255,.10); --acentoSombra: 0 10px 22px rgba(11,95,255,.30);
    --ok: #0A7A41; --okInk: #FFFFFF;
    --bien: #0C9A52; --bienTexto: #0A7A41; --bienSuave: #E3F7EC;
    --ojo: #FFC21A; --ojoTexto: #8A5300; --ojoSuave: #FFF4D6;
    --rojo: #B42318; --rojoTexto: #B42318; --rojoSuave: #FDE7E7;
    --falta: #0B5FFF; --faltaTexto: #0B4FD6; --faltaSuave: #E3ECFF;
    --neutro: #2C4A73; --punta: #FFFFFF; --puntaOjo: #071D3B;
    --heroSombra: 0 10px 30px rgba(11,95,255,.10); --panelSombra: 0 10px 30px rgba(11,95,255,.10);
    --navBg: #FFFFFF; --fab: #0C9A52; --fabInk: #FFFFFF; --fabSombra: 0 10px 22px rgba(12,154,82,.35);
    --glowBien: none; --glowOjo: none; --glowRojo: none;
    --brillo: 0; --gastoBase: rgba(11,95,255,.30); --velo: rgba(7,29,59,.45);
    --amber: #8A5300; --sage: #0A7A41; --rust: #B42318; --meta: #0B5FFF; --cheat: #8E3FB8;
    --protein: #0B5FFF; --carbs: #2C4A73; --fat: #8A5300;
    --amberSoft: #FFF4D6; --sageSoft: #E3F7EC; --semAmbar: #C28A1C;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body, #root { background: var(--bg); color: var(--text); font-family: Outfit, -apple-system, 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; }
  body { transition: background-color .3s ease, color .3s ease; }
  #root { padding: calc(22px + env(safe-area-inset-top, 0px)) 20px calc(118px + env(safe-area-inset-bottom, 0px)); min-height: 100vh; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; -webkit-tap-highlight-color: transparent; }
  input, textarea, select {
    font-family: inherit; background: var(--surfaceRaised); border: 1px solid var(--line);
    color: var(--text); border-radius: 12px; padding: 11px 12px; font-size: 16px; width: 100%; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--acento); }
  input::placeholder, textarea::placeholder { color: var(--textDim); opacity: .75; }
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  @keyframes popIn { 0% { transform: scale(.92); opacity: 0; } 60% { transform: scale(1.02); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-70px) scale(1.35); opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes llenar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes anillo { from { stroke-dashoffset: var(--total); } }
  @keyframes subir { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
  @keyframes hoja { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  .celebrate { animation: popIn .45s ease-out; }
  .confetti-piece { position: absolute; font-size: 20px; animation: floatUp 1.1s ease-out forwards; pointer-events: none; }
  .spin { animation: spin 1s linear infinite; display: inline-block; }
  /* Las animaciones de carga solo corren la primera vez que se dibuja una pantalla
     (la clase .anim la pone render), no cada vez que tocás algo. */
  .anim .p-arco { animation: anillo 1.2s cubic-bezier(.2,.8,.2,1) both; }
  .anim .llena { transform-origin: left center; animation: llenar .9s cubic-bezier(.2,.8,.2,1) both; }
  .anim .sube { animation: subir .6s cubic-bezier(.2,.8,.2,1) both; }
  .anim .aparece { animation: aparecer .3s ease-out both; }
  .p-hoja { animation: hoja .28s cubic-bezier(.2,.8,.2,1) both; }
  @media (prefers-reduced-motion: reduce) { .anim .p-arco, .anim .llena, .anim .sube, .anim .aparece, .p-hoja, .celebrate { animation: none; } }

  /* ---------- piezas de siempre (Historial, Ajustes, bienvenida) ---------- */
  .wrap { max-width: 620px; margin: 0 auto; }
  .screen { max-width: 620px; margin: 0 auto; }
  .card { background: var(--surface); border: 1px solid transparent; border-radius: 24px; padding: 18px; margin-bottom: 16px; box-shadow: var(--panelSombra); }
  .row { display: flex; }
  .col { display: flex; flex-direction: column; }
  .gap6 { gap: 6px; } .gap8 { gap: 8px; } .gap10 { gap: 10px; } .gap12 { gap: 12px; } .gap14 { gap: 14px; } .gap20 { gap: 20px; } .gap24 { gap: 24px; }
  .dim { color: var(--textDim); }
  .small { font-size: 13px; }
  .xs { font-size: 12px; }
  .title { font-size: 17px; font-weight: 800; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .label { font-size: 12px; font-weight: 600; color: var(--textDim); display: block; margin-bottom: 5px; }
  .btn-primary { background: var(--acento); color: var(--acentoInk); border-radius: 999px; min-height: 46px; padding: 0 20px; font-weight: 800; font-size: 15px; box-shadow: var(--acentoSombra); }
  .btn-primary:disabled { background: var(--line); color: var(--textDim); box-shadow: none; }
  .btn-secondary { background: transparent; border: 1px solid var(--line); color: var(--text); border-radius: 999px; min-height: 44px; padding: 0 16px; font-size: 14px; font-weight: 600; }
  .btn-sage { background: var(--ok); color: var(--okInk); border-radius: 999px; min-height: 44px; padding: 0 18px; font-weight: 800; font-size: 14px; }
  .btn-ghost { background: transparent; color: var(--textDim); min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
  .btn-danger { background: transparent; border: 1px solid var(--rojoTexto); color: var(--rojoTexto); border-radius: 999px; min-height: 44px; padding: 0 16px; font-size: 14px; font-weight: 800; }
  .btn-sage:disabled, .btn-secondary:disabled { opacity: .5; }
  .stat-label { font-size: 12px; color: var(--textDim); font-weight: 600; }
  .stat-value { font-size: 17px; font-weight: 800; }
  .topbar { display: flex; justify-content: space-between; align-items: center; min-height: 44px; margin-bottom: 12px; }
  .icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: -10px; }
  .track { height: 8px; background: var(--track); border-radius: 999px; overflow: hidden; }
  .track > i { display: block; height: 100%; border-radius: 999px; transition: width .35s ease; }
  .chip { background: var(--surfaceRaised); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .chip.dim { color: var(--textDim); }
  .chip-btn { cursor: pointer; min-height: 40px; }
  .chip.cheat-on { border-color: var(--cheat); color: var(--cheat); }
  .badge-pill { background: var(--surfaceRaised); border-radius: 999px; padding: 6px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .sq { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: 0; }
  .dash { width: 14px; height: 2px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: 3px; }
  .big-btn { min-height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; }
  .section-title { font-size: 15px; font-weight: 800; color: var(--textDim); margin: 22px 0 10px; }
  .divider { height: 1px; background: var(--line); margin: 16px 0; }
  .pill-cheat { color: var(--cheat); border: 1px solid var(--cheat); border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 700; margin-left: 4px; vertical-align: 1px; }
  .mini-btn { border: 1px dashed var(--line); color: var(--text); border-radius: 999px; min-height: 40px; padding: 0 14px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .link-btn { font-size: 14px; font-weight: 700; color: var(--text); text-decoration: underline; text-underline-offset: 3px; min-height: 44px; }
  .hero-label { font-size: 13px; font-weight: 700; color: var(--textDim); display: flex; align-items: center; gap: 6px; }
  .stat-mini { font-size: 12px; color: var(--textDim); }
  .stat-mini + div { font-size: 18px; font-weight: 800; margin-top: 2px; }
  .tile { background: var(--surfaceRaised); border-radius: 14px; padding: 10px 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  .back-btn { display: flex; align-items: center; gap: 4px; margin-left: -8px; min-height: 44px; }
  .pie { text-align: center; font-size: 12px; color: var(--textDim); padding: 18px 0 4px; }
  .veredicto { margin-top: 14px; background: var(--surfaceRaised); border-radius: 16px; padding: 12px 14px; font-size: 14px; line-height: 1.45; }
  .separador { display: flex; align-items: center; gap: 10px; margin: 16px 0; font-size: 13px; color: var(--textDim); }
  .separador::before, .separador::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .nube-icono { width: 38px; height: 38px; border-radius: 50%; background: var(--bienSuave); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .opcion-chip { min-height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: none; color: var(--text); font-size: 14px; font-weight: 600; }
  .opcion-chip.on { border: 2px solid var(--acento); background: var(--acentoSoft); color: var(--acento); font-weight: 800; }
  .codigo { flex: 1; min-width: 0; background: var(--surfaceRaised); border: 1px solid var(--line); border-radius: 14px; padding: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 18px; font-weight: 700; letter-spacing: 1px; text-align: center; }
  .dia-abierto .p-fila-comida { background: var(--bg); }

  /* ---------- barra de abajo ---------- */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    height: calc(84px + env(safe-area-inset-bottom, 0px));
    background: var(--navBg); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; padding-top: 10px;
  }
  .nav > button { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 50px; justify-content: center; font-size: 12px; font-weight: 500; color: var(--textDim); }
  .nav > button.on { color: var(--text); font-weight: 800; }
  .nav .cap { width: 58px; height: 58px; border-radius: 50%; background: var(--fab); border: 4px solid var(--bg); display: flex; align-items: center; justify-content: center; margin-top: -24px; box-shadow: var(--fabSombra); }

  /* ---------- hojas ---------- */
  .sheet-backdrop { position: fixed; inset: 0; background: var(--velo); z-index: 70; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 71; max-width: 620px; margin: 0 auto;
    background: var(--surface); border-radius: 28px 28px 0 0;
    padding: 10px 20px calc(26px + env(safe-area-inset-bottom, 0px));
    max-height: 92vh; overflow-y: auto; box-shadow: 0 -18px 40px rgba(0,0,0,.35);
  }
  .grab { width: 40px; height: 5px; border-radius: 999px; background: var(--line); margin: 0 auto 14px; }

  /* ---------- Pulso ---------- */
  .p-pantalla { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .p-cabeza { display: flex; justify-content: space-between; align-items: center; }
  .p-dia { font-size: 24px; font-weight: 800; letter-spacing: -.5px; line-height: 1.05; }
  .p-sub { font-size: 13px; font-weight: 500; color: var(--textDim); margin-top: 3px; }
  .p-titulo { font-size: 28px; font-weight: 800; letter-spacing: -.6px; }
  .p-hora { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--surfaceRaised); font-size: 13px; font-weight: 700; }
  .p-tarjeta { background: var(--surface); border-radius: 24px; padding: 14px 16px; box-shadow: var(--panelSombra); }
  .p-heroe { position: relative; background: var(--surface); border-radius: 28px; padding: 16px 18px; box-shadow: var(--heroSombra); }
  .p-etiqueta { font-size: 15px; font-weight: 700; text-align: center; text-wrap: balance; padding: 0 58px; }
  .p-num { font-weight: 800; font-size: 72px; line-height: .95; letter-spacing: -2.5px; }
  .p-num.chico { font-size: 62px; }
  .p-mas { font-size: .55em; vertical-align: .42em; margin-right: 2px; }
  .p-linea { font-size: 14px; font-weight: 600; text-align: center; }
  .p-botones { display: flex; justify-content: center; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin-top: 8px; }
  .p-boton { min-height: 46px; padding: 0 20px; border-radius: 999px; background: var(--acento); color: var(--acentoInk); font-size: 15px; font-weight: 800; box-shadow: var(--acentoSombra); }
  .p-subrayado { min-height: 44px; padding: 0; color: var(--text); font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  .p-alivio { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 14px; border-radius: 999px; background: var(--bienSuave); color: var(--bienTexto); font-size: 14px; font-weight: 700; }
  .p-explica { margin-top: 12px; background: var(--surfaceRaised); border-radius: 18px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
  .p-cab { display: flex; align-items: center; gap: 8px; min-height: 28px; }
  .p-cab-titulo { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; white-space: nowrap; }
  .p-cab-resumen { flex: 1; min-width: 0; text-align: right; font-size: 13px; font-weight: 600; color: var(--textDim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-flecha { width: 44px; height: 44px; margin: -8px -10px -8px -2px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .p-flecha svg { transition: transform .2s ease; }
  .p-flecha[aria-expanded="true"] svg { transform: rotate(180deg); }
  .p-heroe .p-flecha-esq { position: absolute; right: 14px; top: 14px; display: inline-flex; align-items: center; }
  .p-barra { position: relative; height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; }
  .p-barra > i { display: block; height: 100%; border-radius: 999px; background: currentColor; }
  [data-theme="dark"] .p-barra > i { box-shadow: 0 0 12px currentColor; }
  .p-barra > b { position: absolute; left: 2px; top: 2px; bottom: 2px; border-radius: 999px; background: var(--ojo); min-width: 10px; }
  [data-theme="dark"] .p-barra > b { box-shadow: 0 0 8px rgba(255,200,61,.85); }
  .p-chip-n { display: inline-flex; flex-direction: column; gap: 1px; padding: 8px 12px; border-radius: 14px; border: 2px solid; font-size: 12px; }
  .p-chip-n b { font-size: 13px; }
  .p-etq { align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .p-etq i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .p-fila-comida { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 0; color: var(--text); text-align: left; }
  .p-fila-comida .p-hilo { position: absolute; left: 21px; top: 52px; bottom: -10px; width: 2px; border-radius: 2px; background: var(--line); }
  .p-aro { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
  .p-aro > span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .p-mas-pend { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 2px dashed var(--acento); display: flex; align-items: center; justify-content: center; }
  .p-pie-comidas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .p-editar-inicio { align-self: center; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; font-weight: 700; }

  /* la barra del gasto */
  .p-gasto-num { display: flex; align-items: baseline; gap: 5px; min-height: 44px; padding: 0 10px; margin-left: auto; border-radius: 12px; border: 1px solid var(--line); }
  .p-gasto-num b { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
  .p-gasto-num.vivo { border: 2px solid var(--acento); color: var(--acento); }
  .p-redondo { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: var(--surfaceRaised); display: flex; align-items: center; justify-content: center; }
  .p-riel { position: relative; flex: 1; min-width: 0; height: 44px; }
  .p-riel .fondo { position: absolute; left: 0; right: 0; top: 15px; height: 14px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .p-riel .fondo > i { position: absolute; top: 0; bottom: 0; }
  .p-riel .tope-base { position: absolute; top: 11px; width: 2px; height: 22px; border-radius: 2px; background: var(--text); opacity: .55; pointer-events: none; }
  .p-riel input[type=range] { position: absolute; inset: 0; width: 100%; height: 44px; margin: 0; padding: 0; background: transparent; border: none; -webkit-appearance: none; appearance: none; cursor: pointer; touch-action: pan-y; }
  .p-riel input[type=range]::-webkit-slider-runnable-track { height: 44px; background: transparent; border: none; }
  .p-riel input[type=range]::-moz-range-track { height: 44px; background: transparent; border: none; }
  .p-riel input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: 9px; border-radius: 50%; background: #FFFFFF; border: none; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .p-riel input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; border: none; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .p-riel input[type=range]:active::-webkit-slider-thumb { box-shadow: 0 2px 10px rgba(0,0,0,.35), 0 0 0 6px var(--acentoSoft); }

<body>
<div id="root"></div>
<script>
(function () {
  "use strict";
  // Polyfill de almacenamiento: misma interfaz que window.storage de Claude.ai,
  // pero usando localStorage del navegador (persiste en este dispositivo/navegador).
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem("deficit_" + key);
      if (raw === null) return null;
      return { key, value: raw };
    },
    async set(key, value) {
      localStorage.setItem("deficit_" + key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem("deficit_" + key);

  const N = window.Nutrientes;
  const KCAL_PER_KG = 7700;
  const APP_VERSION = "v19-html · Pulso: anillo, gasto en Hoy, ejercicio, nutrientes e inicio a tu gusto";
  const DEFAULT_GOAL = { currentWeight: null, goalWeight: null, goalDate: "", maintenance: 2200, height: null, age: null, gender: "male", onboarded: false, surplusAlertThreshold: 300, theme: "dark", tema: "auto", inicio: null, ejercicios: [], proteinTarget: null, dieta: "equilibrada", comidas: ["Desayuno", "Almuerzo", "Merienda", "Cena"] };

  let meals = [];
  let dayMeta = {};
  let goal = { ...DEFAULT_GOAL };
  let weighIns = [];
  let loading = true;

  // UI-only state
  let activeTab = "hoy";          // hoy | dieta | historial | progreso | ajustes
  let showCapture = false;        // hoja inferior para cargar una comida
  // El textarea se destruye en cada render (reconstruimos innerHTML entero), así
  // que guardamos lo tipeado acá antes de redibujar. Sin esto, adjuntar una foto
  // borraba el dictado a medio escribir.
  let dictationDraft = "";
  let calibrationDismissed = null; // gasto base sugerido que ya postergaste
  let onboardError = "";           // errores de validación en la bienvenida
  let ajustesMsg = null;           // {tipo: "error"|"ok", texto} al recalcular
  let expanded = true;
  let expandedDays = {};
  let showSettings = false;
  let analyzing = false;
  let parsed = null;
  let errorMsg = "";
  let photo = null; // {dataUrl, mediaType}
  let importMsg = "";
  let onboardForm = null;
  let gapChoiceMade = false;
  let editingMealId = null;
  let editingDayMeta = null;
  let editingWeighInId = null;
  let showCloseDayConfirm = false;
  let justClosedCelebration = false;
  let showResetConfirm = false;
  let captureDate = null;          // día al que va la comida que se está cargando (null = hoy)
  let showParsedDetail = false;    // vitaminas y minerales en el resultado del análisis
  let showDayNutrients = false;    // ídem en la tarjeta de hoy
  let showAvgNutrients = false;    // ídem en el promedio de Progreso
  let nutrDaysOpen = {};           // ídem por día en Historial
  let openMealDetail = null;       // comida (de Hoy o del Historial) con su detalle a la vista
  let mealNutrOpen = false;        // vitaminas y minerales de esa comida, en Hoy
  let confirmDeleteMealId = null;  // comida con el "¿Borrar?" a la vista

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
  function addDaysISO(iso, n) { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
  function daysBetween(a, b) { return Math.max(1, Math.round((new Date(b) - new Date(a)) / 86400000)); }
  function formatDate(iso) {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" });
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function calcMaintenance({ weight, height, age, gender }) {
    const bmr = gender === "female" ? 10 * weight + 6.25 * height - 5 * age - 161 : 10 * weight + 6.25 * height - 5 * age + 5;
    return Math.round(bmr * 1.2);
  }

  // ---------- validación de los datos personales ----------
  //
  // La fórmula de arriba es lineal y no tiene forma de saber si le están dando
  // basura: se traga cualquier número y devuelve algo. Sin estas guardas, tres
  // errores de carga muy comunes producían datos inservibles sin un solo aviso:
  //
  //   1. Altura en metros (1,75) en vez de centímetros (175). El término
  //      6,25 × altura aporta 11 kcal en lugar de 1.094, y el gasto base queda
  //      en ~830 kcal/día. Le pasó a un usuario real.
  //   2. Año de nacimiento (1998) en el campo de edad: el gasto base da
  //      NEGATIVO (-9.709 kcal/día) y todos los balances quedan invertidos.
  //   3. Coma decimal en un input type="number": el navegador devuelve string
  //      vacío, toNumber lo convierte en 0, y ese 0 se guardaba en silencio.
  //
  // El piso y el techo del gasto base son la última red: applyCalibration ya
  // tenía Math.max(1200, ...), pero el camino de la fórmula no tenía nada.
  const LIMITES = {
    peso: { min: 30, max: 300, texto: "El peso tiene que estar entre 30 y 300 kg." },
    altura: { min: 120, max: 230, texto: "La altura tiene que estar entre 120 y 230 cm." },
    edad: { min: 14, max: 100, texto: "La edad tiene que estar entre 14 y 100 años." },
  };
  const GASTO_MIN = 1000;
  const GASTO_MAX = 4500;

  // Nadie mide 1,75 cm. Si el número es menor a 3, vino en metros: lo pasamos a
  // centímetros en vez de rechazarlo, que es lo que la persona quiso decir.
  function alturaACm(v) {
    const n = toNumber(v);
    return n > 0 && n < 3 ? Math.round(n * 100) : n;
  }

  function validarPersonales({ peso, altura, edad }) {
    const errores = [];
    if (!(peso >= LIMITES.peso.min && peso <= LIMITES.peso.max)) errores.push(LIMITES.peso.texto);
    if (!(altura >= LIMITES.altura.min && altura <= LIMITES.altura.max)) errores.push(LIMITES.altura.texto);
    if (!(edad >= LIMITES.edad.min && edad <= LIMITES.edad.max)) errores.push(LIMITES.edad.texto);
    return errores;
  }

  function gastoPlausible(v) {
    return typeof v === "number" && isFinite(v) && v >= GASTO_MIN && v <= GASTO_MAX;
  }

  // 1.8 g de proteína por kg de peso actual: rango razonable para preservar músculo en déficit.
  function calcProteinTarget(weight) { return Math.round((weight || 0) * 1.8); }
  function macroInline(p, c, f) {
    return `P ${Math.round(p)}, C ${Math.round(c)}, G ${Math.round(f)} g`;
  }
  // ---------- valoración nutricional de la comida (1-10 + comentario, generada por la IA) ----------
  function nutritionColor(score) {
    const pct = Math.max(0, Math.min(100, ((score - 1) / 9) * 100));
    return getProgressColor(pct);
  }
  function nutritionBadge(score, comment) {
    if (score == null) return "";
    return `<div class="small row gap8" style="align-items:center;margin-top:10px;">
      <span style="background:${nutritionColor(score)};color:#fff;border-radius:999px;padding:2px 10px;font-weight:700;font-size:12px;flex-shrink:0;">${score}/10</span>
      <span class="dim">${esc(comment || "")}</span>
    </div>`;
  }

  // ---------- números con coma o punto (formato AR) ----------
  function toNumber(v) {
    if (v == null) return 0;
    const n = parseFloat(String(v).trim().replace(",", "."));
    return isNaN(n) ? 0 : n;
  }

  // ---------- color según cercanía al objetivo (rojo -> amarillo -> verde) ----------
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function hexToRgb(hex) {
    const h = hex.replace("#", "");
    return [parseInt(h.substring(0, 2), 16), parseInt(h.substring(2, 4), 16), parseInt(h.substring(4, 6), 16)];
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function lerpColor(c1, c2, t) { return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)]; }
  function getProgressColor(pct) {
    const rust = hexToRgb(cssVar("--rust")), amber = hexToRgb(cssVar("--amber")), sage = hexToRgb(cssVar("--sage"));
    const c = pct <= 50 ? lerpColor(rust, amber, Math.max(0, pct) / 50) : lerpColor(amber, sage, Math.min(100, pct - 50) / 50);
    return `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  }

  // ---------- balance del día: verde y signo menos = déficit, amarillo/rojo y signo más = superávit ----------
  function formatBalance(net) {
    const threshold = goal.surplusAlertThreshold || 300;
    if (net >= 0) return { text: "-" + Math.round(net).toLocaleString("es-AR") + " kcal", color: "var(--sage)" };
    const surplus = Math.abs(net);
    return { text: "+" + Math.round(surplus).toLocaleString("es-AR") + " kcal", color: surplus <= threshold ? "var(--amber)" : "var(--rust)" };
  }
  // Un día cheat es un permiso que te diste, no un error: el número es el
  // mismo, pero va con su color en vez del rojo de alarma.
  function balanceDe(net, cheat) {
    const b = formatBalance(net);
    return cheat ? { text: b.text, color: "var(--cheat)" } : b;
  }
  function dayCloseMessage(day) {
    const net = day.net;
    if (day.cheat) {
      return `Día cheat cerrado: ${net >= 0 ? "-" : "+"}${Math.round(Math.abs(net)).toLocaleString("es-AR")} kcal. No corta tu racha, y las calorías igual cuentan para el total. Mañana seguimos.`;
    }
    if (net >= 0) {
      const kg = net / KCAL_PER_KG;
      return `&#127881; ¡Felicitaciones, seguís así! Hoy restaste ${Math.round(net).toLocaleString("es-AR")} kcal (&asymp; ${kg.toFixed(2)} kg) de tu objetivo.`;
    }
    const surplus = Math.abs(net);
    const threshold = goal.surplusAlertThreshold || 300;
    if (surplus <= threshold) return `Hoy hubo un pequeño superávit de ${Math.round(surplus).toLocaleString("es-AR")} kcal. No pasa nada, mañana seguimos sumando déficit.`;
    return `Hoy el balance dio +${Math.round(surplus).toLocaleString("es-AR")} kcal de superávit. Es solo un día — lo que importa es la tendencia general. Mañana retomamos.`;
  }
  function confettiMarkup() {
    const emojis = ["&#127881;", "&#10024;", "&#128293;", "&#128170;", "&#11088;"];
    let out = "";
    for (let i = 0; i < 10; i++) {
      const left = 5 + ((i * 9) % 90);
      const delay = (i % 5) * 0.08;
      out += `<span class="confetti-piece" style="left:${left}%;bottom:10px;animation-delay:${delay}s;">${emojis[i % emojis.length]}</span>`;
    }
    return out;
  }

  // ---------- racha de déficit e insignias ----------
  // Un día cheat ni suma ni corta: la racha lo saltea, siempre que los días
  // sigan siendo consecutivos. Las calorías de ese día sí cuentan en el total
  // de déficit, porque al cuerpo no le importa cómo lo llamaste.
  function computeDeficitStreak(settledDescending) {
    let streak = 0, prevDate = null;
    for (const d of settledDescending) {
      if (prevDate !== null && addDaysISO(prevDate, -1) !== d.date) break;
      prevDate = d.date;
      if (d.cheat) continue;
      if (d.net < 0) break;
      streak++;
    }
    return streak;
  }
  function computeBadges({ streak, kgLost, pct }) {
    const badges = [];
    const streakTiers = [[30, "&#127942;", "Racha de 30 días"], [14, "&#128293;&#128293;&#128293;", "Racha de 14 días"], [7, "&#128293;&#128293;", "Racha de 7 días"], [3, "&#128293;", "Racha de 3 días"]];
    for (const [n, icon, label] of streakTiers) { if (streak >= n) { badges.push({ icon, label }); break; } }
    const kgTiers = [[10, "&#128142;", "-10 kg quemados"], [5, "&#11088;", "-5 kg quemados"], [2, "&#10024;", "-2 kg quemados"]];
    for (const [n, icon, label] of kgTiers) { if (kgLost >= n) { badges.push({ icon, label }); break; } }
    if (pct >= 100) badges.push({ icon: "&#127919;", label: "¡Objetivo cumplido!" });
    return badges;
  }

  function computeDayStats() {
    const byDate = {};
    meals.forEach((m) => {
      if (!byDate[m.date]) byDate[m.date] = { date: m.date, consumed: 0, protein: 0, carbs: 0, fat: 0, meals: [] };
      byDate[m.date].consumed += m.consumed;
      byDate[m.date].protein += m.protein;
      byDate[m.date].carbs += m.carbs;
      byDate[m.date].fat += m.fat;
      byDate[m.date].meals.push(m);
    });
    return Object.values(byDate)
      .map((day) => {
        const meta = dayMeta[day.date] || {};
        const gasto = gastoInfo(day.date).total;
        return {
          ...day,
          gasto,
          usedAppTotal: meta.totalExpenditure != null,

          cheat: !!meta.cheat,

      .sort((a, b) => (a.date < b.date ? 1 : -1));
  }

  // ---------- micro y macronutrientes (v15) ----------
  //
  // Cada comida nueva trae `nutrientes`: el detalle (azúcares, fibra, tipos de
  // grasa, vitaminas, minerales). Las kcal y los tres macros de siempre siguen
  // en consumed/protein/carbs/fat, que es lo que editás desde Historial, así
  // que el objeto completo se arma al vuelo y nunca queda desfasado.
  function refsNutrientes() {
    const r = N.referencias(goal.age, goal.gender === "female" ? "femenino" : "masculino");
    // La proteína de esta app es tu meta para cuidar músculo en déficit
    // (Ajustes), no el mínimo general de 46/56 g.
    r.proteinas_g = goal.proteinTarget || calcProteinTarget(goal.currentWeight);
    return r;
  }
  // Las comidas cargadas antes de v15 (y los días completados solos) no tienen
  // detalle: sus vitaminas cuentan como 0, y se avisa cuántas son.
  function nutrientesDeComidas(lista) {
    const conDetalle = lista.filter((m) => m.nutrientes);
    const n = N.sumar(conDetalle.map((m) => m.nutrientes));
    n.kcal = lista.reduce((s, m) => s + m.consumed, 0);
    n.proteinas_g = lista.reduce((s, m) => s + m.protein, 0);
    n.carbohidratos_g = lista.reduce((s, m) => s + m.carbs, 0);
    n.grasas_g = lista.reduce((s, m) => s + m.fat, 0);
    return { n, sinDetalle: lista.length - conDetalle.length };
  }
  function nutrientesDeComida(m) {
    return { ...N.limpiar(m.nutrientes), kcal: m.consumed, proteinas_g: m.protein, carbohidratos_g: m.carbs, grasas_g: m.fat };
  }

  // Bloque de nutrientes plegable: cerrado muestra los cuatro que más importan
  // en un déficit (fibra que llena, azúcares, sodio que retiene líquido y
  // grasas saturadas); abierto, la tabla completa contra lo recomendado.
  function bloqueNutrientes(n, sinDetalle, abierto, accion) {
    const refs = refsNutrientes();
    const chip = (k, nombre) => {
      const d = N.NUTRIENTES.find((x) => x.k === k);
      return `<span class="chip dim">${nombre} <span style="color:var(--text);font-weight:700;">${N.fmt(n[k])} ${N.unidad(d.u)}</span></span>`;
    };
    let h = `<div class="row gap8" style="flex-wrap:wrap;">
      ${chip("fibra_g", "Fibra")}${chip("azucares_g", "Azúcares")}${chip("sodio_mg", "Sodio")}${chip("grasas_saturadas_g", "Saturadas")}
    </div>`;
    if (sinDetalle > 0) {
      h += `<div class="xs dim" style="margin-top:10px;">${sinDetalle} comida${sinDetalle !== 1 ? "s" : ""} sin detalle (cargada${sinDetalle !== 1 ? "s" : ""} antes de esta versión o completada${sinDetalle !== 1 ? "s" : ""} sola${sinDetalle !== 1 ? "s" : ""}): las vitaminas y minerales pueden dar de menos.</div>`;
    }
    h += `<button class="btn-secondary" style="width:100%;margin-top:12px;" onclick="${accion}">${abierto ? "Ocultar" : "Ver"} macro y micronutrientes</button>`;
    if (abierto) {
      h += N.seccionesPlanas(n, refs);
      h += `<div class="xs dim" style="margin-top:12px;line-height:1.45;">${esc(N.notaReferencias(goal.age, goal.gender === "female" ? "femenino" : "masculino"))} La proteína se compara con tu meta de Ajustes.</div>`;
    }
    return h;
  }

  // ---------- storage ----------
  async function loadAll() {
    try {
      const [m, dm, g, w, fr] = await Promise.all([
        window.storage.get("meals").catch(() => null),
        window.storage.get("dayMeta").catch(() => null),
        window.storage.get("goal").catch(() => null),
        window.storage.get("weighIns").catch(() => null),

  // ---------- photo ----------
  // Una foto de iPhone sin tocar son ~2.450 tokens de entrada; redimensionada a
  // 1024px son ~1.050. Para estimar un plato no se pierde nada útil, y es el
  // ahorro más grande del costo por análisis. Además, al re-codificar en canvas
  // la salida siempre queda en JPEG: eso normaliza de paso los HEIC del iPhone,
  // que la API no acepta.
  const PHOTO_MAX_SIDE = 1024;
  const PHOTO_JPEG_QUALITY = 0.85;

  function redimensionarFoto(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("No se pudo leer el archivo"));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("No se pudo abrir la imagen"));
        img.onload = () => {
          const escala = Math.min(1, PHOTO_MAX_SIDE / Math.max(img.width, img.height));
          const w = Math.round(img.width * escala);
          const h = Math.round(img.height * escala);
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          // Fondo blanco: si el original tiene transparencia, el JPEG la
          // rellenaría de negro y confundiría la estimación.
          ctx.fillStyle = "#FFFFFF";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve({ dataUrl: canvas.toDataURL("image/jpeg", PHOTO_JPEG_QUALITY), mediaType: "image/jpeg" });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

    weighIns = [...filtered, { id: uid(), date, weight: w }].sort((a, b) => (a.date < b.date ? -1 : 1));
    persistWeighIns();
    render();
  };
  window.removeWeighIn = function (id) { weighIns = weighIns.filter((w) => w.id !== id); persistWeighIns(); render(); };
  window.startEditWeighIn = function (id) { editingWeighInId = id; render(); };
  window.cancelEditWeighIn = function () { editingWeighInId = null; render(); };

    if (!val || val <= 0) return;

  };

  window.fillGapDays = function (mode, missingDatesJson, avgJson) {
    const missingDates = JSON.parse(missingDatesJson);
    const avg = JSON.parse(avgJson);
    const newMeals = [];
    const nextMeta = { ...dayMeta };
    missingDates.forEach((date) => {
      if (mode === "neutral") {
        newMeals.push({ id: uid(), date, consumed: goal.maintenance, protein: 0, carbs: 0, fat: 0, note: "Día completado automáticamente (neutro)", createdAt: Date.now() });
        nextMeta[date] = { totalExpenditure: goal.maintenance, exerciseKcal: 0 };
      } else {
        newMeals.push({ id: uid(), date, consumed: avg.consumed, protein: avg.protein, carbs: avg.carbs, fat: avg.fat, note: "Día completado automáticamente (con tu promedio habitual)", createdAt: Date.now() });
        nextMeta[date] = { totalExpenditure: avg.gasto, exerciseKcal: 0 };
      }
    });
    meals = [...newMeals, ...meals]; persistMeals();
    dayMeta = nextMeta; persistDayMeta();
    gapChoiceMade = true;
    render();

  // ---------- gráfico de peso: real contra plan ----------
  function weightChartSVG() {
    const ws = weighIns.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
    if (ws.length < 2) {
      return `<div class="small dim" style="padding:18px 0;">Cargá al menos dos pesajes para ver la curva y comparar tu bajada real contra el plan.</div>`;
    }
    const W = 300, H = 132;
    const inicio = ws[0], fin = ws[ws.length - 1];
    const span = Math.max(1, dayDiff(inicio.date, fin.date));

    // El plan se ancla en tu primer pesaje y baja en línea recta hasta el peso
    // objetivo en la fecha objetivo. Así no depende de goal.currentWeight, que
    // vas editando, y la comparación se mantiene estable.
    const planDias = goal.goalDate && dayDiff(inicio.date, goal.goalDate) > 0 ? dayDiff(inicio.date, goal.goalDate) : null;
    const planEn = (iso) => {
      if (!planDias) return null;
      const t = Math.min(1, Math.max(0, dayDiff(inicio.date, iso) / planDias));
      return inicio.weight + (goal.goalWeight - inicio.weight) * t;
    };
    const planFin = planEn(fin.date);

    const valores = ws.map((w) => w.weight).concat(planFin != null ? [planFin] : []);
    let min = Math.min.apply(null, valores), max = Math.max.apply(null, valores);
    const pad = Math.max(0.4, (max - min) * 0.2);
    min -= pad; max += pad;
    const rango = max - min || 1;
    const X = (iso) => (dayDiff(inicio.date, iso) / span) * W;
    const Y = (v) => H - ((v - min) / rango) * H;

    const puntos = ws.map((w) => `${X(w.date).toFixed(1)},${Y(w.weight).toFixed(1)}`).join(" ");
    const circulos = ws.map((w, i) =>
      i === ws.length - 1
        ? `<circle cx="${X(w.date).toFixed(1)}" cy="${Y(w.weight).toFixed(1)}" r="5" fill="var(--acento)"></circle>`
        : `<circle cx="${X(w.date).toFixed(1)}" cy="${Y(w.weight).toFixed(1)}" r="3.5" fill="var(--surface)" stroke="var(--acento)" stroke-width="2"></circle>`
    ).join("");

    const lineaPlan = planFin != null
      ? `<line x1="0" y1="${Y(inicio.weight).toFixed(1)}" x2="${W}" y2="${Y(planFin).toFixed(1)}" stroke="var(--textDim)" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round" opacity=".55"></line>`
      : "";

    return `<svg width="100%" viewBox="0 0 ${W} ${H + 24}" style="display:block;overflow:visible;">
      <line x1="0" y1="4" x2="${W}" y2="4" stroke="var(--line)" stroke-width="1"></line>
      <line x1="0" y1="${(H / 2).toFixed(0)}" x2="${W}" y2="${(H / 2).toFixed(0)}" stroke="var(--line)" stroke-width="1"></line>
      <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--line)" stroke-width="1"></line>
      ${lineaPlan}
      <polyline points="${puntos}" fill="none" stroke="var(--acento)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
      ${circulos}
      <text x="0" y="${H + 18}" fill="var(--textDim)" font-size="10" font-family="Outfit, -apple-system, Helvetica Neue, Arial, sans-serif">${formatDate(inicio.date)}</text>
      <text x="${W}" y="${H + 18}" text-anchor="end" fill="var(--textDim)" font-size="10" font-family="Outfit, -apple-system, Helvetica Neue, Arial, sans-serif">${formatDate(fin.date)}</text>
    </svg>`;
  }

  // ---------- datos compartidos por todas las pantallas ----------
  function computeCtx() {
    const dayStats = computeDayStats();
    const todayStr = todayISO();
    const todayStats = dayStats.find((d) => d.date === todayStr) || null;
    const todayClosed = !!(dayMeta[todayStr] && dayMeta[todayStr].closed);
    const settled = dayStats.filter((d) => !(d.date === todayStr && !d.closed));

    const totalKgToLose = Math.max(0, goal.currentWeight - goal.goalWeight);
    const goalKcal = totalKgToLose * KCAL_PER_KG;
    const totalDeficit = settled.reduce((s, d) => s + d.net, 0);
    const pct = goalKcal > 0 ? Math.min(100, Math.max(0, (totalDeficit / goalKcal) * 100)) : 0;
    const remaining = goalKcal - totalDeficit;
    const daysCount = dayStats.length;
    const kgLost = totalDeficit / KCAL_PER_KG;
    const daysLeft = daysBetween(todayISO(), goal.goalDate);
    const streak = computeDeficitStreak(settled);
    const badges = computeBadges({ streak, kgLost: Math.max(0, kgLost), pct });

    const avgConsumed = daysCount ? dayStats.reduce((s, d) => s + d.consumed, 0) / daysCount : 0;
    const avgProtein = daysCount ? dayStats.reduce((s, d) => s + d.protein, 0) / daysCount : 0;
    const avgCarbs = daysCount ? dayStats.reduce((s, d) => s + d.carbs, 0) / daysCount : 0;
    const avgFat = daysCount ? dayStats.reduce((s, d) => s + d.fat, 0) / daysCount : 0;
    const avgGasto = daysCount ? dayStats.reduce((s, d) => s + d.gasto, 0) / daysCount : goal.maintenance;
    const avgNet = daysCount ? totalDeficit / daysCount : 0;

    const proteinTarget = goal.proteinTarget || calcProteinTarget(goal.currentWeight);
    const todayProtein = todayStats ? todayStats.protein : 0;

    const wSorted = weighIns.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
    let calibration = null;
    const CALIBRATION_WINDOW_DAYS = 21;
    const recientes = wSorted.filter((w) => daysBetween(w.date, todayISO()) <= CALIBRATION_WINDOW_DAYS);
    if (recientes.length >= 2) {
      const first = recientes[0], last = recientes[recientes.length - 1];
      const days = daysBetween(first.date, last.date);
      if (days >= 5) {
        const actualKgLost = first.weight - last.weight;
        const actualKcalDeficit = actualKgLost * KCAL_PER_KG;
        const trackedKcalDeficit = dayStats.filter((d) => d.date >= first.date && d.date <= last.date).reduce((s, d) => s + d.net, 0);
        const discrepancyPerDay = (actualKcalDeficit - trackedKcalDeficit) / days;
        if (Math.abs(discrepancyPerDay) > 80) {
          const MAX_ADJUSTMENT_PER_STEP = 400;
          const MIN_MAINTENANCE = 1200;
          const capped = Math.max(-MAX_ADJUSTMENT_PER_STEP, Math.min(MAX_ADJUSTMENT_PER_STEP, discrepancyPerDay));
          const suggested = Math.max(MIN_MAINTENANCE, Math.round(goal.maintenance + capped));
          // Si ya postergaste exactamente esta sugerencia, no insistimos. Vuelve
          // a aparecer sola cuando un pesaje nuevo cambie el número.
          if (suggested !== calibrationDismissed) {
            calibration = { discrepancyPerDay, cappedAdjustment: capped, suggestedMaintenance: suggested, days, actualKgLost };
          }
        }
      }
    }

    let missingDates = [];
    if (dayStats.length > 0) {
      const sorted = dayStats.map((d) => d.date).sort();
      const lastDate = sorted[sorted.length - 1];
      const yesterday = addDaysISO(todayISO(), -1);
      if (lastDate < yesterday) {
        const existing = new Set(sorted);
        let cursor = addDaysISO(lastDate, 1), guard = 0;
        while (cursor <= yesterday && guard < 120) {
          if (!existing.has(cursor)) missingDates.push(cursor);
          cursor = addDaysISO(cursor, 1); guard++;
        }
      }
    }

    return {
      dayStats, todayStr, todayStats, todayClosed, settled, goalKcal, totalDeficit, pct,
      remaining, daysCount, kgLost, daysLeft, streak, badges,
      avgConsumed, avgProtein, avgCarbs, avgFat, avgGasto, avgNet,
      proteinTarget, todayProtein, wSorted, calibration, missingDates,
      showGapBanner: missingDates.length > 0 && !gapChoiceMade,
      avgForFill: { consumed: avgConsumed, protein: avgProtein, carbs: avgCarbs, fat: avgFat, gasto: avgGasto, net: avgNet },
    };
  }

  // ---------- piezas de Hoy (v16) ----------

  // es-AR agrupa también las cifras de cuatro dígitos (2.200); es-ES no, y por
  // eso la app mezclaba "2200" con "76.100".
  function kcal(v) { return Math.round(Number(v) || 0).toLocaleString("es-AR"); }

  // Déficit que te toca hoy para llegar a tu fecha. Sale de lo que faltaba
  // ANTES de hoy, así el número no se mueve mientras cargás comidas ni cuando
  // cerrás el día.
  function metaDiaria(c) {
    const antes = c.settled.filter((d) => d.date !== c.todayStr).reduce((s, d) => s + d.net, 0);
    const falta = c.goalKcal - antes;
    return falta > 0 ? falta / c.daysLeft : 0;
  }

  function formEditarComida(m) {
    return `<div style="display:flex;flex-direction:column;gap:10px">
      <div class="grid2">
        <div><label class="label" for="edit-meal-date-${m.id}">Fecha</label><input id="edit-meal-date-${m.id}" type="date" value="${m.date}"></div>
        <div><label class="label" for="edit-meal-consumed-${m.id}">Calorías (kcal)</label><input id="edit-meal-consumed-${m.id}" type="number" value="${Math.round(m.consumed)}"></div>
      </div>
      <div class="grid3">
        <div><label class="label" for="edit-meal-protein-${m.id}">Proteína (g)</label><input id="edit-meal-protein-${m.id}" type="number" value="${Math.round(m.protein)}"></div>
        <div><label class="label" for="edit-meal-carbs-${m.id}">Carbos (g)</label><input id="edit-meal-carbs-${m.id}" type="number" value="${Math.round(m.carbs)}"></div>
        <div><label class="label" for="edit-meal-fat-${m.id}">Grasas (g)</label><input id="edit-meal-fat-${m.id}" type="number" value="${Math.round(m.fat)}"></div>
      </div>
      <div><label class="label" for="edit-meal-momento-${m.id}">¿Qué comida fue?</label><select id="edit-meal-momento-${m.id}"><option value="">Según la hora</option>${COMIDAS_POSIBLES.map((x) => `<option value="${x}" ${m.momento === x ? "selected" : ""}>${x}</option>`).join("")}</select></div>
      <div><label class="label" for="edit-meal-note-${m.id}">Qué comiste</label><input id="edit-meal-note-${m.id}" type="text" value="${esc(m.note)}"></div>
      <div class="row gap8">
        <button class="btn-sage" style="flex:1" onclick="saveEditMeal('${m.id}')">Guardar</button>
        <button class="btn-secondary" onclick="cancelEditMeal()">Cancelar</button>
      </div>
    </div>`;
  }

  function confirmarBorrarHTML(m) {
    return `<div>
      <div class="small" style="font-weight:700;margin-bottom:4px;">¿Borrar esta comida?</div>
      <div class="xs dim" style="margin-bottom:12px;">Se restan ${kcal(m.consumed)} kcal de ese día. No se puede deshacer.</div>
      <div class="row gap10">
        <button class="btn-danger" style="flex:1;min-height:44px;" onclick="removeMeal('${m.id}')">Sí, borrar</button>
        <button class="btn-secondary" style="flex:1;min-height:44px;" onclick="cancelDeleteMeal()">Cancelar</button>
      </div>
    </div>`;
  }

  // ================== v17: dieta, lo de siempre, porciones, semana, nube ==================

  // ---------- dieta ----------
  //
  // La proteína es la meta de Ajustes (por kilo), sea cual sea la dieta. La
  // dieta reparte el resto del límite del día entre carbohidratos y grasas:
  // `carbos` es la parte de esas calorías que va a carbohidratos.
  const DIETAS = [
    { k: "equilibrada", nombre: "Equilibrada", detalle: "De todo un poco", carbos: 0.6 },
    { k: "alta_proteina", nombre: "Alta en proteína", detalle: "Carnes magras, huevo, lácteos", carbos: 0.5 },
    { k: "baja_carbos", nombre: "Baja en carbohidratos", detalle: "Menos pan, pastas y azúcar", carbos: 0.3 },
    { k: "mediterranea", nombre: "Mediterránea", detalle: "Oliva, pescado, legumbres", carbos: 0.55 },
    { k: "vegetariana", nombre: "Vegetariana", detalle: "Sin carne ni pescado", carbos: 0.65 },
  ];
  function dietaActual() { return DIETAS.find((d) => d.k === goal.dieta) || DIETAS[0]; }

  // Metas de hoy en gramos y lo que ya se comió, para Dieta y las sugerencias.
  function objetivosDelDia(c) {
    const d = dietaActual();
    const cheat = !!(dayMeta[c.todayStr] && dayMeta[c.todayStr].cheat);
    const gasto = gastoInfo(c.todayStr).total;
    const meta = metaDiaria(c);
    const limite = Math.max(0, gasto - meta);
    const proteina = c.proteinTarget;
    const resto = Math.max(0, limite - proteina * 4);
    const t = c.todayStats || { consumed: 0, protein: 0, carbs: 0, fat: 0, meals: [] };
    return {
      dieta: d, cheat, gasto, meta, limite,
      metas: { p: proteina, c: (resto * d.carbos) / 4, g: (resto * (1 - d.carbos)) / 9 },
      comido: { kcal: t.consumed, p: t.protein, c: t.carbs, g: t.fat },
      quedan: Math.max(0, limite - t.consumed),
      comidas: t.meals,
    };
  }

  window.elegirDieta = function (k) {
    if (!DIETAS.some((d) => d.k === k)) return;
    goal = { ...goal, dieta: k };
    persistGoal();
    render();
  };

  // ---------- sugerencias: qué comer el resto del día ----------
  //
  // Se guardan con la fecha: si cambiás de pantalla o cerrás la app no se
  // pierden, y al otro día se descartan solas.
  let sugerencias = null;          // {fecha, resumen, opciones:[{momento, comida, kcal, ..., comida_ok}]}
  let sugiriendo = false;          // true, o el índice de la opción que se está cambiando
  let sugerenciasError = "";
  function persistSugerencias() { try { localStorage.setItem("deficit_sugerencias", JSON.stringify(sugerencias)); } catch (e) { console.error(e); } }
  function cargarSugerencias() {
    try {
      const s = JSON.parse(localStorage.getItem("deficit_sugerencias") || "null");
      sugerencias = s && s.fecha === todayISO() && Array.isArray(s.opciones) ? s : null;
    } catch (e) { sugerencias = null; }
  }
  function horaLocal() { const d = new Date(); return `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`; }
  function limpiarOpcion(o) {
    return {
      momento: String(o.momento || "Comida"), comida: String(o.comida || ""),
      kcal: Math.max(0, Number(o.kcal) || 0), proteinas_g: Math.max(0, Number(o.proteinas_g) || 0),
      carbohidratos_g: Math.max(0, Number(o.carbohidratos_g) || 0), grasas_g: Math.max(0, Number(o.grasas_g) || 0),
    };
  }

  async function pedirSugerenciasAlServidor(extra) {
    const o = objetivosDelDia(computeCtx());
    const sugerencia = {
      hora: horaLocal(),
      quedan_kcal: Math.round(o.quedan),
      faltan_proteinas_g: Math.round(Math.max(0, o.metas.p - o.comido.p)),
      faltan_carbohidratos_g: Math.round(Math.max(0, o.metas.c - o.comido.c)),
      faltan_grasas_g: Math.round(Math.max(0, o.metas.g - o.comido.g)),
      dieta: o.dieta.k,
      comidas_hoy: o.comidas.map((m) => m.note).slice(0, 15),
      momentos: faltanHoy(o),
      sin_desayuno: !comidasHabituales().includes("Desayuno"),
      ...extra,
    };
    const r = await fetch("/.netlify/functions/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ perfil: "sugerencias", sugerencia }),
    });
    const obj = await r.json();
    if (!r.ok) { const err = new Error(obj.error || "Error"); err.codigo = obj.code; throw err; }
    return { resumen: String(obj.resumen || ""), opciones: (obj.opciones || []).map(limpiarOpcion) };
  }

  window.pedirSugerencias = async function () {
    sugiriendo = true; sugerenciasError = "";
    render();
    try {
      const evitar = sugerencias ? sugerencias.opciones.map((x) => x.comida) : [];
      const res = await pedirSugerenciasAlServidor(evitar.length ? { evitar } : {});
      sugerencias = { fecha: todayISO(), resumen: res.resumen, opciones: res.opciones };
      persistSugerencias();
    } catch (e) {
      console.error(e);
      sugerenciasError = mensajeDeError(e);
    } finally {
      sugiriendo = false;
      render();
    }
  };

  window.otraOpcion = async function (i) {
    if (!sugerencias || !sugerencias.opciones[i]) return;
    sugiriendo = i; sugerenciasError = "";
    render();
    try {
      const actual = sugerencias.opciones[i];
      const evitar = sugerencias.opciones.map((x) => x.comida).concat((sugerencias.descartadas || []).slice().reverse());
      const res = await pedirSugerenciasAlServidor({ solo_momento: actual.momento, evitar });
      const nueva = res.opciones.find((x) => x.momento === actual.momento) || res.opciones[0];
      if (nueva) {
        sugerencias.descartadas = (sugerencias.descartadas || []).concat(actual.comida).slice(-10);
        sugerencias.opciones[i] = nueva;
        persistSugerencias();
      }
    } catch (e) {
      console.error(e);
      sugerenciasError = mensajeDeError(e);
    } finally {
      sugiriendo = false;
      render();
    }
  };

  // "Lo comí": entra como una comida más de hoy, con los números de la
  // sugerencia y sin gastar otro análisis (por eso sin detalle de vitaminas).
  window.comiSugerencia = function (i) {
    if (!sugerencias || !sugerencias.opciones[i]) return;
    const o = sugerencias.opciones[i];
    const sug = { id: uid(), date: todayISO(), consumed: o.kcal, protein: o.proteinas_g, carbs: o.carbohidratos_g, fat: o.grasas_g, note: `${o.momento}: ${o.comida}`, sugerida: true, createdAt: Date.now() };
    if (COMIDAS_POSIBLES.indexOf(o.momento) >= 0) sug.momento = o.momento;
    agregarComida(sug);
    sugerencias.opciones.splice(i, 1);
    persistSugerencias();
    if (faltanManual) faltanManual = { ...faltanManual, lista: faltanManual.lista.filter((m) => m !== o.momento) };
    render();
  };

  // Suma una comida ya armada (de Lo de siempre o de una sugerencia) y deja
  // congelado el gasto base del día, igual que confirmSave.
  function agregarComida(meal) {
    meals = [meal, ...meals];
    persistMeals();
    const existing = dayMeta[meal.date] || { totalExpenditure: null, exerciseKcal: 0 };
    if (existing.maintenanceSnapshot == null) {
      dayMeta = { ...dayMeta, [meal.date]: { ...existing, maintenanceSnapshot: goal.maintenance } };
      persistDayMeta();
    }
  }

  // ---------- tus comidas (ayuno) ----------
  //
  // Qué comidas hacés en el día. Sin desayuno = ayunás hasta el mediodía, y
  // las sugerencias no proponen nada antes del almuerzo. Cuáles te faltan hoy
  // se deduce contando lo que ya cargaste, en orden: con almuerzo, merienda y
  // cena, si ya cargaste dos, falta la cena. Cargas a menos de 45 minutos una
  // de otra cuentan como la misma comida (el plato y el postre por separado).
  // Si la cuenta no coincide, se corrige con un toque y vale por ese día.
  const COMIDAS_POSIBLES = ["Desayuno", "Almuerzo", "Merienda", "Cena"];
  const MISMA_COMIDA_MS = 45 * 60 * 1000;
  let faltanManual = null;         // {fecha, lista} si corregiste a mano cuáles faltan
  function comidasHabituales() {
    const c = Array.isArray(goal.comidas) ? COMIDAS_POSIBLES.filter((m) => goal.comidas.includes(m)) : [];
    return c.length ? c : COMIDAS_POSIBLES.slice();
  }
  function comidasHechas(comidasHoy) {
    const horas = comidasHoy.map((m) => m.createdAt || 0).sort((a, b) => a - b);
    let n = 0, anterior = -Infinity;
    horas.forEach((t) => { if (t - anterior > MISMA_COMIDA_MS) n++; anterior = t; });
    return n;
  }
  // Las que ya comiste salen de cada comida de hoy (ver momentosDeComidas): las
  // nuevas traen su momento del +; las de antes se deducen por la hora.
  function faltanHoy(o) {
    const habituales = comidasHabituales();
    if (faltanManual && faltanManual.fecha === todayISO()) return habituales.filter((m) => faltanManual.lista.includes(m));
    const hechas = new Set(momentosDeComidas(o.comidas).map((x) => x.momento));
    return habituales.filter((m) => !hechas.has(m));
  }
  function conArticulo(m) { return (m === "Merienda" || m === "Cena" ? "la " : "el ") + m.toLowerCase(); }
  window.toggleComidaHabitual = function (m) {
    const actual = comidasHabituales();
    const nueva = actual.includes(m) ? actual.filter((x) => x !== m) : COMIDAS_POSIBLES.filter((x) => x === m || actual.includes(x));
    if (!nueva.length) return;
    goal = { ...goal, comidas: nueva };
    faltanManual = null;
    persistGoal();
    render();
  };
  window.toggleFalta = function (m) {
    const actual = faltanHoy(objetivosDelDia(computeCtx()));
    faltanManual = { fecha: todayISO(), lista: actual.includes(m) ? actual.filter((x) => x !== m) : actual.concat(m) };
    render();
  };

  function resumenFaltan(o, habituales, faltan) {
    const hechas = habituales.length - faltan.length;
    const ya = hechas === 0 ? "Todavía no comiste." : `Ya comiste ${hechas} de tus ${habituales.length} comidas.`;
    if (!faltan.length) return `${ya} Si querés una idea igual, marcá abajo para qué comida.`;
    if (o.cheat) return `${ya} Hoy es cheat: te sugiero igual algo que entre en tu límite.`;
    if (faltan.length === 1) return `${ya} Te quedan <b style="color:var(--text);">${kcal(o.quedan)} kcal</b> para ${conArticulo(faltan[0])}.`;
    return `${ya} Te quedan <b style="color:var(--text);">${kcal(o.quedan)} kcal</b> para ${faltan.length} comidas (≈ ${kcal(o.quedan / faltan.length)} cada una).`;
  }

  // ---------- lo de siempre (comidas frecuentes) ----------
  //
  // Dos fuentes: las que marcaste con ★ (se guarda una copia, con la porción
  // de ese momento) y las que cargaste 3 veces o más con el mismo texto (pasa
  // seguido justamente al sumarlas desde acá). Sumarlas no gasta análisis.
  let frecuentes = [];             // [{clave, note, consumed, protein, carbs, fat, nutrientes, score, comment}]
  const VECES_FRECUENTE = 3;
  function persistFrecuentes() { try { window.storage.set("frecuentes", JSON.stringify(frecuentes)); } catch (e) { console.error(e); } }
  function claveNota(note) { return String(note || "").trim().toLowerCase().replace(/\s+/g, " "); }
  function esFijo(m) { const k = claveNota(m.note); return frecuentes.some((f) => f.clave === k); }
  function copiaDeComida(m) {
    return { clave: claveNota(m.note), note: m.note, consumed: m.consumed, protein: m.protein, carbs: m.carbs, fat: m.fat, nutrientes: m.nutrientes || null, score: m.score, comment: m.comment };
  }
  function listaFrecuentes() {
    const fijos = frecuentes.map((f) => ({ ...f, fijo: true, veces: 0 }));
    const vistos = new Set(fijos.map((f) => f.clave));
    const grupos = {};
    meals.forEach((m) => {
      const k = claveNota(m.note);
      if (!k || vistos.has(k)) return;
      if (!grupos[k]) grupos[k] = { veces: 0, ultima: m };
      grupos[k].veces++;
      if (m.createdAt > grupos[k].ultima.createdAt) grupos[k].ultima = m;
    });
    const auto = Object.values(grupos).filter((g) => g.veces >= VECES_FRECUENTE)
      .sort((a, b) => b.veces - a.veces)
      .map((g) => ({ ...copiaDeComida(g.ultima), fijo: false, veces: g.veces }));
    return fijos.concat(auto).slice(0, 12);
  }
  // Por posición en la lista y no por el texto: una nota con apóstrofo
  // ("McDonald's") rompía el onclick.
  window.sumarFrecuente = function (i) {
    const f = listaFrecuentes()[i];
    if (!f) return;
    const date = captureDate || todayISO();
    const meal = { id: uid(), date, consumed: f.consumed, protein: f.protein, carbs: f.carbs, fat: f.fat, note: f.note, createdAt: Date.now() };
    if (f.nutrientes) meal.nutrientes = f.nutrientes;
    const mom = momentoPorDefecto(date);
    if (mom) meal.momento = mom;
    if (f.score != null) { meal.score = f.score; meal.comment = f.comment; }
    agregarComida(meal);
    showCapture = false; captureDate = null; momentoCarga = null; animarPantalla = true;
    activeTab = date === todayISO() ? "hoy" : "historial";
    expandedDays = { ...expandedDays, [date]: true };
    render();
  };
  window.toggleFijo = function (id) {
    const m = meals.find((x) => x.id === id);
    if (!m) return;
    const k = claveNota(m.note);
    frecuentes = esFijo(m) ? frecuentes.filter((f) => f.clave !== k) : [copiaDeComida(m), ...frecuentes].slice(0, 30);
    persistFrecuentes();
    render();
  };
  window.quitarFrecuente = function (i) {
    const f = listaFrecuentes()[i];
    if (!f) return;
    frecuentes = frecuentes.filter((x) => x.clave !== f.clave);
    persistFrecuentes();
    render();
  };
  // ---------- porciones ----------
  //
  // La primera vez que cambiás la porción se guarda el original en `base`, así
  // ½ → 2 → 1 vuelve exacto a lo que era. Editar a mano borra `base`: desde ahí
  // manda lo que escribiste.
  const PORCIONES = [[0.5, "½"], [1, "1"], [1.5, "1½"], [2, "2"]];
  window.setPorcion = function (id, factor) {
    meals = meals.map((m) => {
      if (m.id !== id) return m;
      const base = m.base || { consumed: m.consumed, protein: m.protein, carbs: m.carbs, fat: m.fat, nutrientes: m.nutrientes || null };
      if (factor === 1) {
        const out = { ...m, consumed: base.consumed, protein: base.protein, carbs: base.carbs, fat: base.fat };
        if (base.nutrientes) out.nutrientes = base.nutrientes;
        delete out.base; delete out.porcion;
        return out;
      }
      const out = { ...m, base, porcion: factor, consumed: base.consumed * factor, protein: base.protein * factor, carbs: base.carbs * factor, fat: base.fat * factor };
      if (base.nutrientes) {
        out.nutrientes = {};
        Object.keys(base.nutrientes).forEach((k) => { out.nutrientes[k] = (Number(base.nutrientes[k]) || 0) * factor; });
      }
      return out;
    });
    persistMeals();
    render();
  };
  // ---------- resumen de la semana ----------
  //
  // Los últimos 7 días, cada uno contra su propio límite: lo que gastaste ese
  // día (basal más el ejercicio que cargaste, o el total de una app) menos la
  // meta diaria de hoy. La meta va cambiando un poco día a día, así que eso es
  // una aproximación; el gasto sí es el de cada día.
  //
  // Tres estados. Antes "te pasaste" juntaba dos cosas distintas, y un día en
  // déficit que no llegó a la meta se veía igual que uno en que comiste más de
  // lo que gastaste:
  //   meta      comiste hasta el límite: cumpliste la meta
  //   deficit   pasaste el límite pero no lo que gastaste: igual bajaste
  //   superavit comiste más de lo que gastaste (el único con ▲)
  let semanaSel = null;
  window.selDiaSemana = function (i) { semanaSel = semanaSel === i ? null : i; render(); };
  function datosSemana(c) {
    const meta = metaDiaria(c);
    const dias = [];
    for (let i = 6; i >= 0; i--) {
      const fecha = addDaysISO(c.todayStr, -i);
      const d = c.dayStats.find((x) => x.date === fecha);
      const esHoy = fecha === c.todayStr;
      const gasto = d ? d.gasto : goal.maintenance;
      const limite = Math.max(0, gasto - meta);
      const consumido = d ? d.consumed : 0;
      let estado = "vacio";
      if (esHoy) estado = "hoy";
      else if (d && d.cheat) estado = "cheat";
      else if (d) estado = consumido <= limite ? "meta" : consumido <= gasto ? "deficit" : "superavit";
      dias.push({ fecha, d, esHoy, limite, gasto, consumido, proteina: d ? d.protein : 0, estado,
        // Sin ejercicio ni total de una app, el gasto es solo el basal.
        soloBasal: !!d && !d.usedAppTotal && !d.exercise });
    }
    const completos = dias.filter((x) => x.d && !x.esHoy);
    const contables = completos.filter((x) => x.estado !== "cheat");
    return {
      dias, meta,
      cumplidos: contables.filter((x) => x.estado === "meta").length,
      enDeficit: contables.filter((x) => x.estado !== "superavit").length,
      contables: contables.length,
      promedio: completos.length ? completos.reduce((s, x) => s + x.consumido, 0) / completos.length : 0,
      proteina: completos.length ? completos.reduce((s, x) => s + x.proteina, 0) / completos.length : 0,
      deficit: completos.reduce((s, x) => s + x.d.net, 0),
    };
  }
  // ---------- nube ----------
  //
  // Todo el estado viaja a netlify/functions/datos.js con un código al azar.
  // Se guarda solo, unos segundos después de cada cambio. En otro celular,
  // poniendo el código, se baja todo. Sin cuenta ni contraseña: quien tenga el
  // código ve los datos (la persona lo eligió así).
  const ALFABETO = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
  const CODIGO_RE = /^[2-9A-HJ-NP-Z]{4}-[2-9A-HJ-NP-Z]{4}-[2-9A-HJ-NP-Z]{4}$/;
  let nube = { codigo: null, guardado: null, estado: "nuevo" }; // estado: nuevo | guardando | ok | error
  let nubeTimer = null;
  let nubeMsg = null;             // {tipo, texto} en Ajustes
  let nubeEncontrada = null;      // {codigo, guardado, datos} esperando confirmación
  let nubeBuscando = false;
  // Va directo a localStorage: si pasara por window.storage dispararía otro guardado.
  function persistNube() { try { localStorage.setItem("deficit_nube", JSON.stringify({ codigo: nube.codigo, guardado: nube.guardado })); } catch (e) { console.error(e); } }
  function cargarNube() {
    try { const n = JSON.parse(localStorage.getItem("deficit_nube") || "null"); if (n && CODIGO_RE.test(n.codigo)) nube = { codigo: n.codigo, guardado: n.guardado || null, estado: n.guardado ? "ok" : "nuevo" }; } catch (e) { /* queda nueva */ }
  }
  function generarCodigo() {
    const b = new Uint8Array(12);
    crypto.getRandomValues(b);
    const t = Array.from(b, (x) => ALFABETO[x % 32]).join("");
    return `${t.slice(0, 4)}-${t.slice(4, 8)}-${t.slice(8)}`;
  }
  function asegurarCodigo() { if (!nube.codigo) { nube = { codigo: generarCodigo(), guardado: null, estado: "nuevo" }; persistNube(); } }
  function fotoDelEstado() { return { app: "deficit", version: APP_VERSION, meals, dayMeta, goal, weighIns, frecuentes }; }

  // Varios cambios seguidos (cargar una comida toca meals y dayMeta) se juntan
  // en un solo envío.
  function programarGuardado() {
    if (!goal.onboarded) return;
    clearTimeout(nubeTimer);
    nubeTimer = setTimeout(guardarEnNube, 3000);
  }
  // Todo lo que se guarda pasa por window.storage.set (comidas, días, objetivo,
  // pesajes, Lo de siempre): engancharse ahí cubre cualquier cambio, incluso
  // los que se agreguen más adelante.
  const setLocal = window.storage.set;
  window.storage.set = async function (key, value) {
    const r = await setLocal.call(window.storage, key, value);
    programarGuardado();
    return r;
  };
  // De a uno por vez: si un envío tardara más que la espera, el viejo podría
  // llegar después del nuevo y pisarlo. Lo que cambie mientras tanto sale
  // apenas termina el que está en camino.
  let nubeEnCamino = false;
  let nubePendiente = false;
  async function guardarEnNube() {
    if (!goal.onboarded) return;
    if (nubeEnCamino) { nubePendiente = true; return; }
    nubeEnCamino = true;
    asegurarCodigo();
    // Si en el camino cambia el código (recuperaste otro o borraste todo), la
    // respuesta de este envío ya no habla del código actual.
    const codigo = nube.codigo;
    nube.estado = "guardando";
    pintarEstadoNube();
    try {
      const r = await fetch("/.netlify/functions/datos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ accion: "guardar", codigo, datos: fotoDelEstado() }),
      });
      const obj = await r.json();
      if (!r.ok) throw new Error(obj.error || "Error");
      if (nube.codigo === codigo) { nube.guardado = obj.guardado; nube.estado = "ok"; persistNube(); }
    } catch (e) {
      console.error(e);
      if (nube.codigo === codigo) nube.estado = "error";
    }
    nubeEnCamino = false;
    pintarEstadoNube();
    if (nubePendiente) { nubePendiente = false; guardarEnNube(); }
  }
  // Sin render(): en Ajustes podés estar pegando un código o escribiendo un
  // peso, y redibujar te lo borraría.
  function estadoNube() {
    const texto = nube.estado === "guardando" ? "Guardando…"
      : nube.estado === "error" ? "Sin conexión: se guarda cuando vuelva"
      : nube.guardado ? `Guardado ${haceCuanto(nube.guardado)}` : "Se guarda con el próximo cambio";
    return { texto, color: nube.estado === "error" ? "var(--amber)" : "var(--sage)" };
  }
  function pintarEstadoNube() {
    const el = document.getElementById("nube-estado");
    if (!el) return;
    const e = estadoNube();
    el.textContent = e.texto;
    el.style.color = e.color;
  }
  // Si quedó algo sin subir (sin señal), se reintenta al volver la conexión o
  // al volver a abrir la app.
  window.addEventListener("online", () => { if (nube.estado === "error") guardarEnNube(); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && nube.estado === "error") guardarEnNube(); });

  function haceCuanto(iso) {
    const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (!(min >= 0)) return "";
    if (min < 1) return "recién";
    if (min < 60) return `hace ${min} minuto${min !== 1 ? "s" : ""}`;
    const hs = Math.round(min / 60);
    if (hs < 24) return `hace ${hs} hora${hs !== 1 ? "s" : ""}`;
    return `el ${new Date(iso).toLocaleDateString("es-AR", { day: "numeric", month: "long" })}`;
  }

  window.copiarCodigo = function () {
    const listo = () => { nubeMsg = { tipo: "ok", texto: "Código copiado." }; render(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(nube.codigo).then(listo, () => { nubeMsg = { tipo: "error", texto: "No se pudo copiar: anotalo a mano." }; render(); });
    else { nubeMsg = { tipo: "error", texto: "No se pudo copiar: anotalo a mano." }; render(); }
  };
  window.buscarEnNube = async function () {
    const el = document.getElementById("nube-codigo");
    const codigo = (el ? el.value : "").trim().toUpperCase().replace(/\s+/g, "");
    nubeEncontrada = null;
    if (!CODIGO_RE.test(codigo)) { nubeMsg = { tipo: "error", texto: "El código son tres grupos de 4, como 7Q4M-92KD-H3TP." }; render(); return; }
    if (codigo === nube.codigo) { nubeMsg = { tipo: "error", texto: "Ese es el código de este celular." }; render(); return; }
    nubeBuscando = true; nubeMsg = null;
    render();
    try {
      const r = await fetch("/.netlify/functions/datos", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ accion: "leer", codigo }) });
      const obj = await r.json();
      if (!r.ok) throw Object.assign(new Error(obj.error || "Error"), { codigo: obj.code });
      if (!obj.datos || !Array.isArray(obj.datos.meals)) throw new Error("forma");
      nubeEncontrada = { codigo, guardado: obj.guardado, datos: obj.datos };
    } catch (e) {
      console.error(e);
      nubeMsg = { tipo: "error", texto: e.codigo === "codigo_desconocido" ? "No hay datos guardados con ese código. Revisalo." : e instanceof TypeError ? "No hay conexión. Probá de nuevo." : "No se pudo traer. Probá de nuevo en un rato." };
    } finally {
      nubeBuscando = false;
      render();
    }
  };
  window.cancelarNube = function () { nubeEncontrada = null; render(); };
  window.usarDatosDeNube = async function () {
    if (!nubeEncontrada) return;
    const d = nubeEncontrada.datos;
    // Primero el código: lo que se guarde desde ahora va a esa misma copia.
    nube = { codigo: nubeEncontrada.codigo, guardado: nubeEncontrada.guardado, estado: "ok" };
    persistNube();
    meals = Array.isArray(d.meals) ? d.meals : [];
    dayMeta = d.dayMeta && typeof d.dayMeta === "object" ? d.dayMeta : {};
    goal = { ...DEFAULT_GOAL, ...(d.goal || {}) };
    weighIns = Array.isArray(d.weighIns) ? d.weighIns : [];
    frecuentes = Array.isArray(d.frecuentes) ? d.frecuentes : [];
    await Promise.all([persistMeals(), persistDayMeta(), persistGoal(), persistWeighIns()]);
    persistFrecuentes();
    nubeEncontrada = null;
    nubeMsg = { tipo: "ok", texto: `Listo: se recuperaron ${meals.length} comida${meals.length !== 1 ? "s" : ""}.` };
    applyTheme();
    render();
  };

  // ---------- PANTALLA: HISTORIAL ----------
  function screenHistorial(c) {
    let h = `<div class="p-pantalla">
      <div class="p-cabeza"><div class="p-titulo">Historial</div><span class="small dim" style="font-weight:600">${c.dayStats.length} día${c.dayStats.length !== 1 ? "s" : ""}</span></div>

      }
