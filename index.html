<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Déficit">
<meta name="theme-color" content="#14181C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Déficit Tracker</title>
<style>
  :root {
    --bg: #14181C; --surface: #1C2227; --surfaceRaised: #242B31; --line: #333B42;
    --text: #F2EFE9; --textDim: #9AA3AA; --amber: #E8A33D; --sage: #6FA98A; --rust: #C1584B;
    --protein: #6C93E8; --carbs: #D9823D; --fat: #B589E0;
  }
  [data-theme="light"] {
    --bg: #F7F5F0; --surface: #FFFFFF; --surfaceRaised: #EFEBE2; --line: #DDD6C8;
    --text: #23262B; --textDim: #6D7278; --amber: #B4791E; --sage: #3D8563; --rust: #B0402F;
    --protein: #3A5FC4; --carbs: #B5631F; --fat: #8354B8;
  }
  * { box-sizing: border-box; }
  body, #root { background: var(--bg); color: var(--text); font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; }
  body { transition: background-color .25s ease, color .25s ease; }
  .card, input, textarea, select, button { transition: background-color .25s ease, border-color .25s ease, color .25s ease; }
  #root { padding: calc(28px + env(safe-area-inset-top, 0px)) 20px calc(130px + env(safe-area-inset-bottom, 0px)); min-height: 100vh; }
  @keyframes popIn { 0% { transform: scale(.92); opacity: 0; } 60% { transform: scale(1.02); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-70px) scale(1.35); opacity: 0; } }
  .celebrate { animation: popIn .45s ease-out; }
  .confetti-piece { position: absolute; font-size: 20px; animation: floatUp 1.1s ease-out forwards; pointer-events: none; }
  .fab-stack { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; z-index: 50; }
  .fab-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--surfaceRaised); border: 1px solid var(--line); color: var(--text); font-size: 19px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
  .badge-pill { background: var(--surfaceRaised); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  input, textarea, select {
    font-family: inherit; background: var(--surfaceRaised); border: 1px solid var(--line);
    color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 14px; width: 100%; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--amber); }
  input::placeholder, textarea::placeholder { color: #5C666D; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  .row { display: flex; }
  .col { display: flex; flex-direction: column; }
  .gap6 { gap: 6px; } .gap8 { gap: 8px; } .gap10 { gap: 10px; } .gap12 { gap: 12px; } .gap14 { gap: 14px; } .gap20 { gap: 20px; } .gap24 { gap: 24px; }
  .dim { color: var(--textDim); }
  .small { font-size: 12px; }
  .xs { font-size: 11px; }
  .title { font-size: 16px; font-weight: 700; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .label { font-size: 11px; color: var(--textDim); display: block; margin-bottom: 4px; }
  .btn-primary { background: var(--amber); color: #1A1300; border-radius: 8px; padding: 10px 18px; font-weight: 700; font-size: 14px; }
  .btn-primary:disabled { background: var(--line); color: var(--textDim); }
  .btn-secondary { background: transparent; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 9px 16px; font-size: 13px; }
  .btn-sage { background: var(--sage); color: #0E1A14; border-radius: 8px; padding: 9px 16px; font-weight: 700; font-size: 13px; }
  .btn-ghost { background: transparent; color: var(--textDim); padding: 4px; }
  .stat-label { font-size: 10px; color: var(--textDim); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 16px; font-weight: 700; }
  .spin { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  /* ---------- navegación inferior y hoja de carga (v13) ---------- */
  .screen { max-width: 720px; margin: 0 auto; }
  .topbar { display: flex; justify-content: space-between; align-items: center; min-height: 44px; margin-bottom: 10px; }
  .icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: -10px; }
  .hero-num { font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -1px; }
  .track { height: 6px; background: var(--surfaceRaised); border-radius: 999px; overflow: hidden; }
  .track > i { display: block; height: 100%; border-radius: 999px; transition: width .35s ease; }
  .chip { background: var(--surfaceRaised); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
  .chip.dim { color: var(--textDim); }
  .sq { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: 0px; }
  .dash { width: 14px; height: 2px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: 3px; }
  .meal-row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
  .big-btn { height: 52px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }

  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    height: calc(84px + env(safe-area-inset-bottom, 0px));
    background: var(--surface); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(5, 1fr); align-items: start; padding-top: 10px;
  }
  .nav > button { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 48px; justify-content: center; font-size: 10px; color: var(--textDim); }
  .nav > button.on { color: var(--amber); }
  .nav .cap { width: 56px; height: 56px; border-radius: 50%; background: var(--amber); display: flex; align-items: center; justify-content: center; margin-top: -18px; box-shadow: 0 4px 14px rgba(0,0,0,.45); }

  .sheet-backdrop { position: fixed; inset: 0; background: rgba(10,13,16,.62); z-index: 70; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 71;
    background: var(--surface); border-top: 1px solid var(--line);
    border-radius: 20px 20px 0 0;
    padding: 12px 20px calc(28px + env(safe-area-inset-bottom, 0px));
    max-height: 88vh; overflow-y: auto;
  }
  .grab { width: 38px; height: 4px; border-radius: 999px; background: var(--line); margin: 0 auto 18px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  "use strict";
  // Polyfill de almacenamiento: misma interfaz que window.storage de Claude.ai,
  // pero usando localStorage del navegador (persiste en este dispositivo/navegador).
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem("deficit_" + key);
      if (raw === null) return null;
      return { key, value: raw };
    },
    async set(key, value) {
      localStorage.setItem("deficit_" + key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem("deficit_" + key);
      return { key, deleted: true };
    },
  };

  const KCAL_PER_KG = 7700;
  const APP_VERSION = "v13.1-html · validación de origen por mismo host";
  const DEFAULT_GOAL = { currentWeight: null, goalWeight: null, goalDate: "", maintenance: 2200, height: null, age: null, gender: "male", onboarded: false, surplusAlertThreshold: 300, theme: "dark", proteinTarget: null };

  let meals = [];
  let dayMeta = {};
  let goal = { ...DEFAULT_GOAL };
  let weighIns = [];
  let loading = true;

  // UI-only state
  let activeTab = "hoy";          // hoy | historial | progreso | ajustes
  let showCapture = false;        // hoja inferior para cargar una comida
  // El textarea se destruye en cada render (reconstruimos innerHTML entero), así
  // que guardamos lo tipeado acá antes de redibujar. Sin esto, adjuntar una foto
  // borraba el dictado a medio escribir.
  let dictationDraft = "";
  let calibrationDismissed = null; // gasto base sugerido que ya postergaste
  let expanded = true;
  let expandedDays = {};
  let showSettings = false;
  let analyzing = false;
  let parsed = null;
  let errorMsg = "";
  let photo = null; // {dataUrl, mediaType}
  let importMsg = "";
  let onboardForm = null;
  let gapChoiceMade = false;
  let editingMealId = null;
  let editingDayMeta = null;
  let editingWeighInId = null;
  let showCloseDayConfirm = false;
  let justClosedCelebration = false;
  let showResetConfirm = false;

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
  function addDaysISO(iso, n) { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
  function daysBetween(a, b) { return Math.max(1, Math.round((new Date(b) - new Date(a)) / 86400000)); }
  function formatDate(iso) {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" });
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function calcMaintenance({ weight, height, age, gender }) {
    const bmr = gender === "female" ? 10 * weight + 6.25 * height - 5 * age - 161 : 10 * weight + 6.25 * height - 5 * age + 5;
    return Math.round(bmr * 1.2);
  }
  // 1.8 g de proteína por kg de peso actual: rango razonable para preservar músculo en déficit.
  function calcProteinTarget(weight) { return Math.round((weight || 0) * 1.8); }
  function macroInline(p, c, f) {
    return `<span style="color:var(--protein)">P${p.toFixed(0)}</span>/<span style="color:var(--carbs)">C${c.toFixed(0)}</span>/<span style="color:var(--fat)">G${f.toFixed(0)}</span>`;
  }
  // ---------- valoración nutricional de la comida (1-10 + comentario, generada por la IA) ----------
  function nutritionColor(score) {
    const pct = Math.max(0, Math.min(100, ((score - 1) / 9) * 100));
    return getProgressColor(pct);
  }
  function nutritionBadge(score, comment) {
    if (score == null) return "";
    return `<div class="small row gap8" style="align-items:center;margin-top:10px;">
      <span style="background:${nutritionColor(score)};color:#fff;border-radius:999px;padding:2px 10px;font-weight:700;font-size:12px;flex-shrink:0;">${score}/10</span>
      <span class="dim">${esc(comment || "")}</span>
    </div>`;
  }

  // ---------- números con coma o punto (formato AR) ----------
  function toNumber(v) {
    if (v == null) return 0;
    const n = parseFloat(String(v).trim().replace(",", "."));
    return isNaN(n) ? 0 : n;
  }

  // ---------- tema claro/oscuro ----------
  function applyTheme() {
    document.documentElement.setAttribute("data-theme", goal.theme === "light" ? "light" : "dark");
  }
  window.toggleTheme = function () {
    goal = { ...goal, theme: goal.theme === "light" ? "dark" : "light" };
    persistGoal();
    applyTheme();
    render();
  };

  // ---------- color según cercanía al objetivo (rojo -> amarillo -> verde) ----------
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function hexToRgb(hex) {
    const h = hex.replace("#", "");
    return [parseInt(h.substring(0, 2), 16), parseInt(h.substring(2, 4), 16), parseInt(h.substring(4, 6), 16)];
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function lerpColor(c1, c2, t) { return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)]; }
  function getProgressColor(pct) {
    const rust = hexToRgb(cssVar("--rust")), amber = hexToRgb(cssVar("--amber")), sage = hexToRgb(cssVar("--sage"));
    const c = pct <= 50 ? lerpColor(rust, amber, Math.max(0, pct) / 50) : lerpColor(amber, sage, Math.min(100, pct - 50) / 50);
    return `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  }

  // ---------- balance del día: verde y signo menos = déficit, amarillo/rojo y signo más = superávit ----------
  function formatBalance(net) {
    const threshold = goal.surplusAlertThreshold || 300;
    if (net >= 0) return { text: "-" + Math.round(net).toLocaleString("es-ES") + " kcal", color: "var(--sage)" };
    const surplus = Math.abs(net);
    return { text: "+" + Math.round(surplus).toLocaleString("es-ES") + " kcal", color: surplus <= threshold ? "var(--amber)" : "var(--rust)" };
  }
  function dayCloseMessage(day) {
    const net = day.net;
    if (net >= 0) {
      const kg = net / KCAL_PER_KG;
      return `&#127881; ¡Felicitaciones, seguís así! Hoy restaste ${Math.round(net).toLocaleString("es-ES")} kcal (&asymp; ${kg.toFixed(2)} kg) de tu objetivo.`;
    }
    const surplus = Math.abs(net);
    const threshold = goal.surplusAlertThreshold || 300;
    if (surplus <= threshold) return `Hoy hubo un pequeño superávit de ${Math.round(surplus).toLocaleString("es-ES")} kcal. No pasa nada, mañana seguimos sumando déficit.`;
    return `Hoy el balance dio +${Math.round(surplus).toLocaleString("es-ES")} kcal de superávit. Es solo un día — lo que importa es la tendencia general. Mañana retomamos.`;
  }
  function confettiMarkup() {
    const emojis = ["&#127881;", "&#10024;", "&#128293;", "&#128170;", "&#11088;"];
    let out = "";
    for (let i = 0; i < 10; i++) {
      const left = 5 + ((i * 9) % 90);
      const delay = (i % 5) * 0.08;
      out += `<span class="confetti-piece" style="left:${left}%;bottom:10px;animation-delay:${delay}s;">${emojis[i % emojis.length]}</span>`;
    }
    return out;
  }

  // ---------- racha de déficit e insignias ----------
  function computeDeficitStreak(settledDescending) {
    let streak = 0, prevDate = null;
    for (const d of settledDescending) {
      if (d.net < 0) break;
      if (prevDate === null) { streak = 1; prevDate = d.date; continue; }
      if (addDaysISO(prevDate, -1) === d.date) { streak++; prevDate = d.date; } else break;
    }
    return streak;
  }
  function computeBadges({ streak, kgLost, pct }) {
    const badges = [];
    const streakTiers = [[30, "&#127942;", "Racha de 30 días"], [14, "&#128293;&#128293;&#128293;", "Racha de 14 días"], [7, "&#128293;&#128293;", "Racha de 7 días"], [3, "&#128293;", "Racha de 3 días"]];
    for (const [n, icon, label] of streakTiers) { if (streak >= n) { badges.push({ icon, label }); break; } }
    const kgTiers = [[10, "&#128142;", "-10 kg quemados"], [5, "&#11088;", "-5 kg quemados"], [2, "&#10024;", "-2 kg quemados"]];
    for (const [n, icon, label] of kgTiers) { if (kgLost >= n) { badges.push({ icon, label }); break; } }
    if (pct >= 100) badges.push({ icon: "&#127919;", label: "¡Objetivo cumplido!" });
    return badges;
  }

  function computeDayStats() {
    const byDate = {};
    meals.forEach((m) => {
      if (!byDate[m.date]) byDate[m.date] = { date: m.date, consumed: 0, protein: 0, carbs: 0, fat: 0, meals: [] };
      byDate[m.date].consumed += m.consumed;
      byDate[m.date].protein += m.protein;
      byDate[m.date].carbs += m.carbs;
      byDate[m.date].fat += m.fat;
      byDate[m.date].meals.push(m);
    });
    return Object.values(byDate)
      .map((day) => {
        const meta = dayMeta[day.date] || {};
        const baseMaintenance = meta.maintenanceSnapshot != null ? meta.maintenanceSnapshot : goal.maintenance;
        const gasto = meta.totalExpenditure != null ? meta.totalExpenditure : baseMaintenance + (meta.exerciseKcal || 0);
        return {
          ...day,
          gasto,
          usedAppTotal: meta.totalExpenditure != null,
          exercise: meta.exerciseKcal || 0,
          net: gasto - day.consumed,
          closed: !!meta.closed,
          meals: day.meals.slice().sort((a, b) => a.createdAt - b.createdAt),
        };
      })
      .sort((a, b) => (a.date < b.date ? 1 : -1));
  }

  // ---------- storage ----------
  async function loadAll() {
    try {
      const [m, dm, g, w] = await Promise.all([
        window.storage.get("meals").catch(() => null),
        window.storage.get("dayMeta").catch(() => null),
        window.storage.get("goal").catch(() => null),
        window.storage.get("weighIns").catch(() => null),
      ]);
      meals = m ? JSON.parse(m.value) : [];
      dayMeta = dm ? JSON.parse(dm.value) : {};
      goal = g ? { ...DEFAULT_GOAL, ...JSON.parse(g.value) } : { ...DEFAULT_GOAL };
      weighIns = w ? JSON.parse(w.value) : [];
    } catch (e) {
      meals = []; dayMeta = {}; goal = { ...DEFAULT_GOAL }; weighIns = [];
    } finally {
      loading = false;
      applyTheme();
      render();
    }
  }
  async function persistMeals() { try { await window.storage.set("meals", JSON.stringify(meals)); } catch (e) { console.error(e); } }
  async function persistDayMeta() { try { await window.storage.set("dayMeta", JSON.stringify(dayMeta)); } catch (e) { console.error(e); } }
  async function persistGoal() { try { await window.storage.set("goal", JSON.stringify(goal)); } catch (e) { console.error(e); } }
  async function persistWeighIns() { try { await window.storage.set("weighIns", JSON.stringify(weighIns)); } catch (e) { console.error(e); } }

  // ---------- onboarding ----------
  function initOnboardForm() {
    onboardForm = {
      currentWeight: goal.currentWeight || "",
      goalWeight: goal.goalWeight || "",
      goalDate: goal.goalDate || "",
      height: goal.height || "",
      age: goal.age || "",
      gender: goal.gender || "male",
    };
  }

  window.completeOnboarding = function () {
    const cw = toNumber(document.getElementById("ob-cw").value);
    const gw = toNumber(document.getElementById("ob-gw").value);
    const h = toNumber(document.getElementById("ob-h").value);
    const a = toNumber(document.getElementById("ob-age").value);
    const gender = document.getElementById("ob-gender").value;
    const goalDate = document.getElementById("ob-date").value;
    if (!cw || !gw || !h || !a || !goalDate) return;
    const maintenance = calcMaintenance({ weight: cw, height: h, age: a, gender });
    goal = { ...goal, currentWeight: cw, goalWeight: gw, goalDate, height: h, age: a, gender, maintenance, proteinTarget: calcProteinTarget(cw), onboarded: true };
    persistGoal();
    render();
  };

  // ---------- navegación ----------
  window.setTab = function (tab) {
    activeTab = tab;
    showCapture = false;
    window.scrollTo(0, 0);
    render();
  };
  window.openCapture = function () {
    showCapture = true;
    errorMsg = "";
    render();
    // Foco diferido: el textarea recién existe después de redibujar.
    setTimeout(function () {
      const t = document.getElementById("dictation-textarea");
      if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
    }, 50);
  };
  window.closeCapture = function () {
    saveDictationDraft();
    showCapture = false;
    render();
  };
  window.focusDictation = function () {
    const t = document.getElementById("dictation-textarea");
    if (t) t.focus();
  };
  window.dismissCalibration = function (sugerido) {
    calibrationDismissed = sugerido;
    render();
  };

  // ---------- goal / settings ----------
  window.toggleSettings = function () { setTab("ajustes"); };
  window.updateGoalField = function (field, value, isNumber) {
    goal = { ...goal, [field]: isNumber ? toNumber(value) : value };
    persistGoal();
  };
  window.recalcMaintenance = function () {
    goal = { ...goal, maintenance: calcMaintenance({ weight: goal.currentWeight, height: goal.height, age: goal.age, gender: goal.gender }) };
    persistGoal();
    render();
  };
  window.recalcProteinTarget = function () {
    goal = { ...goal, proteinTarget: calcProteinTarget(goal.currentWeight) };
    persistGoal();
    render();
  };
  window.applyCalibration = function (suggested) {
    const value = Math.round(parseFloat(suggested) || 0);
    goal = { ...goal, maintenance: Math.max(1200, value) };
    persistGoal();
    render();
  };

  // ---------- backup ----------
  window.exportBackup = function () {
    try {
      const backup = { exportedAt: new Date().toISOString(), meals, dayMeta, goal, weighIns };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `respaldo-deficit-${todayISO()}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) { console.error(e); }
  };
  window.triggerImport = function () { document.getElementById("backup-file-input").click(); };
  window.openResetConfirm = function () { showResetConfirm = true; render(); };
  window.cancelResetConfirm = function () { showResetConfirm = false; render(); };
  window.confirmResetAllData = async function () {
    meals = [];
    dayMeta = {};
    weighIns = [];
    goal = { ...DEFAULT_GOAL };
    try {
      await Promise.all([
        window.storage.delete("meals").catch(() => null),
        window.storage.delete("dayMeta").catch(() => null),
        window.storage.delete("goal").catch(() => null),
        window.storage.delete("weighIns").catch(() => null),
      ]);
    } catch (e) { console.error(e); }

  window.handleImportFile = function (input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const obj = JSON.parse(reader.result);
        if (Array.isArray(obj.meals)) { meals = obj.meals; await persistMeals(); }
        if (obj.dayMeta) { dayMeta = obj.dayMeta; await persistDayMeta(); }
        if (obj.goal) { goal = { ...DEFAULT_GOAL, ...obj.goal }; await persistGoal(); }
        if (Array.isArray(obj.weighIns)) { weighIns = obj.weighIns; await persistWeighIns(); }
        importMsg = "Copia de seguridad restaurada correctamente.";
      } catch (err) {
        importMsg = "No se pudo leer ese archivo de respaldo.";
      }
      render();

  // ---------- photo ----------
  // Una foto de iPhone sin tocar son ~2.450 tokens de entrada; redimensionada a
  // 1024px son ~1.050. Para estimar un plato no se pierde nada útil, y es el
  // ahorro más grande del costo por análisis. Además, al re-codificar en canvas
  // la salida siempre queda en JPEG: eso normaliza de paso los HEIC del iPhone,
  // que la API no acepta.
  const PHOTO_MAX_SIDE = 1024;
  const PHOTO_JPEG_QUALITY = 0.85;

  function redimensionarFoto(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("No se pudo leer el archivo"));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("No se pudo abrir la imagen"));
        img.onload = () => {
          const escala = Math.min(1, PHOTO_MAX_SIDE / Math.max(img.width, img.height));
          const w = Math.round(img.width * escala);
          const h = Math.round(img.height * escala);
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          // Fondo blanco: si el original tiene transparencia, el JPEG la
          // rellenaría de negro y confundiría la estimación.
          ctx.fillStyle = "#FFFFFF";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve({ dataUrl: canvas.toDataURL("image/jpeg", PHOTO_JPEG_QUALITY), mediaType: "image/jpeg" });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  window.triggerPhoto = function () { document.getElementById("photo-file-input").click(); };
  window.handlePhotoFile = async function (input) {

  // ---------- analyze ----------
  window.analyze = async function () {
    saveDictationDraft();
    const dictation = dictationDraft;
    if (!dictation.trim() && !photo) {
      errorMsg = "Escribí qué comiste o adjuntá una foto.";
      render();
      return;
    }
    analyzing = true; errorMsg = ""; parsed = null;
    render();
    try {
      // El prompt del sistema ya no viaja desde acá: vive en la función
      // serverless. Mandarlo desde el cliente dejaba el endpoint abierto para
      // que cualquiera lo usara como API de Claude gratis, facturada a nuestra
      // cuenta. Ahora solo aportamos el dictado y la foto.
      const payload = { dictation: dictation.trim() };
      if (photo) payload.photo = { mediaType: photo.mediaType, data: photo.dataUrl.split(",")[1] };

      const response = await fetch("/.netlify/functions/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      // La función devuelve el análisis ya parseado y garantizado contra un
      // esquema (structured outputs), así que desapareció el viejo baile de
      // sacarle los backticks de markdown al texto y rezar que JSON.parse ande.
      const obj = await response.json();
      if (!response.ok) {
        const err = new Error(obj.error || "Error desconocido");
        err.codigo = obj.code;
        throw err;
      }
      parsed = {
        consumed: Number(obj.consumed_kcal) || 0,
        protein: Number(obj.protein_g) || 0,
        carbs: Number(obj.carbs_g) || 0,
        fat: Number(obj.fat_g) || 0,
        totalExpenditure: obj.total_expenditure_kcal != null ? Number(obj.total_expenditure_kcal) : null,
        exercise: obj.exercise_kcal != null ? Number(obj.exercise_kcal) : null,
        note: obj.summary || dictation.trim().slice(0, 120) || "Comida analizada por foto",
        nutritionScore: obj.nutrition_score != null ? Math.max(1, Math.min(10, Math.round(Number(obj.nutrition_score)))) : null,
        nutritionComment: obj.nutrition_comment || "",
      };
    } catch (e) {
      console.error(e);
      // Antes todos los fallos mostraban el mismo mensaje, así que un problema
      // de red, una clave vencida y una foto ilegible eran indistinguibles y no
      // había forma de saber si reintentar servía de algo.
      errorMsg = mensajeDeError(e);
    } finally {
      analyzing = false;
      render();
    }
  };

  function mensajeDeError(e) {
    const porCodigo = {
      sin_clave: "La app no tiene configurada la clave de API. Revisá las variables de entorno en Netlify.",
      clave_rechazada: "La clave de API fue rechazada. Puede haber vencido o haber sido revocada.",
      sin_credito: "La cuenta de Anthropic se quedó sin crédito. Cargá saldo y volvé a intentar.",
      limite_alcanzado: "Demasiados análisis seguidos. Esperá un minuto y probá de nuevo.",
      formato_no_soportado: "Ese formato de imagen no se puede analizar. Sacá la foto de nuevo.",
      foto_muy_grande: "La foto es demasiado pesada. Probá con una más chica.",
      dictado_muy_largo: "El dictado es muy largo. Contá solo esta comida.",
      sin_contenido: "Escribí qué comiste o adjuntá una foto.",
      rechazado: "No pude analizar esa descripción. Probá contarlo con otras palabras.",
      sin_conexion: "No hay conexión con el servidor. Revisá tu internet y reintentá.",
      // Dos causas distintas: antes compartían mensaje y no se podía saber cuál era.
      token_invalido: "Falta el token de la app. Si activaste APP_SHARED_TOKEN en Netlify, borrá esa variable: el frontend todavía no lo manda.",
      origen_no_permitido: "El servidor rechazó la dirección desde la que abriste la app. Fijate desde qué URL estás entrando.",
    };
    if (e && e.codigo && porCodigo[e.codigo]) return porCodigo[e.codigo];
    // TypeError es lo que tira fetch cuando directamente no hay red.
    if (e instanceof TypeError) return "No hay conexión. Revisá tu internet y reintentá.";
    return "No pude analizar esto. Probá de nuevo, con un poco más de detalle o una foto más clara.";
  }

  // ---------- gráfico de peso: real contra plan ----------
  function weightChartSVG() {
    const ws = weighIns.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
    if (ws.length < 2) {
      return `<div class="small dim" style="padding:18px 0;">Cargá al menos dos pesajes para ver la curva y comparar tu bajada real contra el plan.</div>`;
    }
    const W = 300, H = 132;
    const inicio = ws[0], fin = ws[ws.length - 1];
    const span = Math.max(1, dayDiff(inicio.date, fin.date));

    // El plan se ancla en tu primer pesaje y baja en línea recta hasta el peso
    // objetivo en la fecha objetivo. Así no depende de goal.currentWeight, que
    // vas editando, y la comparación se mantiene estable.
    const planDias = goal.goalDate && dayDiff(inicio.date, goal.goalDate) > 0 ? dayDiff(inicio.date, goal.goalDate) : null;
    const planEn = (iso) => {
      if (!planDias) return null;
      const t = Math.min(1, Math.max(0, dayDiff(inicio.date, iso) / planDias));
      return inicio.weight + (goal.goalWeight - inicio.weight) * t;
    };
    const planFin = planEn(fin.date);

    const valores = ws.map((w) => w.weight).concat(planFin != null ? [planFin] : []);
    let min = Math.min.apply(null, valores), max = Math.max.apply(null, valores);
    const pad = Math.max(0.4, (max - min) * 0.2);
    min -= pad; max += pad;
    const rango = max - min || 1;
    const X = (iso) => (dayDiff(inicio.date, iso) / span) * W;
    const Y = (v) => H - ((v - min) / rango) * H;

    const puntos = ws.map((w) => `${X(w.date).toFixed(1)},${Y(w.weight).toFixed(1)}`).join(" ");
    const circulos = ws.map((w, i) =>
      i === ws.length - 1
        ? `<circle cx="${X(w.date).toFixed(1)}" cy="${Y(w.weight).toFixed(1)}" r="5" fill="var(--amber)"></circle>`

    ).join("");

    const lineaPlan = planFin != null
      ? `<line x1="0" y1="${Y(inicio.weight).toFixed(1)}" x2="${W}" y2="${Y(planFin).toFixed(1)}" stroke="var(--textDim)" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round" opacity=".55"></line>`
      : "";

    return `<svg width="100%" viewBox="0 0 ${W} ${H + 24}" style="display:block;overflow:visible;">

      <line x1="0" y1="${(H / 2).toFixed(0)}" x2="${W}" y2="${(H / 2).toFixed(0)}" stroke="var(--surfaceRaised)" stroke-width="1"></line>
      <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--surfaceRaised)" stroke-width="1"></line>
      ${lineaPlan}
      <polyline points="${puntos}" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
      ${circulos}
      <text x="0" y="${H + 18}" fill="var(--textDim)" font-size="10" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">${formatDate(inicio.date)}</text>
      <text x="${W}" y="${H + 18}" text-anchor="end" fill="var(--textDim)" font-size="10" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">${formatDate(fin.date)}</text>
    </svg>`;
  }

  // ---------- datos compartidos por todas las pantallas ----------
  function computeCtx() {
    const dayStats = computeDayStats();
    const todayStr = todayISO();
    const todayStats = dayStats.find((d) => d.date === todayStr) || null;
    const todayClosed = !!(dayMeta[todayStr] && dayMeta[todayStr].closed);
    const settled = dayStats.filter((d) => !(d.date === todayStr && !d.closed));

    const totalKgToLose = Math.max(0, goal.currentWeight - goal.goalWeight);
    const goalKcal = totalKgToLose * KCAL_PER_KG;
    const totalDeficit = settled.reduce((s, d) => s + d.net, 0);
    const pct = goalKcal > 0 ? Math.min(100, Math.max(0, (totalDeficit / goalKcal) * 100)) : 0;
    const remaining = goalKcal - totalDeficit;
    const daysCount = dayStats.length;
    const kgLost = totalDeficit / KCAL_PER_KG;
    const daysLeft = daysBetween(todayISO(), goal.goalDate);
    const neededDailyAvg = remaining > 0 ? remaining / daysLeft : 0;
    const streak = computeDeficitStreak(settled);
    const badges = computeBadges({ streak, kgLost: Math.max(0, kgLost), pct });

    const avgConsumed = daysCount ? dayStats.reduce((s, d) => s + d.consumed, 0) / daysCount : 0;
    const avgProtein = daysCount ? dayStats.reduce((s, d) => s + d.protein, 0) / daysCount : 0;
    const avgCarbs = daysCount ? dayStats.reduce((s, d) => s + d.carbs, 0) / daysCount : 0;
    const avgFat = daysCount ? dayStats.reduce((s, d) => s + d.fat, 0) / daysCount : 0;
    const avgGasto = daysCount ? dayStats.reduce((s, d) => s + d.gasto, 0) / daysCount : goal.maintenance;
    const avgNet = daysCount ? totalDeficit / daysCount : 0;

    const proteinTarget = goal.proteinTarget || calcProteinTarget(goal.currentWeight);
    const todayProtein = todayStats ? todayStats.protein : 0;

    const wSorted = weighIns.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
    let calibration = null;
    const CALIBRATION_WINDOW_DAYS = 21;
    const recientes = wSorted.filter((w) => daysBetween(w.date, todayISO()) <= CALIBRATION_WINDOW_DAYS);
    if (recientes.length >= 2) {
      const first = recientes[0], last = recientes[recientes.length - 1];
      const days = daysBetween(first.date, last.date);
      if (days >= 5) {
        const actualKgLost = first.weight - last.weight;
        const actualKcalDeficit = actualKgLost * KCAL_PER_KG;
        const trackedKcalDeficit = dayStats.filter((d) => d.date >= first.date && d.date <= last.date).reduce((s, d) => s + d.net, 0);
        const discrepancyPerDay = (actualKcalDeficit - trackedKcalDeficit) / days;
        if (Math.abs(discrepancyPerDay) > 80) {
          const MAX_ADJUSTMENT_PER_STEP = 400;
          const MIN_MAINTENANCE = 1200;
          const capped = Math.max(-MAX_ADJUSTMENT_PER_STEP, Math.min(MAX_ADJUSTMENT_PER_STEP, discrepancyPerDay));
          const suggested = Math.max(MIN_MAINTENANCE, Math.round(goal.maintenance + capped));
          // Si ya postergaste exactamente esta sugerencia, no insistimos. Vuelve
          // a aparecer sola cuando un pesaje nuevo cambie el número.
          if (suggested !== calibrationDismissed) {
            calibration = { discrepancyPerDay, cappedAdjustment: capped, suggestedMaintenance: suggested, days, actualKgLost };
          }
        }
      }
    }

    let missingDates = [];
    if (dayStats.length > 0) {
      const sorted = dayStats.map((d) => d.date).sort();
      const lastDate = sorted[sorted.length - 1];
      const yesterday = addDaysISO(todayISO(), -1);
      if (lastDate < yesterday) {
        const existing = new Set(sorted);
        let cursor = addDaysISO(lastDate, 1), guard = 0;
        while (cursor <= yesterday && guard < 120) {
          if (!existing.has(cursor)) missingDates.push(cursor);
          cursor = addDaysISO(cursor, 1); guard++;
        }
      }
    }

    return {
      dayStats, todayStr, todayStats, todayClosed, settled, goalKcal, totalDeficit, pct,
      remaining, daysCount, kgLost, daysLeft, neededDailyAvg, streak, badges,
      avgConsumed, avgProtein, avgCarbs, avgFat, avgGasto, avgNet,
      proteinTarget, todayProtein, wSorted, calibration, missingDates,
      showGapBanner: missingDates.length > 0 && !gapChoiceMade,
      avgForFill: { consumed: avgConsumed, protein: avgProtein, carbs: avgCarbs, fat: avgFat, gasto: avgGasto, net: avgNet },
    };
  }

  // ---------- PANTALLA: HOY ----------

    // El titular es en kilos, no en kilocalorías: 77.000 kcal no se siente, 2,4 kg sí.
    h += `<div style="display:flex;align-items:baseline;gap:8px;">

      </div>`;

    // Tarjeta del día
    const consumidoHoy = c.todayStats ? c.todayStats.consumed : 0;

          <div style="flex:1;min-width:0;">

    if (showCloseDayConfirm && c.todayStats) {

        <div style="font-weight:700;margin-bottom:10px;">Resumen final de hoy</div>
        <div class="col gap6" style="margin-bottom:12px;">
          ${c.todayStats.meals.map((m) => `<div class="row" style="justify-content:space-between;font-size:12px;"><span class="dim" style="font-style:italic;">${esc(m.note)}</span><span>${m.consumed.toFixed(0)} kcal</span></div>`).join("")}

          <button class="btn-secondary" onclick="cancelCloseDayConfirm()">Seguir agregando</button>

    return h + `</div>`;
  }

  // ---------- PANTALLA: HISTORIAL ----------

    c.dayStats.forEach((day) => {
      const bal = formatBalance(day.net);
      h += `<div style="background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;">

  // ---------- PANTALLA: PROGRESO ----------
  function screenProgreso(c) {
    const ws = c.wSorted;
    const ultimo = ws.length ? ws[ws.length - 1] : null;
    const primero = ws.length ? ws[0] : null;
    const bajado = primero && ultimo ? primero.weight - ultimo.weight : 0;
    const diasPesaje = primero && ultimo ? Math.max(1, dayDiff(primero.date, ultimo.date)) : 0;
    const ritmoSemanal = diasPesaje > 0 ? (bajado / diasPesaje) * 7 : 0;

    let h = `<div class="screen">
      <div class="topbar"><div style="font-size:22px;font-weight:700;">Progreso</div></div>`;

    h += `<div class="card">
      <div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:16px;">
        <div class="title">Peso</div>
        <div class="row gap14">
          <span class="xs dim"><span class="dash" style="background:var(--amber);"></span>Real</span>
          <span class="xs dim"><span class="dash" style="background:var(--textDim);"></span>Plan</span>
        </div>
      </div>
      ${weightChartSVG()}`;

    if (ultimo) {
      h += `<div class="row gap24" style="margin-top:14px;flex-wrap:wrap;">
        <div><div class="stat-label">Ahora</div><div style="font-size:20px;font-weight:700;">${ultimo.weight.toFixed(1)} <span class="small dim" style="font-weight:400;">kg</span></div></div>
        <div><div class="stat-label">Bajaste</div><div style="font-size:20px;font-weight:700;color:${bajado >= 0 ? "var(--sage)" : "var(--rust)"};">${bajado >= 0 ? "-" : "+"}${Math.abs(bajado).toFixed(1)} <span class="small dim" style="font-weight:400;">kg</span></div></div>
        <div><div class="stat-label">Ritmo</div><div style="font-size:20px;font-weight:700;">${Math.abs(ritmoSemanal).toFixed(1)} <span class="small dim" style="font-weight:400;">kg/sem</span></div></div>
      </div>`;
    }
    h += `</div>`;

    if (c.calibration) {
      const cal = c.calibration;
      const kgWord = cal.actualKgLost >= 0 ? "bajaste" : "subiste";
      const dirWord = cal.discrepancyPerDay > 0 ? "más alto" : "más bajo";
      const wasCapped = Math.abs(cal.discrepancyPerDay) > Math.abs(cal.cappedAdjustment);
      h += `<div class="card" style="border-color:var(--amber);">
        <div class="row gap8" style="align-items:center;margin-bottom:8px;">${icon("tune", "var(--amber)", 17)}<div class="small" style="font-weight:700;">Ajuste sugerido</div></div>
        <div class="small dim" style="line-height:1.45;margin-bottom:14px;">En ${cal.days} días ${kgWord} ${Math.abs(cal.actualKgLost).toFixed(1)} kg reales, pero lo registrado sugiere otro ritmo. Tu gasto base real parece estar ${dirWord}: cerca de <span style="color:var(--text);font-weight:700;">${cal.suggestedMaintenance} kcal</span>, no ${goal.maintenance}.</div>
        ${Math.abs(cal.discrepancyPerDay) > 800 ? `<div class="xs" style="color:var(--rust);margin-bottom:10px;">Este desajuste es muy grande para ser solo metabolismo — fijate si te faltó cargar alguna comida o algún día entero.</div>` : ""}
        ${wasCapped ? `<div class="xs dim" style="margin-bottom:10px;">Para no sobrecorregir con pocos datos, el ajuste se aplica de a pasos de máximo 400 kcal/día.</div>` : ""}
        <div class="row gap10">
          <button class="btn-primary" style="flex:1;" onclick="applyCalibration(${cal.suggestedMaintenance})">Aplicar</button>
          <button class="btn-secondary" style="flex:1;" onclick="dismissCalibration(${cal.suggestedMaintenance})">Ahora no</button>
        </div>
      </div>`;
    }

    h += `<div class="card" style="margin-bottom:0;">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div class="title">Pesajes</div>
      </div>
      <div class="small dim" style="margin-bottom:12px;">Cargá tu peso real cada semana. Con al menos dos pesajes la app compara tu bajada real contra el déficit calculado.</div>
      <div class="row gap10" style="margin-bottom:14px;">
        <input id="weighin-date" type="date" value="${todayISO()}" style="flex:1;">
        <input id="weighin-weight" type="text" inputmode="decimal" placeholder="Peso (kg)" style="flex:1;">
        <button class="btn-primary" style="flex-shrink:0;" onclick="addWeighIn()">Guardar</button>
      </div>`;

    if (ws.length) {
      h += `<div class="col gap8">`;
      ws.slice().reverse().forEach((w, i, arr) => {
        const anterior = arr[i + 1];
        const delta = anterior ? w.weight - anterior.weight : null;
        if (editingWeighInId === w.id) {
          h += `<div class="row" style="justify-content:space-between;align-items:center;background:var(--surfaceRaised);border-radius:10px;padding:10px 12px;gap:8px;border:1px solid var(--amber);">
            <span class="small">${formatDate(w.date)}</span>
            <input id="edit-weighin-val-${w.id}" type="text" inputmode="decimal" value="${w.weight}" style="width:86px;padding:6px 8px;">
            <button class="btn-ghost" onclick="saveEditWeighIn('${w.id}')" aria-label="Guardar">${icon("check", "var(--sage)", 18)}</button>
            <button class="btn-ghost" onclick="cancelEditWeighIn()" aria-label="Cancelar">${icon("close", "var(--textDim)", 18)}</button>
          </div>`;
        } else {
          h += `<div class="row" style="justify-content:space-between;align-items:center;background:var(--surfaceRaised);border-radius:10px;padding:10px 12px;gap:8px;">
            <span class="small" style="flex:1;min-width:0;">${formatDate(w.date)}</span>
            ${delta != null ? `<span class="xs" style="color:${delta <= 0 ? "var(--sage)" : "var(--rust)"};">${delta <= 0 ? "" : "+"}${delta.toFixed(1)}</span>` : ""}
            <span style="font-weight:700;font-size:15px;">${w.weight.toFixed(1)} kg</span>
            <button class="btn-ghost" onclick="startEditWeighIn('${w.id}')" aria-label="Editar">${icon("pencil", "var(--textDim)", 16)}</button>
            <button class="btn-ghost" onclick="removeWeighIn('${w.id}')" aria-label="Borrar">${icon("trash", "var(--textDim)", 16)}</button>
          </div>`;
        }
      });
      h += `</div>`;
    }

    h += `</div>`;

    // Promedios diarios: dato de contexto, no protagonista.
    h += `<div class="card">
      <div class="title" style="margin-bottom:14px;">Promedio diario</div>
      ${c.daysCount === 0
        ? `<div class="small dim">Todavía no hay días registrados.</div>`
        : `<div class="grid4">${Stat("Consumido", c.avgConsumed.toFixed(0))}${Stat("Proteína", c.avgProtein.toFixed(0) + " g", "var(--protein)")}${Stat("Carbos", c.avgCarbs.toFixed(0) + " g", "var(--carbs)")}${Stat("Grasa", c.avgFat.toFixed(0) + " g", "var(--fat)")}</div>`}
    </div>`;

    return h + `</div>`;
  }

  // ---------- PANTALLA: AJUSTES ----------
  function screenAjustes(c) {
    let h = `<div class="screen">
      <div class="topbar">
        <div style="font-size:22px;font-weight:700;">Ajustes</div>
        <button class="btn-secondary" onclick="toggleTheme()">${goal.theme === "light" ? "Oscuro" : "Claro"}</button>
      </div>`;

    h += `<div class="card">
      <div class="title" style="margin-bottom:12px;">Objetivo</div>
      <div class="grid2" style="margin-bottom:12px;">
        <div><label class="label">Peso actual (kg)</label><input type="text" inputmode="decimal" value="${esc(goal.currentWeight)}" onchange="updateGoalField('currentWeight', this.value, true)"></div>
        <div><label class="label">Peso objetivo (kg)</label><input type="text" inputmode="decimal" value="${esc(goal.goalWeight)}" onchange="updateGoalField('goalWeight', this.value, true)"></div>
      </div>
      <div class="grid2">
        <div><label class="label">Fecha objetivo</label><input type="date" value="${esc(goal.goalDate)}" onchange="updateGoalField('goalDate', this.value, false)"></div>
        <div><label class="label">Gasto base diario (kcal)</label><input type="number" value="${esc(goal.maintenance)}" onchange="updateGoalField('maintenance', this.value, true)"></div>
      </div>
      <div class="xs dim" style="margin-top:10px;">El gasto base se usa solo los días en que no dictes un total de gasto de una app (Google Fit, reloj, etc).</div>
    </div>`;

    h += `<div class="card">
      <div class="title" style="margin-bottom:10px;">Umbral de superávit</div>
      <div class="grid2"><div><label class="label">Amarillo → rojo a partir de (kcal)</label><input type="number" step="10" value="${esc(goal.surplusAlertThreshold ?? 300)}" onchange="updateGoalField('surplusAlertThreshold', this.value, true)"></div></div>
      <div class="xs dim" style="margin-top:6px;">Un superávit por debajo de este número se muestra en amarillo; por encima, en rojo.</div>
    </div>`;

    h += `<div class="card">
      <div class="title" style="margin-bottom:10px;">Datos personales</div>
      <div class="grid2" style="margin-bottom:12px;">
        <div><label class="label">Altura (cm)</label><input type="number" value="${esc(goal.height || "")}" onchange="updateGoalField('height', this.value, true)"></div>
        <div><label class="label">Edad</label><input type="number" value="${esc(goal.age || "")}" onchange="updateGoalField('age', this.value, true)"></div>
      </div>
      <div style="margin-bottom:12px;"><label class="label">Sexo</label>
        <select onchange="updateGoalField('gender', this.value, false)">
          <option value="male" ${goal.gender === "male" ? "selected" : ""}>Masculino</option>
          <option value="female" ${goal.gender === "female" ? "selected" : ""}>Femenino</option>
        </select>
      </div>
      <div class="xs dim" style="margin-bottom:12px;">Este cálculo es siempre tu base sin ejercicio. El ejercicio se suma aparte, día a día, cuando lo dictás.</div>
      <button class="btn-secondary" onclick="recalcMaintenance()">Recalcular gasto base</button>
    </div>`;

    h += `<div class="card">
      <div class="title" style="margin-bottom:10px;">Proteína diaria</div>
      <div class="grid2" style="margin-bottom:10px;"><div><label class="label">Gramos por día</label><input type="number" value="${esc(goal.proteinTarget || calcProteinTarget(goal.currentWeight))}" onchange="updateGoalField('proteinTarget', this.value, true)"></div></div>
      <div class="xs dim" style="margin-bottom:12px;">Por defecto, 1,8 g por kg de tu peso actual. Lo podés pisar con tu propio número.</div>
      <button class="btn-secondary" onclick="recalcProteinTarget()">Recalcular (1,8 g/kg)</button>
    </div>`;

    h += `<div class="card">
      <div class="title" style="margin-bottom:8px;">Copia de seguridad</div>
      <div class="xs dim" style="margin-bottom:12px;">Tus datos viven solo en este navegador. Si cambiás de celular o borrás datos de Safari, se pierden. Descargá un respaldo cada tanto.</div>
      <div class="row gap10" style="flex-wrap:wrap;">
        <button class="btn-secondary" onclick="exportBackup()">Descargar respaldo</button>
        <button class="btn-secondary" onclick="triggerImport()">Restaurar respaldo</button>
        <input id="backup-file-input" type="file" accept="application/json" style="display:none" onchange="handleImportFile(this)">
      </div>
      ${importMsg ? `<div class="small" style="color:var(--sage);margin-top:10px;">${esc(importMsg)}</div>` : ""}
    </div>`;

    h += `<div class="card">
      <div class="title" style="margin-bottom:8px;color:var(--rust);">Zona de peligro</div>
      <div class="xs dim" style="margin-bottom:12px;">Borra todas tus comidas, pesajes, racha y objetivo, y te lleva de nuevo a la bienvenida. No se puede deshacer.</div>
      ${showResetConfirm
        ? `<div style="background:var(--surfaceRaised);border:1px solid var(--rust);border-radius:10px;padding:14px;">
            <div style="font-weight:700;margin-bottom:10px;">¿Seguro que querés borrar todo?</div>
            <div class="row gap10">
              <button class="btn-secondary" style="border-color:var(--rust);color:var(--rust);flex:1;" onclick="confirmResetAllData()">Sí, borrar todo</button>
              <button class="btn-secondary" style="flex:1;" onclick="cancelResetConfirm()">Cancelar</button>
            </div>
          </div>`
        : `<button class="btn-secondary" style="border-color:var(--rust);color:var(--rust);" onclick="openResetConfirm()">Borrar todo y empezar de cero</button>`}
    </div>`;

    // La cadena de versión vive acá, no en la pantalla principal: es una nota
    // de desarrollo, no información para el usuario.
    h += `<div class="xs dim" style="text-align:center;padding:8px 0 4px;">${APP_VERSION}</div>`;

    return h + `</div>`;
  }

  // ---------- HOJA DE CARGA ----------
  function sheetCaptura(c) {
    let h = `<div class="sheet-backdrop" onclick="closeCapture()"></div><div class="sheet">
      <div class="grab"></div>`;

    if (parsed) {
      // Resultado del análisis: primero la frase que entendió el modelo, para
      // que un malentendido se vea antes de mirar ningún número.
      const maxMacro = Math.max(parsed.protein, parsed.carbs, parsed.fat, 1);
      const barra = (label, val, color) => `<div>
        <div class="row" style="justify-content:space-between;font-size:12px;margin-bottom:5px;"><span>${label}</span><span class="dim">${val.toFixed(0)} g</span></div>
        <div class="track" style="height:5px;"><i style="width:${((val / maxMacro) * 100).toFixed(0)}%;background:${color};"></i></div>
      </div>`;

      h += `<div class="stat-label" style="margin-bottom:6px;">Esto entendí</div>
      <div style="font-size:16px;line-height:1.35;margin-bottom:18px;">${esc(parsed.note)}</div>

      <div class="row" style="align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:12px;">
        <div class="row" style="align-items:baseline;gap:6px;">
          <div style="font-size:42px;font-weight:700;line-height:1;letter-spacing:-1px;">${parsed.consumed.toFixed(0)}</div>
          <div class="small dim">kcal</div>
        </div>
        ${parsed.nutritionScore != null ? `<div class="row gap8" style="align-items:center;">
          <span style="background:${nutritionColor(parsed.nutritionScore)};color:#fff;border-radius:999px;padding:4px 11px;font-size:14px;font-weight:700;">${parsed.nutritionScore}/10</span>
          <span class="small dim" style="max-width:120px;">${esc(parsed.nutritionComment || "")}</span>
        </div>` : ""}
      </div>

      <div class="col gap12" style="margin-bottom:18px;">
        ${barra("Proteína", parsed.protein, "var(--protein)")}
        ${barra("Carbohidratos", parsed.carbs, "var(--carbs)")}
        ${barra("Grasas", parsed.fat, "var(--fat)")}
      </div>`;

      if (parsed.totalExpenditure != null || parsed.exercise != null) {
        h += `<div class="grid2" style="margin-bottom:18px;">
          ${parsed.totalExpenditure != null ? Stat("Gasto del día (app)", parsed.totalExpenditure.toFixed(0) + " kcal", "var(--amber)") : ""}
          ${parsed.exercise != null ? Stat("Ejercicio", parsed.exercise.toFixed(0) + " kcal", "var(--amber)") : ""}
        </div>`;
      }

      h += `<div class="xs dim" style="margin-bottom:16px;">Se suma como una comida más de hoy. Si algún número está mal, guardalo igual y corregilo después desde Historial.</div>
      <div class="row gap10">
        <button class="btn-secondary" style="width:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;" onclick="discardParsed()" aria-label="Descartar">${icon("close", "var(--textDim)", 19)}</button>
        <button class="btn-sage big-btn" style="flex:1;" onclick="confirmSave()">Guardar comida</button>
      </div>`;

      return h + `</div>`;
    }

    h += `<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div style="font-size:18px;font-weight:700;">¿Qué comiste?</div>
      <button class="icon-btn" onclick="closeCapture()" aria-label="Cerrar">${icon("close", "var(--textDim)", 20)}</button>
    </div>

    <textarea id="dictation-textarea" rows="4" placeholder="Ej: para el almuerzo comí una milanesa con puré y una manzana de postre… (y si tenés: hoy Google Fit me dijo que gasté 2400 calorías)" style="resize:vertical;margin-bottom:12px;">${esc(dictationDraft)}</textarea>
    <input id="photo-file-input" type="file" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoFile(this)">`;

    if (photo) {
      const kb = Math.round((photo.dataUrl.length * 0.75) / 1024);
      h += `<div class="row gap12" style="align-items:center;background:var(--surfaceRaised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;">
        <img src="${photo.dataUrl}" alt="Foto de la comida" style="width:46px;height:46px;border-radius:8px;object-fit:cover;flex-shrink:0;">
        <div style="flex:1;min-width:0;">
          <div class="small">Foto adjunta</div>
          <div class="xs dim">Redimensionada a 1024 px · ${kb} KB</div>
        </div>
        <button class="btn-ghost" onclick="removePhoto()" aria-label="Quitar foto">${icon("close", "var(--textDim)", 18)}</button>
      </div>`;
    }

    if (errorMsg) h += `<div class="small" style="color:var(--rust);margin-bottom:12px;">${esc(errorMsg)}</div>`;

    h += `<div class="row gap10" style="margin-bottom:10px;">
      <button class="btn-secondary big-btn" style="flex:1;" onclick="focusDictation()">${icon("mic", "var(--text)", 19)} Dictar</button>
      <button class="btn-secondary big-btn" style="flex:1;" onclick="triggerPhoto()">${icon("camera", "var(--text)", 19)} ${photo ? "Otra foto" : "Foto"}</button>
    </div>
    <button class="btn-primary big-btn" style="width:100%;" onclick="analyze()" ${analyzing ? "disabled" : ""}>${analyzing ? '<span class="spin">↻</span> Analizando…' : "Analizar"}</button>`;

    return h + `</div>`;
  }

  function renderApp() {
    const c = computeCtx();
    let html = "";
    if (activeTab === "historial") html += screenHistorial(c);
    else if (activeTab === "progreso") html += screenProgreso(c);
    else if (activeTab === "ajustes") html += screenAjustes(c);
    else html += screenHoy(c);

    html += navMarkup();
    if (showCapture) html += sheetCaptura(c);

    document.getElementById("root").innerHTML = html;
  }

  function saveDictationDraft() {
    const t = document.getElementById("dictation-textarea");
    if (t) dictationDraft = t.value;
  }

  function render() {
    // Antes de reemplazar el DOM, rescatamos lo tipeado: de lo contrario
    // cualquier acción que redibuje (adjuntar foto, un error) lo borraba.
    saveDictationDraft();
    if (loading) { renderLoading(); return; }
    if (!goal.onboarded) { renderOnboarding(); return; }
    renderApp();
  }

  loadAll();
})();
</script>
</body>
</html>
